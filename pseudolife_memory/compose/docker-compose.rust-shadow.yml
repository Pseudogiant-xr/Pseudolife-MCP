# Opt-in read-only companion. Never changes the main daemon service.
services:
  pseudolife-rust-shadow:
    image: ${PSEUDOLIFE_RUST_IMAGE:-pseudolife-daemon-rust:checkout}
    build:
      context: ..
      dockerfile: ops/Dockerfile.daemon-rust
      args:
        GIT_SHA: ${PSEUDOLIFE_BUILD_GIT_SHA:-unknown}
        GIT_DIRTY: ${PSEUDOLIFE_BUILD_DIRTY:-unknown}
        BUILD_TIME: ${PSEUDOLIFE_BUILD_TIME:-unknown}
        BUILD_SOURCE: checkout
    restart: unless-stopped
    # The Python writer's daemon user (ops/Dockerfile.daemon): it owns /data
    # and leaves config.yaml 0600, which root without capabilities cannot
    # read (#1316). The image gives /models to the same user.
    user: "10001:10001"
    labels:
      org.pseudolife.shadow.configuration: ${PSEUDOLIFE_SHADOW_CONFIGURATION:-}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: ${PSEUDOLIFE_DAEMON_MEM_LIMIT:-6g}
    memswap_limit: ${PSEUDOLIFE_DAEMON_MEM_LIMIT:-6g}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    environment:
      PSEUDOLIFE_READ_ONLY: "1"
      PSEUDOLIFE_MCP_DATABASE_URL: postgresql://pseudolife_shadow:${PSEUDOLIFE_SHADOW_DB_PASSWORD:?Run update --engine rust --shadow}@pseudolife-pg:5432/${PSEUDOLIFE_SHADOW_DB_NAME:-pseudolife_memory}
      PSEUDOLIFE_MCP_HOST: 0.0.0.0
      PSEUDOLIFE_MCP_PORT: "8765"
      PSEUDOLIFE_MCP_DATA_DIR: /data
      PSEUDOLIFE_DAEMON_MODELS_DIR: /models
      PSEUDOLIFE_MCP_TRUST_BIND: "1"
      PSEUDOLIFE_MCP_TOKEN: ${PSEUDOLIFE_MCP_TOKEN:-}
      PSEUDOLIFE_MCP_TOKENS: ${PSEUDOLIFE_MCP_TOKENS:-}
      CUDA_VISIBLE_DEVICES: "-1"
      # The writer's own settings (ops/docker-compose.yml), so local times,
      # writer identity and tool tiers read as they do from Python.
      TZ: ${TZ:-UTC}
      PSEUDOLIFE_WRITER_ID: ${PSEUDOLIFE_WRITER_ID:-mcp-client}
      PSEUDOLIFE_MCP_TOOLSET: ${PSEUDOLIFE_MCP_TOOLSET:-core}
      PSEUDOLIFE_MCP_TIER_MAP: ${PSEUDOLIFE_MCP_TIER_MAP:-}
    ports:
      - "127.0.0.1:${PSEUDOLIFE_SHADOW_PORT:-8766}:8765"
    volumes:
      - pseudolife_data:/data:ro
      - pseudolife_shadow_models:/models
    depends_on:
      pseudolife-pg:
        condition: service_healthy

volumes:
  pseudolife_shadow_models: {}
