[package]
name = "pseudolife-daemon"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Contract-first Rust port of the Pseudolife memory daemon"

[[bin]]
name = "pseudolife-daemon"
path = "src/main.rs"

[features]
# Deliberate breaks for the harness mutant control; never in a release build.
mutants = []
# The harness-only tool route (POST /api/_harness/tool/<name>); never in a release build.
harness = []

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-postgres = { workspace = true, features = ["with-serde_json-1", "with-chrono-0_4"] }
serde_json.workspace = true
chrono.workspace = true
sha2.workspace = true
percent-encoding.workspace = true
regex.workspace = true
yaml-rust2.workspace = true
uuid.workspace = true
unicode-casefold.workspace = true
# Crate-local pins: the versions the 2026-10-09 contract-first spike was proven with.
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
anyhow = "=1.0.104"
hex = "=0.4.3"
form_urlencoded = "=1.2.2"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic", "ndarray", "std"] }
ndarray = "=0.16.1"
# Python-compatible regexes (lookaround) for the write-path heuristics; the
# version tokenizers already pulls in.
fancy-regex = "=0.14.0"
tokenizers = { version = "=0.21.4", default-features = false, features = ["fancy-regex"] }
