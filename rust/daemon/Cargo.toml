[package]
name = "pseudolife-daemon"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Contract-first Rust port of the Pseudolife memory daemon"

[[bin]]
name = "pseudolife-daemon"
path = "src/main.rs"

[[bin]]
name = "graph-contract"
path = "harness/graph_contract.rs"
required-features = ["graph-harness"]

[features]
# Deliberate breaks for the harness mutant control; never in a release build.
mutants = []
contract-harness = []
graph-harness = []

[[bin]]
name = "dream-contract"
path = "src/bin/dream-contract.rs"
required-features = ["contract-harness"]

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-postgres = { workspace = true, features = ["with-serde_json-1", "with-chrono-0_4"] }
serde_json.workspace = true
serde.workspace = true
http-body-util.workspace = true
chrono.workspace = true
sha2.workspace = true
hmac.workspace = true
base64 = "=0.22.1"
getrandom = "=0.3.4"
percent-encoding.workspace = true
regex.workspace = true
yaml-rust2.workspace = true
# Crate-local pins: the versions the 2026-10-09 contract-first spike was proven with.
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
anyhow = "=1.0.104"
hex = "=0.4.3"
indexmap = "=2.14.2"
reqwest.workspace = true
libc.workspace = true
form_urlencoded = "=1.2.2"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic", "ndarray", "std"] }
ndarray = "=0.16.1"
tokenizers = { version = "=0.21.4", default-features = false, features = ["fancy-regex"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Registry"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
futures.workspace = true
