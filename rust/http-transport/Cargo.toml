[package]
name = "pseudolife-http"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "Apache-2.0"
description = "Opt-in streaming HTTP transport for the Pseudolife MCP shim"

[dependencies]
base64 = "=0.22.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls-no-alpn", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "io-std", "io-util", "sync", "time"] }
