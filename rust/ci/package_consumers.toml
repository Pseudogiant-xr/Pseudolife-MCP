# First matching glob and kind wins. Globs match repo-relative paths with "/".
# "*" also spans directories. Keep exceptions ahead of their enclosing area.

[[rules]]
globs = ["evals/results/*", "evals/subagent_tier_bench/results/*", "evals/subagent_tier_bench/results-pilot-20261014.json"]
kinds = ["command", "documentation", "metadata", "path", "python-import"]
class = "historical evidence"
reason = "Recorded commands preserve the provenance of earlier runs."

[[rules]]
globs = ["evals/rust_port/*", "evals/rust_baseline/*"]
kinds = ["command", "documentation", "metadata", "path", "python-import"]
class = "retained test tooling"
reason = "The current Rust parity and precheck tools still consume these harnesses. Repoint those consumers before removal."
retire_with_package = true

[[rules]]
globs = ["evals/prompts/*"]
kinds = ["documentation"]
class = "active dependency"
reason = "The Rust daemon build and native shims use these prompt assets."

[[rules]]
globs = ["evals/gen_assistant_facts_prompts.py", "evals/gen_shim_prompt.py"]
kinds = ["path", "python-import"]
class = "active dependency"
reason = "Before package deletion, move prompt ownership off the frozen Python constants and switch or retire these generators."

[[rules]]
globs = ["evals/README.md", "evals/RUST-DRIVERS.md"]
kinds = ["documentation"]
class = "historical evidence"
reason = "The historical benchmark sections preserve their original Python commands and evidence."

[[rules]]
globs = ["evals/qwen_server.ps1"]
kinds = ["command", "path"]
class = "intentional legacy compatibility"
reason = "The unchanged launcher uses the frozen checkout CLI for its GPU lease when present and supports the installed native CLI."

