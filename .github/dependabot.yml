# Dependabot configuration.
#
# This file exists for its `ignore` rules, which apply to Dependabot's
# grouped SECURITY updates (the only kind this repo has ever received —
# there was no dependabot.yml before this file, so scheduled version
# updates were never enabled). `open-pull-requests-limit: 0` keeps it
# that way: no scheduled version-update PRs, security updates unchanged
# except where ignored below.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/ops"
    schedule:
      interval: "weekly"
    # Ignore-only: do not open scheduled version-update PRs.
    open-pull-requests-limit: 0
    ignore:
      # setuptools is HELD below 82 by torch's own metadata: the pinned
      # torch 2.12.0 declares `setuptools<82`, and because a pip
      # constraint file cannot be negotiated, a lockfile setuptools pin
      # above that ceiling makes pip discard the pinned CPU torch and
      # re-resolve from PyPI — whose linux torch wheel is the CUDA build
      # (~4 GB of nvidia-* wheels in a CPU-only image). Exactly this
      # shipped silently from a Dependabot bump to 83.0.0 (17b97180,
      # 2026-07-24) until 2026-07-29. CI now fails such a bump
      # (tests/test_daemon_image_is_cpu_only.py names the conflict), and
      # this rule stops the PR from being re-proposed at all. Lift it
      # only when bumping torch past the ceiling in the same change —
      # see the coupling note in ops/requirements.lock.txt.
      - dependency-name: "setuptools"
        versions: [">=82"]
      # transformers is HELD below 4.58 by optimum-onnx's own metadata:
      # optimum-onnx (the ONNX embedding backend the image ships as its
      # default) declares `transformers<4.58`, and pip installs the daemon
      # with the lockfile as a constraint file, so a lockfile pin on
      # transformers 5.x cannot resolve at all. Offline mode and baked
      # weights do not by themselves make every model-loading path
      # unreachable. The daemon contains GHSA-xrqw-3rrv-vx5w by verifying
      # the exact local ONNX artifact before construction, which prevents
      # SentenceTransformers/Optimum auto-export and its preprocessor save.
      # See the coupling note in ops/requirements.lock.txt. Dependabot
      # proposed exactly this (#252, 2026-09-03, transformers 5.10.1)
      # against optimum-onnx 0.1.0, still the latest release on
      # 2026-09-06. Lift the rule only when bumping optimum-onnx to a
      # release that supports patched transformers 5.x in the same change.
      - dependency-name: "transformers"
        versions: [">=5"]
