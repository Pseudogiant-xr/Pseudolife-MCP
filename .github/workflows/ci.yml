# CI (P2, 2026-07-02 review; lite-tier lanes added 2026-08-14): the full
# suite runs on every merge instead of only when someone remembers.
# Suite lanes (every lane runs only live test files, tests/suite_classes.txt):
#   * test            — full suite vs the production-parity PG 18 service
#                       container (pgvector image, same as the Docker tier
#                       since the 2026-08-14 16→18 bump), every test on the
#                       real embedding weights (PSEUDOLIFE_TEST_EMBEDDER=real);
#   * test-lite-windows — the product paths that differ on Windows (embedded
#                       provider, backup round trip, shim daemon spawn,
#                       credential ACLs, tunnel DPAPI and process handling,
#                       the msvcrt locks) on a real Windows runner, with no
#                       retries. Windows runners cannot host service
#                       containers at all, so embedded PG is the only
#                       Postgres coverage possible there; the FULL suite on
#                       Windows stays future work (embedder wall-time).
#   * test-windows-nightly — not a merge gate: the process-spawning installer,
#                       hook, board and test-tooling plumbing on Windows,
#                       nightly and by hand, with one recorded retry
#                       (split from test-lite-windows 2026-10-20).
#   * test-lite-macos — the plugin hooks and client installers on a real
#                       macOS runner (bash 3.2, BSD stat/base64/ps, shasum),
#                       plus the embedded provider on its macOS wheel. Their
#                       BSD fallbacks run nowhere else (added 2026-09-27).
# Kept lean: master-push, PR and merge-queue triggers, cancel-in-progress,
# pip + HuggingFace caches, diagnostic artifacts for the full Linux lanes.
#
# Rust-only pull requests (maintainer decision 2026-10-09): a PR that touches
# rust/ and whose every other changed file is .github/workflows/rust.yml,
# CHANGELOG.md or a changelog.d/ fragment changes no Python, so the Python
# suite lanes are skipped for it and the `guards` job runs the
# tree-wide and release-doc guards
# instead (tracked-tree identifiers and control bytes, CHANGELOG and release
# pins, committed eval evidence). The Rust workflow is that PR's gate. Since
# the Python freeze (14 November 2026) the master push that merges such a
# batch skips them too, and the next nightly runs them on master's tip
# (ops/ci_push_passed.py --not-if-job-passed guards); `guards` runs the live
# tests that read rust/ files on that push.
#
# The Python freeze also split tests/ (tests/suite_classes.txt): a run
# collects only the live files unless pytest gets --include-frozen, which
# `test` passes (scope's include_frozen, through ops/ci_tests.sh) for a
# change to the frozen package (a freeze exception), an unreadable diff and
# the weekly nightly (Sunday UTC). The Windows and macOS lanes name live
# files only, so the switch would add nothing there. The lite tier is dropped, and with it test-lite-linux (the
# whole suite on embedded PostgreSQL); the Windows and macOS lanes keep their
# names and run the live files of their selections.
#
# Ordinary pull requests (2026-10-21): a PR merges through
# an integration batch (docs/dev/merge-batches.md), whose own PR from an
# integrate/* branch runs every lane, so a push to any other PR branch runs
# only the fast lanes: scope, guards, lock-resolve and frontend. Since
# 2026-10-29 that includes a PR changing CI or dependency inputs (workflows,
# pyproject.toml, a lock file, the Rust toolchain pin): only batches spend
# the heavy lanes (maintainer decision), and the batch runs the edited
# workflow on a head containing the edit before it reaches master. The
# `test` job is skipped there, which reports success to its required check.
# A newer push to an ordinary PR cancels its older run; nothing else is
# ever cancelled (see `concurrency`). The nightly and manual runs are
# unchanged.
#
# Master pushes (2026-10-24): a batch merges with a merge commit whose tree
# is its head's (ops/integrate.py merge refuses otherwise), so on a push of
# that merge each lane below that PASSED on the batch pull request's latest
# run of this workflow, on that head, is skipped (ops/ci_batch_passed.py;
# its docstring lists every check, and any failed check or API error skips
# nothing). A lane the batch skipped runs, except that a Rust-only batch's
# push skips the Python lanes too since the Python freeze (scope, below).
# The nightly stays the full backstop; no required check reads a push run.
#
# Merge queue (docs/specs/2026-10-19-merge-queue.md): `merge_group` runs the
# same jobs under the same check names, so the ruleset's required `test` check
# reports for a queued group. A group is classified like a pull request, over
# everything it adds to master (master's current tip to the group head).
name: CI

on:
  push:
    branches: [master]
  pull_request:
  merge_group:
  schedule:
    # Nightly full run on master (02:17 AEDT), so a Rust-only day still
    # gets a full Python suite.
    - cron: "17 15 * * *"
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN for every lane — CI only reads the repo
# (CodeQL actions/missing-workflow-permissions; the default token can write).
permissions:
  contents: read

concurrency:
  # Only an ordinary pull request (any head branch but integrate/*) is ever
  # cancelled: a newer push to it supersedes its older run, keyed by its
  # refs/pull/N/merge ref. Every other run gets a group of its own (its run
  # id), so nothing cancels it, running or pending: master pushes, the
  # nightly, manual runs, merge groups (the queue's verdict) and integrate/*
  # batch runs (maintainer, 2026-10-29). A shared group would not do, even
  # without cancel-in-progress: a newer run in a group cancels a pending
  # one. Actions' startsWith ignores case, so an Integrate/... branch is
  # never cancelled although scope treats it as ordinary.
  group: ${{ github.event_name == 'pull_request' && github.head_ref != '' && !startsWith(github.head_ref, 'integrate/') && format('ci-pr-{0}', github.ref) || format('ci-{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: true

jobs:
  scope:
    # Decides whether this run needs the Python suite lanes. A pull request
    # from any branch but integrate/* skips them, whatever it changes (fast
    # lanes only; its batch runs them). Otherwise only a pull request or merge group whose net
    # change is entirely under rust/, or is
    # .github/workflows/rust.yml, CHANGELOG.md or a changelog.d/ fragment,
    # skips them; an empty or unreadable diff runs everything. A pull
    # request's change is its merge commit vs its base parent (the base tip,
    # so its own net change, never what a forward merge brought in); a merge
    # group's is master's current tip (fetched here) to the group head.
    # On a master push it also lists the jobs the merged batch passed on the
    # same tree (batch_passed, a JSON list of job names; empty or absent
    # runs everything), which needs read access to Actions and pull requests.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      python: ${{ steps.scope.outputs.python }}
      # true for a batch, push or merge group whose change is Rust-only: the
      # guards job then also runs the live tests that read rust/ files.
      rust_only: ${{ steps.scope.outputs.rust_only }}
      # true when the frozen package's own tests must run too (the Classify
      # step says when). Only `test` reads it, and ops/ci_tests.sh turns it
      # into --include-frozen on its own pytest command line: an argument,
      # not PYTEST_ADDOPTS, which every pytest a test starts would inherit
      # (tests/test_suite_classes.py's own child runs, for one).
      include_frozen: ${{ steps.scope.outputs.include_frozen }}
      batch_passed: ${{ steps.batch.outputs.passed }}
      push_passed: ${{ steps.push.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: List the jobs the merged batch passed on this tree
        id: batch
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        # A crash leaves the output empty, which runs everything.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ops/ci_batch_passed.py --workflow .github/workflows/ci.yml --github-output "$GITHUB_OUTPUT"

      # The weekly whole-suite run, frozen files included: the Python
      # package still ships (the wheel and the Python daemon image, whose
      # dependencies are floors), so a dependency release can still break
      # it although its code is frozen. The Sunday (UTC) nightly, 02:17
      # AEDT on Monday; it never reuses the day's push, so `test` runs.
      - name: Decide whether this is the weekly run of the frozen tests
        id: weekly
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%u)" = 7 ]; then echo "frozen=true" >> "$GITHUB_OUTPUT"; fi

      # A successful push on this exact SHA already covered the ordinary
      # lanes. Keep nightly-only evidence and its build prerequisites.
      # Empty output or an API failure runs every lane as before.
      - name: Check whether this workflow passed on the same master push
        id: push
        if: github.event_name == 'schedule' && github.ref == 'refs/heads/master' && steps.weekly.outputs.frozen != 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # A push whose scope skipped the Python lanes (a Rust-only batch's,
        # below) still concludes success; `guards` ran on it exactly then,
        # and the nightly runs the lanes. A lane the batch passed is covered.
        run: python3 -m ops.ci_push_passed --workflow .github/workflows/ci.yml --github-output "$GITHUB_OUTPUT" --not-if-job-passed guards

      - name: Classify the change
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          BEFORE: ${{ github.event.before }}
          WEEKLY_FROZEN: ${{ steps.weekly.outputs.frozen }}
        shell: bash
        run: |
          case "$EVENT_NAME" in
            pull_request) base=HEAD^1 ;;
            # A master push is classified by the merge it pushes (its first
            # parent is master before it): a Rust-only batch skips the Python
            # lanes on its push too, since the Python freeze (maintainer,
            # 14 November 2026), and the next nightly runs them on master's tip.
            # github.event.before: the tip master moved from, exact for a
            # multi-commit push; an unreadable one runs everything below.
            push) base="${BEFORE:-HEAD^1}" ;;
            merge_group)
              # Master's current tip, not merge_group.base_sha: that may be the
              # queue entry ahead, which need not pass on its own, so every
              # unmerged entry must count. Anything else runs everything.
              if [ "$MERGE_GROUP_BASE_REF" != refs/heads/master ] ||
                 ! git fetch --no-tags --depth=1 origin refs/heads/master; then
                echo "python=true" >> "$GITHUB_OUTPUT"
                echo "include_frozen=true" >> "$GITHUB_OUTPUT"; exit 0
              fi
              base=FETCH_HEAD ;;
            *) echo "python=true" >> "$GITHUB_OUTPUT"
               if [ "$WEEKLY_FROZEN" = true ]; then
                 echo "include_frozen=true" >> "$GITHUB_OUTPUT"
               fi
               exit 0 ;;
          esac
          # An unreadable diff cannot rule out a change to the frozen
          # package, so it runs everything, frozen tests included.
          if ! files=$(git diff --no-renames --name-only "$base" HEAD) || [ -z "$files" ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
            echo "include_frozen=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          printf '%s\n' "$files"
          # An ordinary pull request runs the fast lanes only (guards and the
          # unscoped jobs), whatever it changes: its full CI is its
          # integration batch's (docs/dev/merge-batches.md), which runs a
          # workflow or dependency edit under the edited workflow before it
          # reaches master (rust.yml's scope says why that suffices). A batch
          # branch, or a head ref Actions did not supply, is classified by
          # its diff.
          if [ "$EVENT_NAME" = pull_request ] && [ -n "$HEAD_REF" ] \
             && [[ "$HEAD_REF" != integrate/* ]]; then
            echo "not an integrate/ batch branch: fast lanes only"
            echo "python=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A change to the frozen package (since the Python freeze only a
          # freeze-exception pull request makes one) runs the package's own
          # tests too. The Console build under web/static/ is not one.
          frozen=$(grep -E '^pseudolife_memory/' <<<"$files" | grep -vE '^pseudolife_memory/web/static/' || true)
          if [ -n "$frozen" ]; then
            echo "include_frozen=true" >> "$GITHUB_OUTPUT"
          fi
          # Skip only when nothing falls outside the allowlist AND the PR
          # touches rust/ (a CHANGELOG-only docs PR keeps the full suite).
          # Here-strings, not pipes: under pipefail an early-exiting grep -q
          # can SIGPIPE the writer and flip the result on a long file list.
          if grep -qvE '^(rust/|\.github/workflows/rust\.yml$|CHANGELOG\.md$|changelog\.d/)' <<<"$files" \
             || ! grep -qE '^rust/' <<<"$files"; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
            echo "rust_only=true" >> "$GITHUB_OUTPUT"
          fi

  guards:
    # Runs only when `scope` skips the Python lanes: the guards that scan
    # every tracked file and pin the release docs, so an ordinary or
    # Rust-only PR is still checked for maintainer identifiers, stray control bytes, CHANGELOG and
    # release pins, and uncommitted evidence claims. Measured 2026-10-09 on
    # Windows: these files run in about 65 s with no PostgreSQL service
    # or model download.
    needs: scope
    if: needs.scope.outputs.python == 'false'
    runs-on: ubuntu-latest
    # The Rust readers step took 12.3 min on two workers on a Windows
    # desktop (2026-11-14, 1,532 tests); hosted Linux is faster at their git
    # and process work. About twice the estimate, as the other jobs allow.
    timeout-minutes: 25
    # The live tests that read rust/ files run here too (below), and some
    # of them pin Rust text against the coordination store: a throwaway
    # PostgreSQL, as the test job has, and a missing one fails them.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: pseudolife
          POSTGRES_PASSWORD: pseudolife
          POSTGRES_DB: postgres
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U pseudolife"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PSEUDOLIFE_TEST_DATABASE_URL: postgresql://pseudolife:pseudolife@127.0.0.1:5433/pseudolife_memory_test
      PSEUDOLIFE_REQUIRE_TEST_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (CPU torch first; tests.helpers imports torch)
        run: |
          python -m pip install -U pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.13.0"
          pip install -e .[dev]

      - name: Tree-wide guards
        # Every test file that reads CHANGELOG.md, plus the tracked-tree
        # scans (the wall-clock budget guard covers rust/ tests, so Rust-only
        # PRs, which skip the test job, still run it). The disposable-database guard scans every tracked .py file,
        # rust/cli_harness/ included: #660 and #662 landed an unguarded reap
        # there on 2026-10-09 because this job did not run it.
        # test_fake_embedder.py is CI's one run of the default (fake)
        # embedder mode; its one real_model case is left to the test job.
        run: >-
          python -m pytest -q -m "not real_model"
          tests/test_release_ux.py tests/test_eval_evidence.py
          tests/test_atlas_currency.py tests/test_client_install_ux.py
          tests/test_codex_hook_launcher.py tests/test_label_pair.py
          tests/test_merge_queue.py tests/test_plugin_packaging.py
          tests/test_rescore_strict_mc.py tests/test_schema_version.py
          tests/test_changelog_fragments.py tests/test_wall_clock_budgets.py
          "tests/test_disposable_database_guard.py::test_every_reap_and_full_bank_truncate_is_guarded_first"
          tests/test_fake_embedder.py

      - name: Live tests that read rust/ files
        # Since the Python freeze a Rust-only batch skips the Python lanes on
        # its pull request and its master push, so every live test that
        # names a rust/ path, imports rust code or reads rust.yml runs here on
        # such a change, on the job's
        # throwaway PostgreSQL (a missing one fails them, never skips):
        # tests/test_suite_classes.py keeps this list complete. An ordinary
        # pull request skips the step; its batch runs these in the test job.
        # Two workers, whole files each, as the test job.
        if: needs.scope.outputs.rust_only == 'true'
        run: >-
          python -m pytest -q -n 2 --dist loadfile
          tests/test_batch_timeline.py tests/test_board_status.py tests/test_ci_merge_queue.py
          tests/test_coordination_console.py tests/test_coordination_receive_ack.py tests/test_coordination_storage.py
          tests/test_coordination_web.py tests/test_extractor_model_lists.py tests/test_integrate_script.py
          tests/test_integrate_snapshot_admission.py tests/test_move_cli.py tests/test_operator_engine_transport.py
          tests/test_pdfium_pin.py tests/test_prune_worktrees.py tests/test_rehearse_activation.py
          tests/test_runner_cleanup.py tests/test_rust_mcp_catalogue.py tests/test_schema_version_guard.py
          tests/test_update_engine.py tests/test_suite_classes.py
          tests/test_ci_budget_integration.py tests/test_ci_push_passed.py tests/test_ci_batch_passed.py
          tests/test_claude_md_citations.py

  lock-resolve:
    # Replays the daemon image's constrained install (ops/Dockerfile.daemon
    # step 2) as a pip dry run, so a lock whose pins contradict each other
    # goes red on its pull request instead of in the image build. No other
    # job resolves ops/requirements.lock.txt (the tests that read it match
    # single pins): Dependabot's #875 (aiohttp 3.14.4, which needs
    # yarl>=1.25.1, against a lock pinning yarl 1.24.2) was green everywhere
    # else. Runs on every event, never scoped by the diff, since it is cheap
    # (the resolve step took 74 s on a hosted runner, run 39450066156 on
    # 2026-10-21) and a path filter would be one more way to skip it. Its one
    # skip is a master push whose merged batch passed it on the same tree;
    # a failed scope still runs it. It gates a merge only
    # once the ruleset requires it (docs/specs/2026-10-19-merge-queue.md).
    # The Python must be the image's (tests/test_check_lock_resolves.py pins
    # it to the FROM line).
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.push_passed != 'true' && !contains(fromJSON(needs.scope.outputs.batch_passed || '[]'), 'lock-resolve') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The lock resolves the way the daemon image installs it
        run: python ops/check_lock_resolves.py

  test:
    needs: scope
    # Fail-safe: run unless scope affirmatively says skip, so a failed or
    # empty scope runs the suite instead of skipping it.
    if: ${{ !cancelled() && needs.scope.outputs.push_passed != 'true' && needs.scope.outputs.python != 'false' && !contains(fromJSON(needs.scope.outputs.batch_passed || '[]'), 'test') }}
    runs-on: ubuntu-latest
    # ops/ci_tests.sh bounds pytest at 50 min (its comment names the
    # 2026-11-13/14 measurements, issue #1408); install, a cold HF cache
    # (a ~1.2 GB download) and the kill grace fit in the rest.
    timeout-minutes: 65

    services:
      postgres:
        # pgvector included — the schema requires CREATE EXTENSION vector.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: pseudolife
          POSTGRES_PASSWORD: pseudolife
          POSTGRES_DB: postgres
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U pseudolife"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # true for a change to the frozen package and the weekly run (scope
      # says when): ops/ci_tests.sh then passes pytest --include-frozen.
      PSEUDOLIFE_CI_INCLUDE_FROZEN: ${{ needs.scope.outputs.include_frozen }}
      # tests/pg_fixtures.py resolves the test server from this; the
      # fixture creates/truncates the test database itself.
      PSEUDOLIFE_TEST_DATABASE_URL: postgresql://pseudolife:pseudolife@127.0.0.1:5433/pseudolife_memory_test
      # The service's superuser, for tests/test_test_login_cli.py: it
      # provisions `pseudolife-mcp test-login create`'s login on this
      # disposable server and runs a slice of the PG-backed suite under it,
      # proving the login can do everything the suite does and cannot open
      # the production-named database. Skipped wherever it is unset.
      PSEUDOLIFE_TEST_LOGIN_ADMIN_URL: postgresql://pseudolife:pseudolife@127.0.0.1:5433/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (CPU torch first, mirroring the daemon image)
        run: |
          python -m pip install -U pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.13.0"
          pip install -e .[dev]

      # RESTORE and SAVE are split deliberately. Plain actions/cache only
      # saves when the JOB succeeds, so a single failing test threw away a
      # freshly downloaded ~1.4 GB and the next run re-downloaded it -- which
      # is how this workflow earned an HTTP 429 from the Hub. Saving straight
      # after the warm step means the models are cached even when the suite
      # then goes red, so a red run costs one test fix, not another download.
      - name: Restore HuggingFace cache
        id: hf-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          # Key names every model the warm step needs. Bump it whenever that
          # list changes: an exact hit restores the OLD cache, so a stale key
          # silently re-downloads the new model on every run -- or, under
          # HF_HUB_OFFLINE, fails the whole suite (v25).
          key: hf-minilm-l6-v2-qwen3-embedding-0.6b

      - name: Warm the embedders (downloads only on cache miss)
        # BOTH are load-bearing: Qwen3-Embedding-0.6B is EmbeddingConfig's
        # default since schema v25 (vector(1024)), and MiniLM is still pinned
        # by the tests that guard the symmetric/ONNX paths. The suite then
        # runs fully offline, so anything missing here is a hard failure.
        # Retries because the Hub rate-limits unauthenticated runners (429)
        # and a transient one should not cost the whole job.
        run: |
          for attempt in 1 2 3; do
            if python - <<'PY'
          from sentence_transformers import SentenceTransformer
          for repo in ("all-MiniLM-L6-v2", "Qwen/Qwen3-Embedding-0.6B"):
              SentenceTransformer(repo)
              print("warmed", repo, flush=True)
          PY
            then
              echo "warm ok on attempt $attempt"; exit 0
            fi
            echo "warm attempt $attempt failed; backing off"; sleep $((attempt * 60))
          done
          echo "::error::could not warm the embedders after 3 attempts (Hub rate limit?)"
          exit 1

      - name: Save HuggingFace cache
        # `always()` so a red suite still banks the download; the cache-hit
        # guard avoids a "cache already exists" warning on the warm path.
        if: always() && steps.hf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-l6-v2-qwen3-embedding-0.6b

      - name: Tests (offline + deterministic, 2 xdist workers)
        # -n 2 --dist loadfile: whole files stay on one worker, so every
        # module-scoped fixture (shared services, staged banks, daemons)
        # keeps its semantics. Isolation is the per-process database naming
        # in tests/pg_fixtures.py — the override URL gets a per-worker
        # suffix, and conftest re-pins the bench DB per worker (both
        # pinned by tests/test_pg_run_isolation.py). OMP_NUM_THREADS=2
        # stops 2 workers x torch's intra-op threads oversubscribing the
        # 4-vCPU runner. Verified locally 2026-08-28: full suite green at
        # -n 2 and -n 4.
        #
        # PSEUDOLIFE_TEST_EMBEDDER=real: this production-parity lane runs every
        # test on the real embedding weights, so real-model behaviour stays
        # covered on every PR. The lite lane below runs the local default:
        # tests/fake_embedder.py for every test not marked real_model.
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          OMP_NUM_THREADS: "2"
          PSEUDOLIFE_REQUIRE_TEST_POSTGRES: "1"
          PSEUDOLIFE_TEST_EMBEDDER: real
        run: bash ops/ci_tests.sh

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: ci-results/
          retention-days: 14
          if-no-files-found: warn

  test-lite-windows:
    needs: scope
    # Fail-safe: run unless scope affirmatively says skip, so a failed or
    # empty scope runs the suite instead of skipping it.
    if: ${{ !cancelled() && needs.scope.outputs.push_passed != 'true' && needs.scope.outputs.python != 'false' && !contains(fromJSON(needs.scope.outputs.batch_passed || '[]'), 'test-lite-windows') }}
    runs-on: windows-latest
    # Needs no embedding model (torch installs as a core dep but never loads
    # weights here). Measured 2026-10-20 on the maintainer's Windows host,
    # serially, against embedded PG: this selection's 377 cases took 75 s
    # (85 s wall; 187 s while another session saturated loopback sockets); the 30-file, 1,865-case lane it replaced took 1,383 s
    # there and 862 s on windows-latest (18 of its 25 minutes). 20, not 15:
    # setup and the PG start take ~3.5 min, and a hung test must still reach
    # pyproject's 600 s faulthandler dump before the job timeout.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (dev + lite)
        run: |
          python -m pip install -U pip
          pip install -e .[dev,lite]

      - name: Record the runner image and CPU count
        # The same step as the parity shards' in rust.yml, so the two compare.
        shell: pwsh
        run: |
          $memory = [math]::Round([GC]::GetGCMemoryInfo().TotalAvailableMemoryBytes / 1GB, 1)
          $image = if ($env:ImageOS) { "$env:ImageOS $env:ImageVersion" } else { 'not a hosted image' }
          $facts = "Runner: $env:RUNNER_OS $env:RUNNER_ARCH ($env:RUNNER_ENVIRONMENT), image $image, $([Environment]::ProcessorCount) logical CPUs, $memory GB memory"
          Write-Output $facts
          if ($env:GITHUB_STEP_SUMMARY) { $facts | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append }

      - name: Start embedded PostgreSQL (test infrastructure; the lite tier itself is dropped)
        # Without it the shim-to-daemon tests and the PG-backed coordination
        # tests skip silently: hosted Windows has no service containers.
        # attach_or_start, not start_embedded (whose atexit stop would end the
        # server with this helper); the runner VM is discarded at job end.
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from pseudolife_memory.storage.embedded_pg import attach_or_start

          dsn, _ = attach_or_start(Path.home() / "pl-ci-lite-bank")
          base = dsn.rsplit("/", 1)[0]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"PSEUDOLIFE_TEST_DATABASE_URL={base}/pseudolife_memory_test\n")
          print("embedded PG up:", base.rsplit("@", 1)[-1])
          PY

      - name: Product paths that differ on Windows
        # A merge gate: product paths only, no retries. The process-spawning
        # plumbing runs in test-windows-nightly; tests/test_ci_windows_lanes.py
        # keeps every test in one lane and every Windows-only test in some lane.
        # These start their own embedded instances: no pre-started server, no
        # service container (unsupported on Windows runners), no HF download.
        # Only live files run (tests/suite_classes.txt): since the Python
        # freeze the credentials and coordination-credentials files, one
        # tool-annotations test and the tunnel profiles left; the tests of
        # the open freeze exceptions (#1539, #1537) stay until they land.
        # - test_embedded_pg, test_backup_cli: the embedded provider's attach,
        #   crash and msvcrt start-lock paths, and the backup round trip.
        # - test_shim (picks): the Windows daemon spawn (creationflags, no
        #   console window), its msvcrt spawn lock, and one real shim-to-daemon
        #   handshake.
        # - test_prune_worktrees, test_ops_install_worktree_retention: the
        #   retention script's junction and reparse-point refusal, its
        #   Win32_Process listing, and the weekly task's registration.
        # - test_repository_claims: file claims refuse Windows junctions and
        #   reserved names (CON, trailing dots and spaces).
        # - test_tunnel_*: the tunnel's DPAPI key storage, owner-only ACLs and
        #   Windows process handling, which no other lane reaches; the three
        #   cancellation tests that reap real children run nightly.
        # - test_suite_lock (picks): the only CI coverage of the msvcrt lock
        #   backend, crash release and the native-Windows full-run refusal,
        #   and of ops/wsl-suite.ps1 forwarding a held lease's marker.
        # - test_conductor_watch (picks): the watcher's detach flags, its
        #   GetProcessTimes start-time check and its lifetime lock.
        # - test_client_install_ux, test_installer_plugin, test_codex_hooks
        #   (picks): a smoke of install.ps1 and the native Windows hooks; the
        #   full installer and hook matrix runs nightly.
        # - test_installer_client_update_schedule: install.ps1's offer of the
        #   daily client update task (Task Scheduler, schtasks) on a
        #   client-only install, Windows-only installer code.
        # - test_schema_version, test_doctor_cli: schema pins and doctor,
        #   cheap and platform-sensitive.
        # - test_migrate_flat: interrupted config replacement, file handling,
        #   and recovery refusals on native Windows.
        # - test_runner_cleanup: the parity runners' disk cleanup treats a
        #   directory junction as a link, which only Windows can make.
        # - test_selfhosted_windows_scripts: the Windows parity runner's hook
        #   refuses a job when the account's LAN block does not bind.
        # - test_child_python: a child re-run of the package from inside an
        #   older checkout imports the installed package (`-P`), with real
        #   Windows interpreter spawns.
        env:
          PSEUDOLIFE_REQUIRE_TEST_POSTGRES: "1"
        run: >-
          python -m pytest -ra --durations=30
          --junitxml=ci-results/test-lite-windows.xml
