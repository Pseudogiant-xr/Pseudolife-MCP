# CI (P2, 2026-07-02 review; lite-tier lanes added 2026-08-14): the full
# suite runs on every merge instead of only when someone remembers.
# Three lanes:
#   * test            — full suite vs the production-parity PG 18 service
#                       container (pgvector image, same as the Docker tier
#                       since the 2026-08-14 16→18 bump), every test on the
#                       real embedding weights (PSEUDOLIFE_TEST_EMBEDDER=real);
#   * test-lite-linux — full suite vs the [lite] extra's embedded
#                       PostgreSQL 18 (no service container): covers the
#                       lite provider itself on a Linux runner, and the
#                       local default (tests/fake_embedder.py for every test
#                       not marked real_model);
#   * test-lite-windows — the lite-critical surface (embedded provider,
#                       backup/restore rehearsal, shim) on a real Windows
#                       runner. Windows runners cannot host service
#                       containers at all, so embedded PG is the only
#                       Postgres coverage possible there; the FULL suite on
#                       Windows stays future work (embedder wall-time).
#   * test-lite-macos — the plugin hooks and client installers on a real
#                       macOS runner (bash 3.2, BSD stat/base64/ps, shasum),
#                       plus the embedded provider on its macOS wheel. Their
#                       BSD fallbacks run nowhere else (added 2026-09-27).
# Kept lean: master-push + PR triggers only, cancel-in-progress,
# pip + HuggingFace caches, diagnostic artifacts for the full Linux lanes.
#
# Rust-only pull requests (maintainer decision 2026-10-09): a PR that touches
# rust/ and whose every other changed file is .github/workflows/rust.yml,
# CHANGELOG.md or a changelog.d/ fragment changes no Python, so the four
# Python suite lanes are skipped for it and the `guards` job runs the
# tree-wide and release-doc guards
# instead (tracked-tree identifiers and control bytes, CHANGELOG and release
# pins, committed eval evidence). The Rust workflow is that PR's gate. The
# full suite still runs on every master push and nightly.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Nightly full run on master (02:17 AEDT), so a Rust-only day still
    # gets a full Python suite.
    - cron: "17 15 * * *"
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN for every lane — CI only reads the repo
# (CodeQL actions/missing-workflow-permissions; the default token can write).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only pull requests cancel superseded runs: the nightly shares master's
  # group and must not cancel a master push run (or the reverse).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    # Decides whether this run needs the Python suite lanes. Only a pull
    # request whose net change (merge commit vs its base parent) is entirely
    # under rust/, or is .github/workflows/rust.yml, CHANGELOG.md or a
    # changelog.d/ fragment, skips them; an empty or unreadable diff runs
    # everything.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      python: ${{ steps.scope.outputs.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Classify the change
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! files=$(git diff --no-renames --name-only HEAD^1 HEAD) || [ -z "$files" ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          printf '%s\n' "$files"
          # Skip only when nothing falls outside the allowlist AND the PR
          # touches rust/ (a CHANGELOG-only docs PR keeps the full suite).
          # Here-strings, not pipes: under pipefail an early-exiting grep -q
          # can SIGPIPE the writer and flip the result on a long file list.
          if grep -qvE '^(rust/|\.github/workflows/rust\.yml$|CHANGELOG\.md$|changelog\.d/)' <<<"$files" \
             || ! grep -qE '^rust/' <<<"$files"; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi

  guards:
    # Runs only when `scope` skips the Python lanes: the guards that scan
    # every tracked file and pin the release docs, so a Rust-only PR is still
    # checked for maintainer identifiers, stray control bytes, CHANGELOG and
    # release pins, and uncommitted evidence claims. Measured 2026-10-09 on
    # Windows: these ten files run in about 65 s with no PostgreSQL service
    # or model download.
    needs: scope
    if: needs.scope.outputs.python == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (CPU torch first; tests.helpers imports torch)
        run: |
          python -m pip install -U pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.13.0"
          pip install -e .[dev]

      - name: Tree-wide guards
        # Every test file that reads CHANGELOG.md, plus the tracked-tree
        # scans. The disposable-database guard scans every tracked .py file,
        # rust/cli_harness/ included: #660 and #662 landed an unguarded reap
        # there on 2026-10-09 because this job did not run it.
        run: >-
          python -m pytest -q
          tests/test_release_ux.py tests/test_eval_evidence.py
          tests/test_atlas_currency.py tests/test_client_install_ux.py
          tests/test_codex_hook_launcher.py tests/test_label_pair.py
          tests/test_merge_queue.py tests/test_plugin_packaging.py
          tests/test_rescore_strict_mc.py tests/test_schema_version.py
          tests/test_changelog_fragments.py
          "tests/test_disposable_database_guard.py::test_every_reap_and_full_bank_truncate_is_guarded_first"

  test:
    needs: scope
    # Fail-safe: run unless scope affirmatively says skip, so a failed or
    # empty scope runs the suite instead of skipping it.
    if: ${{ !cancelled() && needs.scope.outputs.python != 'false' }}
    runs-on: ubuntu-latest
    # v25 roughly doubled suite wall time (real Qwen3-0.6B CPU embeds
    # replaced MiniLM's ONNX path: 238s -> ~437s locally), and a cold
    # HF cache adds a ~1.2 GB download on top.
    timeout-minutes: 50

    services:
      postgres:
        # pgvector included — the schema requires CREATE EXTENSION vector.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: pseudolife
          POSTGRES_PASSWORD: pseudolife
          POSTGRES_DB: postgres
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U pseudolife"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # tests/pg_fixtures.py resolves the test server from this; the
      # fixture creates/truncates the test database itself.
      PSEUDOLIFE_TEST_DATABASE_URL: postgresql://pseudolife:pseudolife@127.0.0.1:5433/pseudolife_memory_test
      # The service's superuser, for tests/test_test_login_cli.py: it
      # provisions `pseudolife-mcp test-login create`'s login on this
      # disposable server and runs a slice of the PG-backed suite under it,
      # proving the login can do everything the suite does and cannot open
      # the production-named database. Skipped wherever it is unset.
      PSEUDOLIFE_TEST_LOGIN_ADMIN_URL: postgresql://pseudolife:pseudolife@127.0.0.1:5433/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (CPU torch first, mirroring the daemon image)
        run: |
          python -m pip install -U pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.13.0"
          pip install -e .[dev]

      # RESTORE and SAVE are split deliberately. Plain actions/cache only
      # saves when the JOB succeeds, so a single failing test threw away a
      # freshly downloaded ~1.4 GB and the next run re-downloaded it -- which
      # is how this workflow earned an HTTP 429 from the Hub. Saving straight
      # after the warm step means the models are cached even when the suite
      # then goes red, so a red run costs one test fix, not another download.
      - name: Restore HuggingFace cache
        id: hf-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          # Key names every model the warm step needs. Bump it whenever that
          # list changes: an exact hit restores the OLD cache, so a stale key
          # silently re-downloads the new model on every run -- or, under
          # HF_HUB_OFFLINE, fails the whole suite (v25).
          key: hf-minilm-l6-v2-qwen3-embedding-0.6b

      - name: Warm the embedders (downloads only on cache miss)
        # BOTH are load-bearing: Qwen3-Embedding-0.6B is EmbeddingConfig's
        # default since schema v25 (vector(1024)), and MiniLM is still pinned
        # by the tests that guard the symmetric/ONNX paths. The suite then
        # runs fully offline, so anything missing here is a hard failure.
        # Retries because the Hub rate-limits unauthenticated runners (429)
        # and a transient one should not cost the whole job.
        run: |
          for attempt in 1 2 3; do
            if python - <<'PY'
          from sentence_transformers import SentenceTransformer
          for repo in ("all-MiniLM-L6-v2", "Qwen/Qwen3-Embedding-0.6B"):
              SentenceTransformer(repo)
              print("warmed", repo, flush=True)
          PY
            then
              echo "warm ok on attempt $attempt"; exit 0
            fi
            echo "warm attempt $attempt failed; backing off"; sleep $((attempt * 60))
          done
          echo "::error::could not warm the embedders after 3 attempts (Hub rate limit?)"
          exit 1

      - name: Save HuggingFace cache
        # `always()` so a red suite still banks the download; the cache-hit
        # guard avoids a "cache already exists" warning on the warm path.
        if: always() && steps.hf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-l6-v2-qwen3-embedding-0.6b

      - name: Tests (offline + deterministic, 2 xdist workers)
        # -n 2 --dist loadfile: whole files stay on one worker, so every
        # module-scoped fixture (shared services, staged banks, daemons)
        # keeps its semantics. Isolation is the per-process database naming
        # in tests/pg_fixtures.py — the override URL gets a per-worker
        # suffix, and conftest re-pins the bench DB per worker (both
        # pinned by tests/test_pg_run_isolation.py). OMP_NUM_THREADS=2
        # stops 2 workers x torch's intra-op threads oversubscribing the
        # 4-vCPU runner. Verified locally 2026-08-28: full suite green at
        # -n 2 and -n 4.
        #
        # PSEUDOLIFE_TEST_EMBEDDER=real: this production-parity lane runs every
        # test on the real embedding weights, so real-model behaviour stays
        # covered on every PR. The lite lane below runs the local default:
        # tests/fake_embedder.py for every test not marked real_model.
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          OMP_NUM_THREADS: "2"
          PSEUDOLIFE_REQUIRE_TEST_POSTGRES: "1"
          PSEUDOLIFE_TEST_EMBEDDER: real
        run: bash ops/ci_tests.sh

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: ci-results/
          retention-days: 14
          if-no-files-found: warn

  test-lite-linux:
    needs: scope
    # Fail-safe: run unless scope affirmatively says skip, so a failed or
    # empty scope runs the suite instead of skipping it.
    if: ${{ !cancelled() && needs.scope.outputs.python != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (CPU torch first, plus the lite extra)
        run: |
          python -m pip install -U pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.13.0"
          pip install -e .[dev,lite]

      - name: Restore HuggingFace cache
        id: hf-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-l6-v2-qwen3-embedding-0.6b

      - name: Warm the embedders (downloads only on cache miss)
        run: |
          for attempt in 1 2 3; do
            if python - <<'PY'
          from sentence_transformers import SentenceTransformer
          for repo in ("all-MiniLM-L6-v2", "Qwen/Qwen3-Embedding-0.6B"):
              SentenceTransformer(repo)
              print("warmed", repo, flush=True)
          PY
            then
              echo "warm ok on attempt $attempt"; exit 0
            fi
            echo "warm attempt $attempt failed; backing off"; sleep $((attempt * 60))
          done
          echo "::error::could not warm the embedders after 3 attempts (Hub rate limit?)"
          exit 1

      - name: Save HuggingFace cache
        if: always() && steps.hf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-l6-v2-qwen3-embedding-0.6b

      - name: Start embedded PostgreSQL (the [lite] path under test)
        # attach_or_start, NOT start_embedded: the latter registers an
        # atexit stop, and this helper interpreter exiting would take the
        # server down with it. pg0's server is detached and outlives the
        # step; the runner VM is discarded at job end, so no teardown.
        # tests/pg_fixtures.py treats the exported URL's db as the target
        # and provisions it itself via the sibling /postgres admin db.
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from pseudolife_memory.storage.embedded_pg import attach_or_start

          dsn, _ = attach_or_start(Path.home() / "pl-ci-lite-bank")
          base = dsn.rsplit("/", 1)[0]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"PSEUDOLIFE_TEST_DATABASE_URL={base}/pseudolife_memory_test\n")
          print("embedded PG up:", base)
          PY

      - name: Tests (full suite vs embedded PG 18, 2 xdist workers)
        # Same sharding rationale as the `test` lane above.
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          OMP_NUM_THREADS: "2"
          PSEUDOLIFE_REQUIRE_TEST_POSTGRES: "1"
        run: bash ops/ci_tests.sh

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-lite-linux-diagnostics
          path: ci-results/
          retention-days: 14
          if-no-files-found: warn

  test-lite-windows:
    needs: scope
    # Fail-safe: run unless scope affirmatively says skip, so a failed or
    # empty scope runs the suite instead of skipping it.
    if: ${{ !cancelled() && needs.scope.outputs.python != 'false' }}
    runs-on: windows-latest
    # The curated lite surface needs no embedding model (torch installs as
    # a core dep but never loads weights here), so this lane is minutes,
    # not the ~40 the full suite would cost on a Windows runner.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (dev + lite)
        run: |
          python -m pip install -U pip
          pip install -e .[dev,lite]

      - name: Lite-surface tests (embedded provider, backup + restore rehearsal, shim, schema pins, suite lock)
        # These start their own embedded instances (including the crash /
        # attach / lock paths) — no pre-started server, no service
        # container (unsupported on Windows runners), no HF download.
        # test_suite_lock.py is the only CI coverage of the msvcrt backend.
        # The test_tunnel_*.py files run the tunnel's DPAPI key storage,
        # owner-only ACLs and Windows process handling, which no other lane reaches.
        run: python -m pytest tests/test_embedded_pg.py tests/test_backup_cli.py tests/test_shim.py tests/test_schema_version.py tests/test_credentials.py tests/test_coordination_credentials.py tests/test_coordination_adapter.py tests/test_wait_mail_cli.py tests/test_codex_hooks.py tests/test_codex_hook_setup.py tests/test_codex_hook_setup_edges.py tests/test_update_cli.py tests/test_ops_update_wrappers.py tests/test_register_claude_desktop.py tests/test_client_install_ux.py tests/test_installer_shim_upgrade.py tests/test_installer_existing_upgrade.py tests/test_installer_plugin.py tests/test_tool_annotations.py::test_all_tools_have_conservative_approval_hints tests/test_doctor_cli.py tests/test_suite_lock.py tests/test_codex_doorbell.py tests/test_tunnel_bridge.py tests/test_tunnel_cli.py tests/test_tunnel_profiles.py tests/test_tunnel_runtime.py tests/test_tunnel_service.py -q

  test-lite-macos:
    needs: scope
    # Fail-safe: run unless scope affirmatively says skip, so a failed or
    # empty scope runs the suite instead of skipping it.
    if: ${{ !cancelled() && needs.scope.outputs.python != 'false' }}
    runs-on: macos-latest
    # Curated like the Windows lane: the hook and installer surface needs no
    # embedding model, so this is minutes, not the full suite.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (dev + lite)
        run: |
          python -m pip install -U pip
          pip install -e .[dev,lite]

      - name: Check the shell under test is macOS's bash 3.2
        # The hooks run under the system bash, which macOS ships as 3.2. A
        # newer bash earlier on PATH would keep this lane green while it
        # stopped testing what users get, so it fails the job instead.
        run: |
          command -v bash
          bash -c 'echo "$BASH_VERSION"; case "$BASH_VERSION" in 3.2*) ;; *) exit 1 ;; esac'

      - name: Hook, installer and embedded-provider tests
        # The plugin hooks' BSD branches (stat -f, base64 -D, shasum,
        # ps -o lstart=) execute only here. No Postgres is started, so the
        # store tests in test_coordination_turn_digest.py skip; the Linux
        # lanes run them. -rs prints every skip reason, so a platform skip
        # cannot pass for coverage.
        # The test_tunnel_*.py files run the tunnel's owner-only files and
        # process handling on macOS.
        env:
          PSEUDOLIFE_SUITE_LOCK: "off"
        run: python -m pytest tests/test_wait_mail_cli.py tests/test_hooks_digest.py tests/test_stop_wake_hook.py tests/test_hook_glob_ranges.py tests/test_coordination_turn_digest.py tests/test_coordination_adapter.py tests/test_coordination_credentials.py tests/test_codex_doorbell.py tests/test_lease_cli.py tests/test_suite_lock.py tests/test_memory_changes_hook.py tests/test_client_install_ux.py tests/test_codex_hooks.py tests/test_codex_hook_setup_edges.py tests/test_installer_legacy_hooks.py tests/test_plugin_packaging.py tests/test_embedded_pg.py tests/test_tunnel_bridge.py tests/test_tunnel_cli.py tests/test_tunnel_profiles.py tests/test_tunnel_runtime.py tests/test_tunnel_service.py -q -rs

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check (warnings fail)
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Rebuild the committed console
        run: npm run build

      - name: The committed build matches the source
        # A source change without its rebuilt output (or the reverse) would
        # ship a console that differs from the reviewed code.
        working-directory: .
        run: |
          git status --porcelain -- pseudolife_memory/web/static
          test -z "$(git status --porcelain -- pseudolife_memory/web/static)"
