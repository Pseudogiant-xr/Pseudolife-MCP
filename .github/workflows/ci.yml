  test-lite-macos:
    needs: scope
    # Fail-safe: run unless scope affirmatively says skip, so a failed or
    # empty scope runs the suite instead of skipping it.
    if: ${{ !cancelled() && needs.scope.outputs.push_passed != 'true' && needs.scope.outputs.python != 'false' && !contains(fromJSON(needs.scope.outputs.batch_passed || '[]'), 'test-lite-macos') }}
    runs-on: macos-latest
    # Curated like the Windows lane: the hook and installer surface needs no
    # embedding model, so this is minutes, not the full suite.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (dev + lite)
        run: |
          python -m pip install -U pip
          pip install -e .[dev,lite]

      - name: Check the shell under test is macOS's bash 3.2
        # The hooks run under the system bash, which macOS ships as 3.2. A
        # newer bash earlier on PATH would keep this lane green while it
        # stopped testing what users get, so it fails the job instead.
        run: |
          command -v bash
          bash -c 'echo "$BASH_VERSION"; case "$BASH_VERSION" in 3.2*) ;; *) exit 1 ;; esac'

      - name: Hook, installer and embedded-provider tests
        # The plugin hooks' BSD branches (stat -f, base64 -D, shasum,
        # ps -o lstart=) execute only here. No Postgres is started, so the
        # store tests in test_coordination_turn_digest.py skip; the Linux
        # lanes run them. -rs prints every skip reason, so a platform skip
        # cannot pass for coverage.
        # The test_tunnel_*.py files run the tunnel's owner-only files and
        # process handling on macOS; test_conductor_watch.py runs the
        # watcher's `ps` start-time check there, test_prune_worktrees.py
        # the retention script's `ps` process listing, and
        # test_child_python.py a child re-run of the package from inside an
        # older checkout. Only live files run (tests/suite_classes.txt).
        env:
          PSEUDOLIFE_SUITE_LOCK: "off"
        run: python -m pytest tests/test_conductor_watch.py tests/test_wait_mail_cli.py tests/test_hooks_digest.py tests/test_stop_wake_hook.py tests/test_hook_glob_ranges.py tests/test_coordination_turn_digest.py tests/test_coordination_adapter.py tests/test_codex_doorbell.py tests/test_lease_cli.py tests/test_suite_lock.py tests/test_memory_changes_hook.py tests/test_client_install_ux.py tests/test_codex_hooks.py tests/test_subagent_board_guard.py tests/test_codex_hook_setup_edges.py tests/test_installer_lite.py tests/test_installer_legacy_hooks.py tests/test_installer_client_update_schedule.py tests/test_plugin_packaging.py tests/test_embedded_pg.py tests/test_tunnel_bridge.py tests/test_tunnel_cli.py tests/test_tunnel_runtime.py tests/test_tunnel_service.py tests/test_prune_worktrees.py tests/test_child_python.py tests/test_move_cli.py::test_signal_during_target_expose_undoes_serve tests/test_move_cli.py::test_postcommit_signal_records_followups_without_rollback tests/test_move_cli.py::test_signal_after_confirmed_moved_marker_never_rolls_back_the_commit tests/test_move_cli.py::test_signal_between_confirmed_marker_and_commit_record_is_deferred -q -rs

