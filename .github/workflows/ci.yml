  test-lite-macos:
    needs: scope
    # Fail-safe: run unless scope affirmatively says skip, so a failed or
    # empty scope runs the suite instead of skipping it.
    if: ${{ !cancelled() && needs.scope.outputs.python != 'false' }}
    runs-on: macos-latest
    # Curated like the Windows lane: the hook and installer surface needs no
    # embedding model, so this is minutes, not the full suite.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (dev + lite)
        run: |
          python -m pip install -U pip
          pip install -e .[dev,lite]

      - name: Check the shell under test is macOS's bash 3.2
        # The hooks run under the system bash, which macOS ships as 3.2. A
        # newer bash earlier on PATH would keep this lane green while it
        # stopped testing what users get, so it fails the job instead.
        run: |
          command -v bash
          bash -c 'echo "$BASH_VERSION"; case "$BASH_VERSION" in 3.2*) ;; *) exit 1 ;; esac'

      - name: Hook, installer and embedded-provider tests
        # The plugin hooks' BSD branches (stat -f, base64 -D, shasum,
        # ps -o lstart=) execute only here. No Postgres is started, so the
        # store tests in test_coordination_turn_digest.py skip; the Linux
        # lanes run them. -rs prints every skip reason, so a platform skip
        # cannot pass for coverage.
        # The test_tunnel_*.py files run the tunnel's owner-only files and
        # process handling on macOS; test_delegate_watch.py runs the
        # watcher's `ps` start-time check there.
        env:
          PSEUDOLIFE_SUITE_LOCK: "off"
        run: python -m pytest tests/test_delegate_watch.py tests/test_wait_mail_cli.py tests/test_hooks_digest.py tests/test_stop_wake_hook.py tests/test_hook_glob_ranges.py tests/test_coordination_turn_digest.py tests/test_coordination_adapter.py tests/test_coordination_credentials.py tests/test_codex_doorbell.py tests/test_lease_cli.py tests/test_suite_lock.py tests/test_memory_changes_hook.py tests/test_client_install_ux.py tests/test_codex_hooks.py tests/test_subagent_board_guard.py tests/test_codex_hook_setup_edges.py tests/test_installer_legacy_hooks.py tests/test_plugin_packaging.py tests/test_embedded_pg.py tests/test_tunnel_bridge.py tests/test_tunnel_cli.py tests/test_tunnel_profiles.py tests/test_tunnel_runtime.py tests/test_tunnel_service.py -q -rs

  test-windows-nightly:
    # Not a merge gate, and never run for a pull request or merge group: the
    # Windows plumbing that starts real processes and shells (installer
    # matrix, Codex hook setup and doorbell, coordination digest and adapter,
    # wait-mail, update CLI, register-claude-desktop, the stop-wake hook's
    # timing tests, the rest of the suite lock, shim and delegate watcher).
    # The 2026-10-20 CI flake review found the Windows flakes live here, so
    # it runs nightly and by hand. ops/pytest_retry_once.py retries
    # first-attempt failures once and keeps the first attempt's junit and
    # attempts.json in the artifact, so a flake rate can be read off the
    # runs. Retries belong here only; the merge gate holds deterministic tests.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    # The 30-file lane this half came from took 862 s on windows-latest; the
    # plumbing half plus the nine files added below is most of that, and a
    # retry repeats only what failed.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (dev + lite)
        run: |
          python -m pip install -U pip
          pip install -e .[dev,lite]

      - name: Record the runner image and CPU count
        # The same step as the parity shards' in rust.yml, so the two compare.
        shell: pwsh
        run: |
          $memory = [math]::Round([GC]::GetGCMemoryInfo().TotalAvailableMemoryBytes / 1GB, 1)
          $image = if ($env:ImageOS) { "$env:ImageOS $env:ImageVersion" } else { 'not a hosted image' }
          $facts = "Runner: $env:RUNNER_OS $env:RUNNER_ARCH ($env:RUNNER_ENVIRONMENT), image $image, $([Environment]::ProcessorCount) logical CPUs, $memory GB memory"
          Write-Output $facts
          if ($env:GITHUB_STEP_SUMMARY) { $facts | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append }

      - name: Start embedded PostgreSQL (the [lite] path, as test-lite-linux does)
        # Without it the shim-to-daemon tests and the PG-backed coordination
        # tests skip silently: hosted Windows has no service containers.
        # attach_or_start, not start_embedded (whose atexit stop would end the
        # server with this helper); the runner VM is discarded at job end.
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from pseudolife_memory.storage.embedded_pg import attach_or_start

          dsn, _ = attach_or_start(Path.home() / "pl-ci-lite-bank")
          base = dsn.rsplit("/", 1)[0]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"PSEUDOLIFE_TEST_DATABASE_URL={base}/pseudolife_memory_test\n")
          print("embedded PG up:", base.rsplit("@", 1)[-1])
          PY

      - name: Windows plumbing (one recorded retry)
        # Tests the merge gate names from a split file are deselected here (and
        # the reverse for test_tunnel_runtime), so each runs in one Windows
        # lane. The last nine files hold Windows-only tests that no CI lane
        # ran before 2026-10-20.
        env:
          PSEUDOLIFE_REQUIRE_TEST_POSTGRES: "1"
        run: >-
          python ops/pytest_retry_once.py ci-results/test-windows-nightly
          -ra --durations=30
          tests/test_memory_changes_hook.py
          tests/test_coordination_turn_digest.py
          tests/test_coordination_adapter.py
          tests/test_wait_mail_cli.py
          tests/test_subagent_board_guard.py
          tests/test_codex_hook_setup.py
          tests/test_codex_hook_setup_edges.py
          tests/test_codex_doorbell.py
          tests/test_update_cli.py
          tests/test_ops_update_wrappers.py
          tests/test_register_claude_desktop.py
          tests/test_installer_shim_upgrade.py
          tests/test_installer_existing_upgrade.py
          tests/test_codex_hooks.py
          --deselect tests/test_codex_hooks.py::test_native_hook_rejects_broadened_managed_connection_acl
          --deselect tests/test_codex_hooks.py::test_plugin_native_windows_prompt_context
          --deselect tests/test_codex_hooks.py::test_native_session_start_sends_the_plugin_version
          tests/test_client_install_ux.py
          --deselect tests/test_client_install_ux.py::test_installer_ps1_parses
          --deselect tests/test_client_install_ux.py::test_install_ps1_update_line_names_the_launcher_until_path_finds_it
          --deselect tests/test_client_install_ux.py::test_installers_support_codex_hook_on_windows
          tests/test_installer_plugin.py
          --deselect tests/test_installer_plugin.py::test_fresh_machine_gets_marketplace_and_plugin
          tests/test_shim.py
          --deselect tests/test_shim.py::test_shim_forwards_initialize_instructions_and_tool_annotations
          --deselect tests/test_shim.py::test_spawn_daemon_never_allocates_a_console_window
          --deselect tests/test_shim.py::test_concurrent_shims_spawn_exactly_one_daemon
          --deselect tests/test_shim.py::test_spawn_lock_is_released_after_the_daemon_is_up
          --deselect tests/test_shim.py::test_loopback_daemon_url_forms_still_spawn
          --deselect tests/test_shim.py::test_no_spawn_env_falsy_value_still_spawns
          --deselect tests/test_shim.py::test_startup_credential_check_passes_with_a_token_or_a_usable_token_file
          tests/test_suite_lock.py
