  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check (warnings fail)
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Rebuild the committed console
        run: npm run build

      - name: The committed build matches the source
        # A source change without its rebuilt output (or the reverse) would
        # ship a console that differs from the reviewed code.
        working-directory: .
        run: |
          git status --porcelain -- pseudolife_memory/web/static
          test -z "$(git status --porcelain -- pseudolife_memory/web/static)"
