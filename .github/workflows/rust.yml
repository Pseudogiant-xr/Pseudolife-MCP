name: Rust shim

on:
  pull_request:
  # The merge queue (docs/specs/2026-10-19-merge-queue.md): a queued group runs
  # the same jobs, so the required Parity checks report under the same names.
  merge_group:
  push:
    branches: [master]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Ordinary CI, the bounded wait-mail capture, or a stress loop of one selection'
        type: choice
        options: [ci, wait-mail, stress]
        default: ci
        required: true
      case_list:
        description: 'Comma-separated supported wait-mail case IDs'
        type: string
        default: wait-mail-long-ring-watermark
        required: false
      frozen_head:
        description: 'Required for ci and wait-mail: full reviewed commit ID, equal to the dispatched master head'
        type: string
        required: false
      # Stress (rust/ci/stress.py): before a new live parity row or a
      # timing-sensitive test joins a required lane, it must pass 20 clean
      # hosted windows-latest runs (CLAUDE.md). Each iteration is its own
      # job on a fresh runner, reusing this run's candidate build.
      selection:
        description: 'Stress only: row:<row>[/<case>], scenario:<run.py scenario>, or pytest node ids'
        type: string
        required: false
      iterations:
        description: 'Stress only: how many fresh runners run the selection (1-50)'
        type: number
        default: 20
        required: false
      os:
        description: 'Stress only: the hosted runner'
        type: choice
        options: [windows-latest, ubuntu-latest]
        default: windows-latest
        required: false

permissions:
  contents: read

# The nightly gets its own group. Sharing master's let it cancel the push run
# a merge relies on: push run 38870639548 ended 2 s after nightly 38872655184
# started (2026-10-16), and push 38704856443 / nightly 38705376001 match the
# same pattern (2026-10-15); a later push then cancelled each nightly. Manual
# CI on master would do the same, so it gets its own group too; a wait-mail
# capture or a stress loop gets a group per run. A push run is now cancelled
# only by a newer push. A merge group falls through to the
# ref-keyed group: its ref is its own queue branch
# (refs/heads/gh-readonly-queue/master/...), one per queue entry, so no pull
# request or push shares it and nothing else cancels it.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'wait-mail' || inputs.mode == 'stress') && format('rust-{0}-{1}', inputs.mode, github.run_id) || (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && format('rust-{0}-{1}-{2}', github.event_name, github.workflow, github.ref) || format('rust-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4
  CUDA_VISIBLE_DEVICES: '-1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  scope:
    # Decides whether this run needs the Rust, candidate, parity and image
    # jobs. Only a pull request or merge group whose every changed file is
    # documentation skips them (a pull request's merge commit vs its base
    # parent; a merge group's master tip, fetched here, to its head): Markdown, llms.txt /
    # llms-full.txt, and non-script files under docs/ (CLAUDE.md "Docs-only
    # changes"), none of them under rust/, evals/, pseudolife_memory/,
    # plugin/, ops/, tests/ or .github/. An empty or unreadable diff, and a
    # failed scope job, run everything. On 2026-10-16 a CLAUDE.md-only PR
    # (#782) queued the whole ~33-job matrix behind the account's 20-job cap.
    # No hosted step here reads docs outside rust/: the producer census only
    # reports docs drift, and the W2-D docs seed runs locally, not in CI.
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'wait-mail'
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      parity: ${{ steps.parity.outputs.parity }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Classify the change
        id: scope
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
        run: |
          $docs = '^(?!(?i:rust|evals|pseudolife_memory|plugin|ops|tests|\.github)/)([^/"].*\.md|llms(-full)?\.txt|docs/.*(?<!\.(py|ps1|psm1|sh|bash|bat|cmd|js|mjs|cjs|ts|rs|toml|yml|yaml)))$'
          $rust = 'true'
          $base = $null
          if ($env:EVENT_NAME -ceq 'pull_request') {
            $base = 'HEAD^1'
          } elseif ($env:EVENT_NAME -ceq 'merge_group' -and $env:MERGE_GROUP_BASE_REF -ceq 'refs/heads/master') {
            # Master's current tip, not merge_group.base_sha: that may be the
            # queue entry ahead, which need not pass on its own, so every
            # unmerged entry must count. Anything else runs everything.
            git fetch --no-tags --depth=1 origin refs/heads/master
            if ($LASTEXITCODE -eq 0) { $base = 'FETCH_HEAD' }
          }
          if ($base) {
            $files = @(git diff --no-renames --name-only $base HEAD)
            if ($LASTEXITCODE -eq 0 -and $files.Count -gt 0) {
              $files | Write-Output
              if (@($files | Where-Object { $_ -cnotmatch $docs }).Count -eq 0) { $rust = 'false' }
            }
          }
          Write-Output "rust=$rust"
          "rust=$rust" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          exit 0
      # The parity matrix (rust/ci/parity_scope.py). Master pushes, the
      # nightly, manual CI and merge groups run every suite. A pull request
      # runs the floor (eval, cli, cli-daemon, cli-live, h5-w1a) plus the
      # suites its diff reaches: a row, its golden or its command's shim code
      # reaches the shard that runs the row, the daemon crate its daemon
      # suites, and anything the module cannot place (the Python oracle,
      # this workflow, Cargo files) every suite. A divergence in a suite a
      # pull request skipped surfaces on the master push that merges it.
      # Before this, each pull request push queued 24 parity jobs behind the
      # account's 20-job cap.
      - name: Choose the parity suites
        id: parity
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python3 rust/ci/parity_scope.py --event "$EVENT_NAME" --github-output "$GITHUB_OUTPUT"

  rust:
    # Fail-safe: run unless scope affirmatively says skip. Ordinary CI only:
    # a wait-mail capture or a stress loop needs no Rust or parity job, and
    # a stress loop takes only scope and candidate.
    needs: scope
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.mode == 'ci') && needs.scope.outputs.rust != 'false' }}
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Hosted windows, cold rust-cache: 21.7-23.9 min on 2026-10-10/13. On
    # 2026-10-15 three cold runs were cancelled at 25 min (jobs 116301727515,
    # 116323387861, 116326383784), 20 min in before the override builds,
    # after the daemon's warm release compile went from about 1 to 2 min.
    # No cold run has finished since: an estimated 26-34 min. Warm runs
    # peak at 17.5 min. A cold run used to have to finish, or the cache was
    # never saved and every later run was cold too, and the cache key hashed
    # the runner image's own Rust, so each image rollout started cold
    # (windows-latest 1.98.1 -> 1.99.0, 2026-10-15). The cache now saves on
    # failure and hashes only the pinned toolchain (see its steps).
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bind the selected Python interpreter for Rust fixtures
        shell: pwsh
        run: |
          $selectedPython = python -c 'import sys; print(sys.executable)'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PSEUDOLIFE_MCP_PYTHON=$selectedPython" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install the Python SDK fixture dependency
        run: python -m pip install "mcp==2.2.0"
      - name: Check generated daemon schema
        working-directory: .
        shell: pwsh
        run: |
          python rust/daemon/harness/gen_schema_sql.py --check
          exit $LASTEXITCODE
      - name: Check port inventories and producer census
        working-directory: .
        shell: pwsh
        run: |
          python -m pip install pytest pyyaml "psycopg[binary]" psutil
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q rust/test_contract_inventory.py rust/test_producer_census.py rust/daemon/harness/test_w2e_lifecycle.py -k 'not committed_census_matches_current_tree'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/producer_census.py --ci-check
          exit $LASTEXITCODE
      - name: ported-row-and-mutant-ci-inventory
        working-directory: .
        run: python rust/ci/inventory.py
      - name: Board harness lifecycle and normalization
        working-directory: .
        # Linux 2026-10-13: 21 tests in 0.21s. Allow a three-minute cold
        # Windows startup/import floor pending its first hosted measurement.
        timeout-minutes: 3
        run: python -m pytest -q rust/daemon/harness/board/test_norm.py rust/daemon/harness/board/test_run.py
      - name: Bind the event-selected Python oracle
        shell: pwsh
        working-directory: .
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          python -m evals.rust_port.oracle_selection --out (Join-Path $env:RUNNER_TEMP 'oracle-selection.json') --github-env $env:GITHUB_ENV
          exit $LASTEXITCODE
      - name: Prepare selected package metadata for the Rust identity contract
        shell: pwsh
        working-directory: .
        run: |
          $oracleMetadata = Join-Path $env:RUNNER_TEMP 'phase1-oracle-metadata'
          python -m evals.rust_port.phase1_oracle --metadata-only --destination $oracleMetadata
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PSEUDOLIFE_PORT_ORACLE_ROOT=$oracleMetadata" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      # rust-cache hashes every installed toolchain (`rustup toolchain list`)
      # into its key, so each rollout of the runner image's own stable Rust
      # started every cache cold (windows-latest 1.98.1 -> 1.99.0,
      # 2026-10-15). With only the pin left, the key changes when the pin or
      # Cargo.lock does. add-rust-environment-hash-key: false would drop the
      # Cargo.lock hash too, and a key that never changes is never saved
      # again (rust-cache skips the save on an exact hit). Hosted only: a
      # self-hosted runner's toolchains belong to its owner.
      - name: Keep only the pinned Rust toolchain
        if: runner.environment != 'self-hosted'
        shell: pwsh
        run: |
          $toolchainFile = Join-Path $env:GITHUB_WORKSPACE 'rust/rust-toolchain.toml'
          $match = Select-String -LiteralPath $toolchainFile -Pattern '^channel = "([^"]+)"$' | Select-Object -First 1
          if (-not $match) { throw "rust/rust-toolchain.toml names no channel; nothing is known to keep" }
          $pinned = $match.Matches[0].Groups[1].Value
          foreach ($line in @(rustup toolchain list)) {
            $name = ($line -split '\s+')[0]
            if ($name -and -not $name.StartsWith("$pinned-")) {
              rustup toolchain uninstall $name
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          rustup toolchain list
          exit $LASTEXITCODE
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          # A cold run that times out still saves what it compiled, so the
          # next run is not cold too (three cold cancellations, 2026-10-15).
          cache-on-failure: true
      - name: Install pinned nextest in the runner temporary directory
        shell: pwsh
        run: |
          $nextestRoot = Join-Path $env:RUNNER_TEMP 'nextest-0.9.146'
          New-Item -ItemType Directory -Force -Path $nextestRoot | Out-Null
          if ($IsWindows) {
            $nextestArchive = Join-Path $env:RUNNER_TEMP 'nextest.zip'
            Invoke-WebRequest 'https://get.nexte.st/0.9.146/windows' -OutFile $nextestArchive
            Expand-Archive -LiteralPath $nextestArchive -DestinationPath $nextestRoot
          } else {
            $nextestArchive = Join-Path $env:RUNNER_TEMP 'nextest.tar.gz'
            Invoke-WebRequest 'https://get.nexte.st/0.9.146/linux' -OutFile $nextestArchive
            tar -xzf $nextestArchive -C $nextestRoot
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $nextestRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check all targets
        run: cargo check --locked --all-targets -j 4
      - name: Clippy
        run: cargo clippy --locked --all-targets -j 4 -- -D warnings
      - name: Check write-path harness targets
        # 2026-10-13: cold Linux dev-profile check took 54 s; allow about 2x.
        timeout-minutes: 2
        run: cargo check --locked --all-targets -p pseudolife-daemon --features harness,mutants -j 4
      - name: Nextest
        run: cargo nextest run --locked --all-targets -j 4
      - name: Check all targets without default features
        run: cargo check --locked --all-targets --no-default-features -j 4
      - name: Clippy without default features
        run: cargo clippy --locked --all-targets --no-default-features -j 4 -- -D warnings
      - name: Nextest without default features
        run: cargo nextest run --locked --all-targets --no-default-features -j 4

      - name: Daemon override build configurations
        working-directory: ${{ github.workspace }}
        # Hosted windows: about 7 min cold on 2026-10-10/13 (release build
        # 5-6 min), 3.2 min warm since 2026-10-14. The cold release build
        # was still running 6m20s in when job 116323387861 was cancelled.
        timeout-minutes: 20
        shell: pwsh
        run: |
          # Each build's output is printed only once it finishes; these lines
          # show which one was running if the step times out.
          $env:PSEUDOLIFE_DAEMON_TEST_LOOPBACK_BIND = '1'
          $daemonDefaultLog = Join-Path $env:RUNNER_TEMP 'daemon-default-override.log'
          Write-Host "$(Get-Date -Format o) debug override test: start"
          cargo +1.94.0 test --manifest-path rust/Cargo.toml --locked -p pseudolife-daemon -j 3 mutants::tests::loopback_bind_override_is_absent_from_production_build -- --exact *> $daemonDefaultLog
          $result = $LASTEXITCODE
          Get-Content $daemonDefaultLog
          if ($result -ne 0 -or -not (Select-String -LiteralPath $daemonDefaultLog -Pattern 'test result: ok\. 1 passed;')) { exit 1 }
          $daemonReleaseLog = Join-Path $env:RUNNER_TEMP 'daemon-release-override.log'
          Write-Host "$(Get-Date -Format o) release override test: start"
          cargo +1.94.0 test --manifest-path rust/Cargo.toml --locked --release --features mutants -p pseudolife-daemon -j 3 mutants::tests::loopback_bind_override_is_absent_from_production_build -- --exact *> $daemonReleaseLog
          $result = $LASTEXITCODE
          Remove-Item env:PSEUDOLIFE_DAEMON_TEST_LOOPBACK_BIND
          Get-Content $daemonReleaseLog
          if ($result -ne 0 -or -not (Select-String -LiteralPath $daemonReleaseLog -Pattern 'test result: ok\. 1 passed;')) { exit 1 }
          Write-Host "$(Get-Date -Format o) mutants dev build: start"
          cargo +1.94.0 build --manifest-path rust/Cargo.toml --locked -p pseudolife-daemon --features mutants -j 3
          exit $LASTEXITCODE
      - name: Retain debug bind fixture
        uses: actions/upload-artifact@v4
        with:
          name: daemon-bind-fixture-${{ runner.os }}
          path: |
            rust/target/debug/pseudolife-daemon
            rust/target/debug/pseudolife-daemon.exe
          if-no-files-found: error

  candidate:
    needs: scope
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.mode != 'wait-mail') && needs.scope.outputs.rust != 'false' }}
    name: Candidate / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      - name: Keep only the pinned Rust toolchain
        if: runner.environment != 'self-hosted'
        shell: pwsh
        run: |
          $toolchainFile = Join-Path $env:GITHUB_WORKSPACE 'rust/rust-toolchain.toml'
          $match = Select-String -LiteralPath $toolchainFile -Pattern '^channel = "([^"]+)"$' | Select-Object -First 1
          if (-not $match) { throw "rust/rust-toolchain.toml names no channel; nothing is known to keep" }
          $pinned = $match.Matches[0].Groups[1].Value
          foreach ($line in @(rustup toolchain list)) {
            $name = ($line -split '\s+')[0]
            if ($name -and -not $name.StartsWith("$pinned-")) {
              rustup toolchain uninstall $name
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          rustup toolchain list
          exit $LASTEXITCODE
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: shim-release
          cache-on-failure: true
      - name: Build candidate
        run: cargo build --locked --release --bin pseudolife-stdio --bin pseudolife-daemon -j 3
      - name: Retain default static candidate
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $daemonName = if ($IsWindows) { 'pseudolife-daemon.exe' } else { 'pseudolife-daemon' }
          $staticName = if ($IsWindows) { 'pseudolife-daemon-static.exe' } else { 'pseudolife-daemon-static' }
          Copy-Item -LiteralPath (Join-Path 'rust/target/release' $daemonName) -Destination (Join-Path 'rust/target/release' $staticName)
      - name: Build embedding candidate
        run: cargo build --locked --release -p pseudolife-daemon --bins --features mutants,graph-harness,contract-harness,principal-harness -j 3
      - uses: actions/upload-artifact@v4
        with:
          name: rust-shim-${{ runner.os }}
          path: |
            rust/target/release/pseudolife-stdio
            rust/target/release/pseudolife-stdio.exe
            rust/target/release/pseudolife-daemon
            rust/target/release/pseudolife-daemon.exe
            rust/target/release/pseudolife-daemon-static
            rust/target/release/pseudolife-daemon-static.exe
            rust/target/release/graph-contract
            rust/target/release/graph-contract.exe
            rust/target/release/dream-contract
            rust/target/release/dream-contract.exe
          if-no-files-found: error

  parity-checks:
    # Explicit: the implicit success() would also check scope. Scope is a
    # direct need for the matrix; if it failed, the matrix cannot expand, so
    # this job and the Parity gate fail rather than skip.
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.mode == 'ci') && needs.candidate.result == 'success' && needs.rust.result == 'success' }}
    name: Parity checks / ${{ matrix.os }} / ${{ matrix.suite }}
    needs: [scope, candidate, rust]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Every suite and its include values live in rust/ci/parity_scope.py,
        # which the scope job turns into this run's selection: all of them on
        # master pushes, the nightly, manual CI and merge groups; on a pull
        # request the floor plus what its diff reaches. Only the selected
        # suites' include entries come back: an entry matching no
        # combination would add a job of its own. parity-selfhosted takes
        # the same matrix, and parity-live reuses the steps below through
        # the YAML anchor.
        suite: ${{ fromJSON(needs.scope.outputs.parity).suite }}
        # The required gate holds only work hosted Windows runs
        # deterministically: builds, nextest, self-tests, goldens and
        # replays. cli-live holds the live Python-versus-Rust comparisons
        # whose verdict depends on sub-second timing and Windows socket
        # resets on a cold shared runner (the 250 ms hook probe, early
        # refusals' RST; docs/specs/2026-10-19-merge-queue.md, "The required
        # Parity gate"). Linux keeps them required; hosted Windows runs
        # them in parity-live, which reports and never gates.
        exclude:
          - os: windows-latest
            suite: cli-live
        include: ${{ fromJSON(needs.scope.outputs.parity).include }}
    runs-on: ${{ matrix.os }}
    # Every cli and W1-C shard names its own budget beside its measurement
    # in the include list; eval and judges keep the 210-minute fallback.
    timeout-minutes: ${{ matrix.job_timeout || 210 }}
    env:
      # Artifact names must be unique within a run; parity-selfhosted sets
      # its own prefix so both lanes can upload the same outcomes.
      PARITY_ARTIFACT_PREFIX: ''
    steps: &parity_steps
      # Self-hosted only (docs/specs/2026-10-19-self-hosted-parity-lane.md):
      # the runner's own configuration names this machine's full-suite lease
      # and lock directory; the tree never names a machine. Runs before
      # checkout so a yielding shard loads nothing.
      - name: Yield to this machine's full suite
        if: runner.environment == 'self-hosted'
        shell: pwsh
        run: |
          $lease = $env:PSEUDOLIFE_PARITY_LEASE
          $lockDir = $env:PSEUDOLIFE_PARITY_LOCK_DIR
          if ($lease -cnotmatch '^full-suite@[A-Za-z0-9._-]{1,40}$' -or -not $lockDir) {
            throw "The runner's .env must set PSEUDOLIFE_PARITY_LEASE (full-suite@<machine>) and PSEUDOLIFE_PARITY_LOCK_DIR (the suite user's lock directory); see docs/specs/2026-10-19-self-hosted-parity-lane.md"
          }
          if (-not (Get-Command pseudolife-mcp -ErrorAction SilentlyContinue)) {
            throw 'pseudolife-mcp is not on the runner PATH; install it for the runner user with: uv tool install pseudolife-mcp'
          }
          # CLAUDE.md "Disk space": no heavy work below 8 GB free.
          $freeGb = [math]::Floor([IO.DriveInfo]::new($env:GITHUB_WORKSPACE).AvailableFreeSpace / 1GB)
          if ($freeGb -lt [int]$env:PARITY_MIN_FREE_GB) {
            throw "Only $freeGb GB free on the runner's work drive; the floor is $env:PARITY_MIN_FREE_GB GB"
          }
          # The lease check reads these two for this process only, never the shard's tests.
          $env:PSEUDOLIFE_SUITE_LEASE = $lease
          $env:PSEUDOLIFE_SUITE_LOCK_DIR = $lockDir
          $deadline = (Get-Date).AddMinutes([int]$env:PARITY_YIELD_MINUTES)
          while ($true) {
            $report = pseudolife-mcp lease check --json $lease
            $code = $LASTEXITCODE
            if ($code -ne 0 -and $code -ne 1) { throw "lease check $lease failed (exit $code); neither held nor free is known" }
            $state = ($report | Out-String | ConvertFrom-Json).local.state
            # A missing or unreadable lock file means the directory or its grant is wrong,
            # and every probe would read free.
            if ($null -eq $state) { throw "No readable full-suite lock file in PSEUDOLIFE_PARITY_LOCK_DIR (wrong directory, or the runner account lacks read access); the check cannot see this machine's suites" }
            if ($code -eq 0) { Write-Output "$lease is free; running the shard."; break }
            if ((Get-Date) -ge $deadline) {
              "Yielded: $lease stayed held for $env:PARITY_YIELD_MINUTES minutes, so this shard did not run." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
              throw "Yielded to the full suite holding $lease"
            }
            Write-Output "$lease is held by a full suite; checking again in 60 seconds."
            Start-Sleep -Seconds 60
          }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Hosted Windows' vCPU count and image version were never recorded,
      # so a slow or flaky shard could not be tied to its machine.
      - name: Record the runner image and CPU count
        shell: pwsh
        run: |
          $memory = [math]::Round([GC]::GetGCMemoryInfo().TotalAvailableMemoryBytes / 1GB, 1)
          $image = if ($env:ImageOS) { "$env:ImageOS $env:ImageVersion" } else { 'not a hosted image' }
          $facts = "Runner: $env:RUNNER_OS $env:RUNNER_ARCH ($env:RUNNER_ENVIRONMENT), image $image, $([Environment]::ProcessorCount) logical CPUs, $memory GB memory"
          Write-Output $facts
          if ($env:GITHUB_STEP_SUMMARY) { $facts | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # A self-hosted runner keeps its own pip cache; saving one to the
          # repository cache could evict the hosted Rust caches.
          cache: ${{ runner.environment != 'self-hosted' && 'pip' || '' }}
          cache-dependency-path: pyproject.toml
      # A persistent runner shares one tool-cache Python between jobs; a venv
      # in the job's temporary directory starts each shard as clean as hosted.
      - name: Give the shard its own Python environment
        if: runner.environment == 'self-hosted'
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP 'parity-venv'
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = if ($IsWindows) { Join-Path $venv 'Scripts' } else { Join-Path $venv 'bin' }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "VIRTUAL_ENV=$venv" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: dtolnay/rust-toolchain@stable
        if: "!startsWith(matrix.suite, 'w1c-')"
        with:
          toolchain: 1.94.0
      - name: Keep only the pinned Rust toolchain
        if: runner.environment != 'self-hosted' && (matrix.suite == 'eval' || matrix.suite == 'cli' || matrix.suite == 'cli-daemon')
        shell: pwsh
        run: |
          $toolchainFile = Join-Path $env:GITHUB_WORKSPACE 'rust/rust-toolchain.toml'
          $match = Select-String -LiteralPath $toolchainFile -Pattern '^channel = "([^"]+)"$' | Select-Object -First 1
          if (-not $match) { throw "rust/rust-toolchain.toml names no channel; nothing is known to keep" }
          $pinned = $match.Matches[0].Groups[1].Value
          foreach ($line in @(rustup toolchain list)) {
            $name = ($line -split '\s+')[0]
            if ($name -and -not $name.StartsWith("$pinned-")) {
              rustup toolchain uninstall $name
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          rustup toolchain list
          exit $LASTEXITCODE
      # One key per suite. All suites shared one key: the first to save fixed
      # it, and on an exact hit no later suite's compile was ever saved.
      # Only the suites that compile cache (sent-YAML mutants in cli, the
      # storage test binary in cli-daemon, which_comparison in eval); the
      # rest restored a 71 MB registry they never read (master run
      # 39236836263, 2026-10-19).
      - uses: Swatinem/rust-cache@v2
        if: matrix.suite == 'eval' || matrix.suite == 'cli' || matrix.suite == 'cli-daemon'
        with:
          workspaces: rust
          key: ${{ matrix.suite }}
          cache-on-failure: true
          save-if: ${{ runner.environment != 'self-hosted' }}
      - name: Install checkout and test dependencies
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools>=68" wheel
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.13.0"
          python -m pip install -e ".[dev,lite]" "mcp==2.2.0"
      - uses: actions/download-artifact@v4
        with:
          name: rust-shim-${{ runner.os }}
          path: rust/target/release
      - name: Download debug bind fixture
        if: matrix.suite == 'cli-live' || matrix.suite == 'h5-w1a'
        uses: actions/download-artifact@v4
        with:
          name: daemon-bind-fixture-${{ runner.os }}
          path: rust/target/debug
      - name: Restore executable permission
        if: runner.os == 'Linux'
        run: chmod +x rust/target/release/pseudolife-stdio rust/target/release/pseudolife-daemon rust/target/release/pseudolife-daemon-static
      - name: Compare sent YAML startup with PyYAML
        if: matrix.suite == 'cli'
        shell: pwsh
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $env:PSEUDOLIFE_SENT_YAML_BIN = Join-Path (Get-Location) "rust/target/release/pseudolife-stdio$suffix"
          python -m pytest rust/daemon/harness/test_sent_yaml.py rust/daemon/harness/test_sent_yaml_mutants.py -q -ra --durations=30 --junitxml (Join-Path $env:RUNNER_TEMP 'junit/compare-sent-yaml-startup-with-pyyaml.xml')
          exit $LASTEXITCODE
      - name: Bind the event-selected Python oracle
        shell: pwsh
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          python -m evals.rust_port.oracle_selection --out (Join-Path $env:RUNNER_TEMP 'oracle-selection.json') --github-env $env:GITHUB_ENV
          exit $LASTEXITCODE
      - name: Check CI coverage contract
        if: matrix.suite == 'eval'
        run: python -m pytest -q rust/ci -ra --durations=30 --junitxml ${{ runner.temp }}/junit/check-ci-coverage-contract.xml
      - name: Run every eval harness test
        if: matrix.suite == 'eval'
        shell: pwsh
        run: |
          $binaryName = if ($IsWindows) { 'pseudolife-stdio.exe' } else { 'pseudolife-stdio' }
          $episodeCandidate = (Resolve-Path (Join-Path 'rust/target/release' $binaryName)).Path
          $env:PSEUDOLIFE_PORT_EPISODE_JSON = ConvertTo-Json -InputObject @($episodeCandidate) -Compress
          $evalReport = Join-Path $env:RUNNER_TEMP 'rust-eval-harness.junit.xml'
          python -m pytest evals/rust_port evals/rust_baseline -p evals.rust_port.collection_guard --eval-collection-guard -ra --durations=30 --junitxml $evalReport
          exit $LASTEXITCODE
      # Linux 2026-10-13: offline W2-D checks measured below one second;
      # one minute is the smallest whole-minute timeout above twice that.
      - name: Offline W2-D search harness regressions
        if: matrix.suite == 'eval'
        timeout-minutes: 1
        shell: pwsh
        run: |
          python -m pytest -q rust/daemon/harness/test_w2d_controls.py rust/daemon/harness/test_w2d_namespace.py rust/daemon/harness/test_w2d_recent.py -ra --durations=30 --junitxml (Join-Path $env:RUNNER_TEMP 'junit/offline-w2-d-search-harness-regressions.xml')
          exit $LASTEXITCODE
      # This fixture creates a small graph locally; no model is downloaded.
      - name: Offline embedding golden and mutant row
        if: matrix.suite == 'eval'
        timeout-minutes: 10
        shell: pwsh
        run: |
          python -m pip install "onnx==1.22.0" "onnxruntime==1.27.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binaryName = if ($IsWindows) { 'pseudolife-daemon.exe' } else { 'pseudolife-daemon' }
          python -m pytest -q rust/daemon/harness/test_embedding.py -ra --durations=30 --junitxml (Join-Path $env:RUNNER_TEMP 'junit/offline-embedding-golden-and-mutant-row.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/run.py embedding --fixture --golden rust/daemon/harness/goldens/embedding-fixture.json --rust-bin (Join-Path 'rust/target/release' $binaryName) --out (Join-Path $env:RUNNER_TEMP 'embedding-fixture.json')
          exit $LASTEXITCODE
      - name: CLI differential harness
        if: matrix.suite == 'cli'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $binaryName = if ($IsWindows) { 'pseudolife-stdio.exe' } else { 'pseudolife-stdio' }
          $candidate = (Resolve-Path (Join-Path 'rust/target/release' $binaryName)).Path
          $env:PSEUDOLIFE_RUST_BINARY = $candidate
          $env:PSEUDOLIFE_BACKUP_NATIVE_REQUIRED = '1'
          python -m pytest -q -p no:cacheprovider rust/cli_harness/test_cli_harness.py rust/cli_harness/test_lease.py rust/cli_harness/test_bank.py rust/cli_harness/test_backup.py -ra --durations=30 --junitxml (Join-Path $env:RUNNER_TEMP 'junit/cli-differential-harness.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/cli_harness --row mail --row hook --row episode --golden --candidate $candidate -v --out (Join-Path $env:RUNNER_TEMP 'cli-harness-golden.json')
          exit $LASTEXITCODE
      # The same rows against this checkout's Python live: the hook row's
      # 250 ms health probe is part of what is compared, so a cold Windows
      # runner's first TLS handshake can decide it (2026-10-16 root cause).
      - name: CLI differential harness live arms
        if: matrix.suite == 'cli-live'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $binaryName = if ($IsWindows) { 'pseudolife-stdio.exe' } else { 'pseudolife-stdio' }
          $candidate = (Resolve-Path (Join-Path 'rust/target/release' $binaryName)).Path
          python rust/cli_harness --row mail --row hook --row episode --skip-bank --candidate $candidate -v --out (Join-Path $env:RUNNER_TEMP 'cli-harness.json')
          exit $LASTEXITCODE
      - name: Prepare disposable PostgreSQL for CLI lease row
        # Every cli shard's daemon harnesses take their banks from it.
        if: startsWith(matrix.suite, 'cli')
        timeout-minutes: 10
        shell: pwsh
        # pg0's initdb inherits the locale on Linux; template1 then retains
        # both the recorded graph-read ordering and the test login's vector.
        env:
          LANG: ${{ runner.os == 'Linux' && 'en_US.UTF-8' || '' }}
          LC_ALL: ${{ runner.os == 'Linux' && 'en_US.UTF-8' || '' }}
        run: |
          python rust/cli_harness/lease_ci.py
          exit $LASTEXITCODE
      - name: CLI lease differential harness
        if: matrix.suite == 'cli'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $binaryName = if ($IsWindows) { 'pseudolife-stdio.exe' } else { 'pseudolife-stdio' }
          $candidate = (Resolve-Path (Join-Path 'rust/target/release' $binaryName)).Path
          python rust/cli_harness --row lease --candidate $candidate -v --out (Join-Path $env:RUNNER_TEMP 'cli-harness-lease.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/cli_harness --row lease --golden --candidate $candidate -v
          exit $LASTEXITCODE
      # Local 2026-10-17, 36/35 cases: Windows live 101s + golden 43s,
      # WSL live 67s + golden 39s, controls under 1s; ten minutes is about
      # four times the slower platform.
      - name: CLI lease operator differential harness
        if: matrix.suite == 'cli'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $binaryName = if ($IsWindows) { 'pseudolife-stdio.exe' } else { 'pseudolife-stdio' }
          $candidate = (Resolve-Path (Join-Path 'rust/target/release' $binaryName)).Path
          python -m pytest -q -p no:cacheprovider rust/cli_harness/test_lease_operator.py rust/cli_harness/test_lease_transport.py -ra --durations=30 --junitxml (Join-Path $env:RUNNER_TEMP 'junit/cli-lease-operator-differential-harness.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/cli_harness --row lease_operator --candidate $candidate -v --out (Join-Path $env:RUNNER_TEMP 'cli-harness-lease-operator.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/cli_harness --row lease_operator --golden --candidate $candidate -v
          exit $LASTEXITCODE
      # Windows local 2026-10-10: 89-action golden 49s + eight live controls 209s
      # + recovery/control tests 38s; allow about twice the measured 296s gate.
      - name: Dream cursor differential harness
        if: matrix.suite == 'cli'
        timeout-minutes: 10
        shell: pwsh
        env:
          PL_HARNESS_SLICE: w3d
        run: |
          $binaryName = if ($IsWindows) { 'dream-contract.exe' } else { 'dream-contract' }
          $candidate = (Resolve-Path (Join-Path 'rust/target/release' $binaryName)).Path
          if (-not $IsWindows) { chmod +x $candidate }
          $env:PL_DREAM_CONTRACT_BINARY = $candidate
          python -m pytest -q rust/daemon/harness/test_dream_cursors.py rust/daemon/harness/test_dream_cursor_cancel.py -ra --durations=30 --junitxml (Join-Path $env:RUNNER_TEMP 'junit/dream-cursor-differential-harness.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/dream_cursors.py golden --ci-fixture --rust-bin $candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/dream_cursors.py mutants --ci-fixture --rust-bin $candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PSEUDOLIFE_DAEMON_MUTANT = 'dream-cancel-drop-task'
          $cancelLog = Join-Path $env:RUNNER_TEMP 'dream-cancel-mutant.log'
          python -m pytest -q rust/daemon/harness/test_dream_cursor_cancel.py -k admitted_commit_survives_cancel_and_next_pull > $cancelLog 2>&1
          $cancelExit = $LASTEXITCODE
          Remove-Item Env:PSEUDOLIFE_DAEMON_MUTANT
          Write-Output 'Mutant control dream-cancel-drop-task: the test below MUST fail (expected); this step fails only if the control passes.'
          Get-Content -Tail 20 $cancelLog
          if ($cancelExit -ne 1 -or -not (Select-String -LiteralPath $cancelLog -Pattern 'AssertionError|_queue.Empty' -Quiet)) {
            throw 'Cancelled-waiter ownership control was not rejected by the next-operation check'
          }
          exit 0
      - name: Daemon static HTTP parity
        if: matrix.suite == 'cli'
        timeout-minutes: 10
        shell: pwsh
        env:
          PL_HARNESS_SLICE: http
        run: |
          $binaryName = if ($IsWindows) { 'pseudolife-daemon-static.exe' } else { 'pseudolife-daemon-static' }
          $candidate = (Resolve-Path (Join-Path 'rust/target/release' $binaryName)).Path
          $env:PL_STATIC_DEFAULT_BIN = $candidate
          python -m pytest -q rust/daemon/harness/test_static.py -ra --durations=30 --junitxml (Join-Path $env:RUNNER_TEMP 'junit/daemon-static-http-parity.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/run.py live --rust-bin $candidate --only static-build static-paths static-missing static-root-link --out (Join-Path $env:RUNNER_TEMP 'daemon-static-live.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/run.py golden --rust-bin $candidate --only static-build static-paths static-missing static-root-link --out (Join-Path $env:RUNNER_TEMP 'daemon-static-golden.json')
          exit $LASTEXITCODE
      - name: Retain daemon static parity outcomes
        if: always() && matrix.suite == 'cli'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PARITY_ARTIFACT_PREFIX }}daemon-static-${{ runner.os }}
          path: ${{ runner.temp }}/daemon-static-*.json
          if-no-files-found: warn
      - name: Restore graph store executable permission
        if: matrix.suite == 'cli' && runner.os == 'Linux'
        run: chmod +x rust/target/release/graph-contract
      - name: Graph store differential and recorded oracle
        if: matrix.suite == 'cli'
        timeout-minutes: 10
        shell: pwsh
        env:
          PL_GRAPH_REQUIRE_RECORDED_LOCALE: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: |
          $binaryName = if ($IsWindows) { 'graph-contract.exe' } else { 'graph-contract' }
          $candidate = (Resolve-Path (Join-Path 'rust/target/release' $binaryName)).Path
          python rust/daemon/harness/gen_graph_unicode.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/test_graph_store_harness.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/graph_store.py live --candidate $candidate --out (Join-Path $env:RUNNER_TEMP 'graph-store-live.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/graph_store.py golden --candidate $candidate --out (Join-Path $env:RUNNER_TEMP 'graph-store-golden.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/test_graph_read_compare.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/graph_store.py live --row read --candidate $candidate --out (Join-Path $env:RUNNER_TEMP 'graph-read-live.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/graph_store.py golden --row read --candidate $candidate --out (Join-Path $env:RUNNER_TEMP 'graph-read-golden.json')
          exit $LASTEXITCODE
      - name: Daemon background pruning golden
        if: matrix.suite == 'cli'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $binaryName = if ($IsWindows) { 'pseudolife-daemon.exe' } else { 'pseudolife-daemon' }
          $candidate = (Resolve-Path (Join-Path 'rust/target/release' $binaryName)).Path
          $env:PL_HARNESS_SLICE = 'w3i'
          $env:PL_HARNESS_SCRATCH = Join-Path $env:RUNNER_TEMP 'daemon-background-harness'
          python -m pytest -q -p no:cacheprovider rust/daemon/harness/test_background_harness.py -ra --durations=30 --junitxml (Join-Path $env:RUNNER_TEMP 'junit/daemon-background-pruning-golden.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/run.py golden --rust-bin $candidate --only sweep-pruning --no-refusals
          exit $LASTEXITCODE

      - name: Daemon body admission parity
        if: matrix.suite == 'cli-live'
        timeout-minutes: 10
        shell: pwsh
        env:
          PL_HARNESS_SLICE: http
        run: |
          $binaryName = if ($IsWindows) { 'pseudolife-daemon-static.exe' } else { 'pseudolife-daemon-static' }
          $candidate = (Resolve-Path (Join-Path 'rust/target/release' $binaryName)).Path
          python -m pytest -q rust/daemon/harness/test_body_cases.py -ra --durations=30 --junitxml (Join-Path $env:RUNNER_TEMP 'junit/daemon-body-admission-parity.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/run.py live --rust-bin $candidate --only body-limits body-view-open body-pair-budget body-text-window --out (Join-Path $env:RUNNER_TEMP 'daemon-body-live.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/run.py golden --rust-bin $candidate --only body-limits body-view-open body-pair-budget body-text-window --out (Join-Path $env:RUNNER_TEMP 'daemon-body-golden.json')
          exit $LASTEXITCODE
      - name: Retain daemon body parity outcomes
        if: always() && matrix.suite == 'cli-live'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PARITY_ARTIFACT_PREFIX }}daemon-body-${{ runner.os }}
          path: ${{ runner.temp }}/daemon-body-*.json
          if-no-files-found: warn
      - name: Daemon security admission parity
        if: matrix.suite == 'cli-live'
        timeout-minutes: 10
        shell: pwsh
        env:
          PL_HARNESS_SLICE: http
        run: |
          $defaultName = if ($IsWindows) { 'pseudolife-daemon-static.exe' } else { 'pseudolife-daemon-static' }
          $mutantName = if ($IsWindows) { 'pseudolife-daemon.exe' } else { 'pseudolife-daemon' }
          $candidate = (Resolve-Path (Join-Path 'rust/target/release' $defaultName)).Path
          $mutants = (Resolve-Path (Join-Path 'rust/target/release' $mutantName)).Path
          $bindFixture = (Resolve-Path (Join-Path 'rust/target/debug' $mutantName)).Path
          if (-not $IsWindows) { chmod +x $bindFixture }
          $env:PL_SECURITY_DEFAULT_BIN = $candidate
          $env:PL_SECURITY_RELEASE_MUTANTS_BIN = $mutants
          python -m pytest -q rust/daemon/harness/test_security_cases.py rust/daemon/harness/test_principals_settle.py -ra --durations=30 --junitxml (Join-Path $env:RUNNER_TEMP 'junit/daemon-security-admission-parity.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/run.py live --rust-bin $candidate --only security-open security-closed security-encodings security-encoding-priority security-terminal-byte security-refusals --out (Join-Path $env:RUNNER_TEMP 'daemon-security-live.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/run.py golden --rust-bin $candidate --only security-open security-closed security-encodings security-encoding-priority security-terminal-byte --out (Join-Path $env:RUNNER_TEMP 'daemon-security-golden.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/run.py mutants --rust-bin $mutants --only security-open security-closed security-encodings security-encoding-priority security-terminal-byte --mutants security-origin-open security-host-open security-browser-last security-auth-first security-drop-latin1 security-unavailable-401 --out (Join-Path $env:RUNNER_TEMP 'daemon-security-mutants.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/run.py live --rust-bin $bindFixture --only security-remote-open security-remote-auth --out (Join-Path $env:RUNNER_TEMP 'daemon-security-remote.json')
          exit $LASTEXITCODE
      # Linux 2026-10-13: coercion baseline + four controls + disabled control 204.2s,
      # targeted tests 14.68s; Linux's seven minutes is about twice that gate.
      # The tool argument binding sweep and its 14 mutants add 9.4s (Windows
      # release build, 2026-10-16).
      - name: Daemon MCP live parity and controls
        if: matrix.suite == 'cli-live'
        # Windows master 2026-10-15: 6m28s and 6m49s (runs 38689105018,
        # 38794022446), so seven minutes had no headroom; fourteen is about
        # twice that gate.
        timeout-minutes: ${{ runner.os == 'Linux' && 7 || 14 }}
        shell: pwsh
        env:
          PL_HARNESS_SLICE: w2g
        run: |
          $defaultName = if ($IsWindows) { 'pseudolife-daemon-static.exe' } else { 'pseudolife-daemon-static' }
          $mutantName = if ($IsWindows) { 'pseudolife-daemon.exe' } else { 'pseudolife-daemon' }
          $candidate = (Resolve-Path (Join-Path 'rust/target/release' $defaultName)).Path
          $mutants = (Resolve-Path (Join-Path 'rust/target/release' $mutantName)).Path
          $env:PL_HARNESS_SCRATCH = Join-Path $env:RUNNER_TEMP 'daemon-mcp-homes'
          # Scalar coercions are not fully described by the SDK JSON schemas.
          python -m pip install "pydantic==2.14.0" "pydantic-core==2.50.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q tests/test_rust_mcp_catalogue.py rust/daemon/harness/test_mcp_mount.py rust/daemon/harness/test_mcp_mutant_verdict.py rust/daemon/harness/test_mcp_ci.py rust/daemon/harness/test_mcp_runner.py rust/daemon/harness/test_mcp_validation.py rust/daemon/harness/test_mcp_binding.py rust/daemon/harness/test_mcp_wire.py -ra --durations=30 --junitxml (Join-Path $env:RUNNER_TEMP 'junit/daemon-mcp-live-parity-and-controls.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
