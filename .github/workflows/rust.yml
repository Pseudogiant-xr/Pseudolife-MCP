          python rust/daemon/harness/mcp_binding_sweep.py --rust-bin $mutants --mutants --show 10 --out (Join-Path $mcpOut 'binding-sweep.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/mcp_ci.py --default-bin $candidate --mutant-bin $mutants --out (Join-Path $env:RUNNER_TEMP 'daemon-mcp')
          exit $LASTEXITCODE
      - name: Retain daemon MCP parity outcomes
        if: always() && matrix.suite == 'cli-live'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PARITY_ARTIFACT_PREFIX }}daemon-mcp-${{ runner.os }}
          path: |
            ${{ runner.temp }}/daemon-mcp/**/*.json
            ${{ runner.temp }}/daemon-mcp/*.log
