          GITHUB_REF: ${{ github.ref }}
          PSEUDOLIFE_PORT_DISPATCH_BASE: ${{ needs.scope.outputs.oracle_base }}
        run: |
          python -m evals.rust_port.oracle_selection --out (Join-Path $env:RUNNER_TEMP 'oracle-selection.json') --github-env $env:GITHUB_ENV
          exit $LASTEXITCODE
      - name: Check CI coverage contract
        if: matrix.suite == 'eval'
        run: python -m pytest -q rust/ci -ra --durations=30 --junitxml ${{ runner.temp }}/junit/check-ci-coverage-contract.xml
      - name: Run every eval harness test
        if: matrix.suite == 'eval'
        shell: pwsh
        run: |
          $binaryName = if ($IsWindows) { 'pseudolife-stdio.exe' } else { 'pseudolife-stdio' }
          $episodeCandidate = (Resolve-Path (Join-Path 'rust/target/release' $binaryName)).Path
          $env:PSEUDOLIFE_PORT_EPISODE_JSON = ConvertTo-Json -InputObject @($episodeCandidate) -Compress
          $evalReport = Join-Path $env:RUNNER_TEMP 'rust-eval-harness.junit.xml'
