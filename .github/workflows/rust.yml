name: Rust shim

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Ordinary CI or the bounded wait-mail capture'
        type: choice
        options: [ci, wait-mail]
        default: ci
        required: true
      case_list:
        description: 'Comma-separated supported wait-mail case IDs'
        type: string
        default: wait-mail-long-ring-watermark
        required: false
      frozen_head:
        description: 'Full reviewed commit ID, equal to the dispatched ref head'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'wait-mail' && format('rust-capture-{0}', github.run_id) || format('rust-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4
  CUDA_VISIBLE_DEVICES: '-1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  rust:
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'wait-mail'
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bind the selected Python interpreter for Rust fixtures
        shell: pwsh
        run: |
          $selectedPython = python -c 'import sys; print(sys.executable)'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PSEUDOLIFE_MCP_PYTHON=$selectedPython" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install the Python SDK fixture dependency
        run: python -m pip install "mcp==2.1.1"
      - name: Bind the event-selected Python oracle
        shell: pwsh
        working-directory: .
        run: |
          python -m evals.rust_port.oracle_selection --out (Join-Path $env:RUNNER_TEMP 'oracle-selection.json') --github-env $env:GITHUB_ENV
          exit $LASTEXITCODE
      - name: Prepare selected package metadata for the Rust identity contract
        shell: pwsh
        working-directory: .
        run: |
          $oracleMetadata = Join-Path $env:RUNNER_TEMP 'phase1-oracle-metadata'
          python -m evals.rust_port.phase1_oracle --metadata-only --destination $oracleMetadata
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PSEUDOLIFE_PORT_ORACLE_ROOT=$oracleMetadata" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install pinned nextest in the runner temporary directory
        shell: pwsh
        run: |
          $nextestRoot = Join-Path $env:RUNNER_TEMP 'nextest-0.9.146'
          New-Item -ItemType Directory -Force -Path $nextestRoot | Out-Null
          if ($IsWindows) {
            $nextestArchive = Join-Path $env:RUNNER_TEMP 'nextest.zip'
            Invoke-WebRequest 'https://get.nexte.st/0.9.146/windows' -OutFile $nextestArchive
            Expand-Archive -LiteralPath $nextestArchive -DestinationPath $nextestRoot
          } else {
            $nextestArchive = Join-Path $env:RUNNER_TEMP 'nextest.tar.gz'
            Invoke-WebRequest 'https://get.nexte.st/0.9.146/linux' -OutFile $nextestArchive
            tar -xzf $nextestArchive -C $nextestRoot
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $nextestRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check all targets
        run: cargo check --locked --all-targets -j 4
      - name: Clippy
        run: cargo clippy --locked --all-targets -j 4 -- -D warnings
      - name: Nextest
        run: cargo nextest run --locked --all-targets -j 4
      - name: Check all targets without default features
        run: cargo check --locked --all-targets --no-default-features -j 4
      - name: Clippy without default features
        run: cargo clippy --locked --all-targets --no-default-features -j 4 -- -D warnings
      - name: Nextest without default features
        run: cargo nextest run --locked --all-targets --no-default-features -j 4
      - name: Build candidate
        run: cargo build --locked --release --bin pseudolife-stdio -j 4
      - uses: actions/upload-artifact@v4
        with:
          name: rust-shim-${{ runner.os }}
          path: |
            rust/target/release/pseudolife-stdio
            rust/target/release/pseudolife-stdio.exe
          if-no-files-found: error

  parity:
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'wait-mail'
    name: Parity / ${{ matrix.os }}
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install checkout and test dependencies
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools>=68" wheel
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.13.0"
          python -m pip install -e ".[dev,lite]" "mcp==2.1.1"
      - name: Build candidate
        timeout-minutes: 10
        working-directory: rust
        run: cargo build --locked --release --bin pseudolife-stdio -j 4
      - name: Bind the event-selected Python oracle
        shell: pwsh
        run: |
          python -m evals.rust_port.oracle_selection --out (Join-Path $env:RUNNER_TEMP 'oracle-selection.json') --github-env $env:GITHUB_ENV
          exit $LASTEXITCODE
      - name: Run every eval harness test
        shell: pwsh
        run: |
          $binaryName = if ($IsWindows) { 'pseudolife-stdio.exe' } else { 'pseudolife-stdio' }
          $episodeCandidate = (Resolve-Path (Join-Path 'rust/target/release' $binaryName)).Path
          $env:PSEUDOLIFE_PORT_EPISODE_JSON = ConvertTo-Json -InputObject @($episodeCandidate) -Compress
          $evalReport = Join-Path $env:RUNNER_TEMP 'rust-eval-harness.junit.xml'
          python -m pytest evals/rust_port evals/rust_baseline -p evals.rust_port.collection_guard --eval-collection-guard --junitxml $evalReport
          exit $LASTEXITCODE
      - name: Retain additive executable node outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-eval-harness-${{ runner.os }}
          path: ${{ runner.temp }}/rust-eval-harness.junit.xml
          if-no-files-found: error
      - name: Run unchanged candidates and differential judges
        timeout-minutes: 15
        shell: pwsh
        run: |
          $checkoutRoot = (Get-Location).Path
          $oracleRoot = Join-Path $env:RUNNER_TEMP 'phase1-oracle'
          python -m evals.rust_port.phase1_oracle --destination $oracleRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pseudolife_memory.cli lease check full-suite
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $resourceCheckedAt = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
          $binaryName = if ($IsWindows) { 'pseudolife-stdio.exe' } else { 'pseudolife-stdio' }
          $candidatePath = (Resolve-Path (Join-Path 'rust/target/release' $binaryName)).Path
          $candidateCommand = ConvertTo-Json -InputObject @($candidatePath) -Compress
          $privateReceipt = Join-Path $env:RUNNER_TEMP 'rust-parity.json'
          $publicReceipt = Join-Path $checkoutRoot "evals/results/rust-phase1-ci-$env:RUNNER_OS.json"
          $oraclePython = if ($IsWindows) {
            Join-Path $oracleRoot 'runtime/Scripts/python.exe'
          } else {
            Join-Path $oracleRoot 'runtime/bin/python'
          }
          $env:PSEUDOLIFE_MCP_PYTHON = $oraclePython
          $env:PATH = (Split-Path $oraclePython) + [IO.Path]::PathSeparator + $env:PATH
          $oracleSource = Join-Path $oracleRoot 'source'
          $env:PSEUDOLIFE_RUST_BINARY = $candidatePath
          $env:PSEUDOLIFE_WAIT_MAIL_ORACLE_ROOT = $oracleSource
          $env:PSEUDOLIFE_WAIT_MAIL_NATIVE_REQUIRED = '1'
          & $oraclePython -m pytest -q evals/rust_port/test_cli_wait_mail.py evals/rust_port/test_wait_mail_phase2d_native.py evals/rust_port/test_wait_mail_reduction_native.py evals/rust_port/test_wait_mail_producer_native.py evals/rust_port/test_wait_mail_candidate_contract.py evals/rust_port/test_wait_mail_measurement.py evals/rust_port/test_wait_mail_listener_events.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $leaseHeaderReceipt = Join-Path $env:RUNNER_TEMP 'lease-header-policy.json'
          & $oraclePython -m evals.rust_port.lease_headers --root $checkoutRoot --candidate $candidatePath --out $leaseHeaderReceipt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $privateArgvReceipt = Join-Path $env:RUNNER_TEMP 'rust-cli-argv.json'
          $publicArgvReceipt = Join-Path $checkoutRoot "evals/results/rust-cli-argv-$env:RUNNER_OS.json"
          & $oraclePython -m evals.rust_port.cli_argv --oracle-root $oracleSource --candidate-json $candidateCommand --out $privateArgvReceipt --public-out $publicArgvReceipt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $judgeBootstrap = @'
          import pathlib, subprocess, sys
          from evals.rust_port.provenance import module_command
          root = pathlib.Path(sys.argv[1]).resolve()
          command = module_command("evals.rust_port.phase1_ci", root, sys.argv[2:])
          raise SystemExit(subprocess.run(command, cwd=root).returncode)
          '@
          & $oraclePython -c $judgeBootstrap $oracleSource --oracle-root $oracleSource --candidate-json $candidateCommand --candidate-root $checkoutRoot --out $privateReceipt --public-out $publicReceipt --offline-resource-checked-at $resourceCheckedAt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $phase2Bootstrap = @'
          import pathlib, subprocess, sys
          from evals.rust_port.provenance import module_command
          root = pathlib.Path(sys.argv[1]).resolve()
          command = module_command("evals.rust_port.cli_dispatch", root, sys.argv[2:])
          raise SystemExit(subprocess.run(command, cwd=root).returncode)
          '@
          $phase2Evidence = Join-Path $env:RUNNER_TEMP 'phase2-cli-tests'
          $phase2Receipt = Join-Path $checkoutRoot "evals/results/rust-phase2-ci-$env:RUNNER_OS.json"
          & $oraclePython -c $phase2Bootstrap $oracleSource --oracle-root $oracleSource --candidate-json $candidateCommand --candidate-root $checkoutRoot --evidence-directory $phase2Evidence --out $phase2Receipt --offline-resource-checked-at $resourceCheckedAt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $processBootstrap = @'
          import os, pathlib, subprocess, sys, tempfile
          from psycopg.conninfo import conninfo_to_dict, make_conninfo
          from pseudolife_memory.storage.embedded_pg import attach_or_start
          from evals.rust_port.provenance import module_command
          root = pathlib.Path(sys.argv[1]).resolve()
          with tempfile.TemporaryDirectory(prefix="cli-corpus-postgres-") as directory:
              dsn, owned = attach_or_start(pathlib.Path(directory))
              if owned is None:
                  raise RuntimeError("fresh corpus PostgreSQL unexpectedly attached")
              try:
                  options = conninfo_to_dict(dsn)
                  options["dbname"] = "postgres"
                  env = dict(os.environ, PSEUDOLIFE_BENCH_ADMIN_URL=make_conninfo(**options))
                  command = module_command("evals.rust_port.cli_process", root, sys.argv[2:])
                  result = subprocess.run(command, cwd=root, env=env)
              finally:
                  owned.stop()
          raise SystemExit(result.returncode)
          '@
          $processReceipt = Join-Path $env:RUNNER_TEMP 'phase2b-cli-process.json'
          $processPublicReceipt = Join-Path $env:RUNNER_TEMP 'phase2b-cli-process-public.json'
          & $oraclePython -c $processBootstrap $oracleSource --oracle-root $oracleSource --candidate-json $candidateCommand --candidate-root $checkoutRoot --out $processReceipt --public-out $processPublicReceipt --modes help version lease --offline-resource-checked-at $resourceCheckedAt
          exit $LASTEXITCODE
      - name: Retain comparison summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-parity-${{ runner.os }}
          path: |
            evals/results/rust-phase1-ci-*.json
            evals/results/rust-phase2-ci-*.json
            evals/results/rust-cli-argv-*.json
            ${{ runner.temp }}/phase2b-cli-process-public.json
            ${{ runner.temp }}/lease-header-policy.json
            ${{ runner.temp }}/oracle-selection.json
          if-no-files-found: warn

  capture-windows:
    name: Capture / Windows / wait-mail
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'wait-mail'
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CAPTURE_MODE: ${{ inputs.mode }}
      CAPTURE_CASE_LIST: ${{ inputs.case_list }}
      CAPTURE_FROZEN_HEAD: ${{ inputs.frozen_head }}
    steps:
      - name: Validate the dispatch selector
        shell: pwsh
        run: |
          if ($env:CAPTURE_MODE -cne 'wait-mail') { throw 'Unsupported mode' }
          if ($env:CAPTURE_FROZEN_HEAD -cnotmatch '^[0-9a-f]{40}$') { throw 'Full commit ID required' }
          if ($env:CAPTURE_FROZEN_HEAD -cne $env:GITHUB_SHA) { throw 'Dispatch ref and frozen head must match' }
          $allowed = @('wait-mail-long-ring-watermark', 'wait-mail-bad-ring-reason', 'wait-mail-unicode-delivery')
          $selected = $env:CAPTURE_CASE_LIST.Split(',')
          if ($selected.Count -lt 1 -or $selected.Count -gt 3 -or (@($selected | Select-Object -Unique).Count -ne $selected.Count)) { throw 'Invalid case list' }
          foreach ($caseId in $selected) { if ($allowed -cnotcontains $caseId) { throw 'Unsupported case' } }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      - name: Install checkout and test dependencies
        timeout-minutes: 10
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install "setuptools>=68" wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.13.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -e ".[dev,lite]" "mcp==2.1.1"
          exit $LASTEXITCODE
      - name: Bind the frozen-head Python oracle
        shell: pwsh
        run: |
          python -m evals.rust_port.oracle_selection --out (Join-Path $env:RUNNER_TEMP 'oracle-selection.json') --github-env $env:GITHUB_ENV
          exit $LASTEXITCODE
      - name: Prepare the selected oracle
        timeout-minutes: 10
        shell: pwsh
        run: |
          $oracleRoot = Join-Path $env:RUNNER_TEMP 'phase1-oracle'
          python -m evals.rust_port.phase1_oracle --destination $oracleRoot
          exit $LASTEXITCODE
      - name: Build and bind the candidate
        timeout-minutes: 20
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/hosted-windows-cargo
        run: |
          $receiptRoot = Join-Path $env:RUNNER_TEMP 'hosted-windows-capture'
          New-Item -ItemType Directory -Path $receiptRoot -ErrorAction Stop | Out-Null
          $beforeHead = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $beforeHead -cne $env:CAPTURE_FROZEN_HEAD) { throw 'Source head mismatch' }
          cargo build --manifest-path rust/Cargo.toml --locked --release --bin pseudolife-stdio -j 4 *> (Join-Path $receiptRoot 'build.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $candidate = Join-Path $env:CARGO_TARGET_DIR 'release/pseudolife-stdio.exe'
          $manifest = [ordered]@{
            head = $beforeHead
            oracleHead = (ConvertFrom-Json $env:PSEUDOLIFE_PORT_ORACLE_SELECTION).oracle_head
            tree = (git rev-parse 'HEAD^{tree}')
            sourceEntries = @(git ls-files -s)
            candidateSha256 = (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant()
            buildArgv = @('cargo','build','--manifest-path','rust/Cargo.toml','--locked','--release','--bin','pseudolife-stdio','-j','4')
            rustc = (rustc --version)
            cargo = (cargo --version)
            runnerOS = $env:RUNNER_OS
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $receiptRoot 'build-binding.json') -Encoding utf8
      - name: Capture the named disposable cases
        timeout-minutes: 5
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/hosted-windows-cargo
        run: |
          $checkoutRoot = (Get-Location).Path
          $oracleSource = Join-Path $env:RUNNER_TEMP 'phase1-oracle/source'
          $oraclePython = Join-Path $env:RUNNER_TEMP 'phase1-oracle/runtime/Scripts/python.exe'
          $candidate = Join-Path $env:CARGO_TARGET_DIR 'release/pseudolife-stdio.exe'
          $receiptRoot = Join-Path $env:RUNNER_TEMP 'hosted-windows-capture'
          $env:PATH = (Split-Path $oraclePython) + [IO.Path]::PathSeparator + $env:PATH
          $bootstrap = @'
          import pathlib, subprocess, sys
          from evals.rust_port.provenance import module_command
          root = pathlib.Path(sys.argv[1]).resolve()
          command = module_command("evals.rust_port.hosted_wait_mail_capture", root, sys.argv[2:])
          raise SystemExit(subprocess.run(command, cwd=root).returncode)
          '@
          & $oraclePython -c $bootstrap $oracleSource --mode $env:CAPTURE_MODE --case-list $env:CAPTURE_CASE_LIST --frozen-head $env:CAPTURE_FROZEN_HEAD --oracle-root $oracleSource --candidate-root $checkoutRoot --candidate $candidate --out (Join-Path $receiptRoot 'raw-receipt.json') *> (Join-Path $receiptRoot 'capture.log')
          exit $LASTEXITCODE
      - name: Retain raw capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-windows-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hosted-windows-capture/
            ${{ runner.temp }}/oracle-selection.json
          if-no-files-found: warn
          retention-days: 7
