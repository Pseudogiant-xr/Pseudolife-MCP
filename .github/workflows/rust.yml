          PL_GRAPH_REQUIRE_RECORDED_LOCALE: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: |
          $binaryName = if ($IsWindows) { 'graph-contract.exe' } else { 'graph-contract' }
          $candidate = (Resolve-Path (Join-Path 'rust/target/release' $binaryName)).Path
          python rust/daemon/harness/gen_graph_unicode.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/test_graph_store_harness.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/graph_store.py live --candidate $candidate --out (Join-Path $env:RUNNER_TEMP 'graph-store-live.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/graph_store.py golden --candidate $candidate --out (Join-Path $env:RUNNER_TEMP 'graph-store-golden.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/test_graph_read_compare.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/graph_store.py live --row read --candidate $candidate --out (Join-Path $env:RUNNER_TEMP 'graph-read-live.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/graph_store.py golden --row read --candidate $candidate --out (Join-Path $env:RUNNER_TEMP 'graph-read-golden.json')
          exit $LASTEXITCODE
      - name: Daemon background pruning golden
        if: matrix.suite == 'cli-store'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $binaryName = if ($IsWindows) { 'pseudolife-daemon.exe' } else { 'pseudolife-daemon' }
          $candidate = (Resolve-Path (Join-Path 'rust/target/release' $binaryName)).Path
          $env:PL_HARNESS_SLICE = 'w3i'
          $env:PL_HARNESS_SCRATCH = Join-Path $env:RUNNER_TEMP 'daemon-background-harness'
          python -m pytest -q -p no:cacheprovider rust/daemon/harness/test_background_harness.py -ra --durations=30 --junitxml (Join-Path $env:RUNNER_TEMP 'junit/daemon-background-pruning-golden.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/run.py golden --rust-bin $candidate --only sweep-pruning --no-refusals
          exit $LASTEXITCODE

      - name: Daemon body admission parity
        if: matrix.suite == 'cli-live'
        timeout-minutes: 10
        shell: pwsh
        env:
          PL_HARNESS_SLICE: http
        run: |
          $binaryName = if ($IsWindows) { 'pseudolife-daemon-static.exe' } else { 'pseudolife-daemon-static' }
          $candidate = (Resolve-Path (Join-Path 'rust/target/release' $binaryName)).Path
          python -m pytest -q rust/daemon/harness/test_body_cases.py -ra --durations=30 --junitxml (Join-Path $env:RUNNER_TEMP 'junit/daemon-body-admission-parity.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/run.py live --rust-bin $candidate --only body-limits body-view-open body-pair-budget body-text-window --out (Join-Path $env:RUNNER_TEMP 'daemon-body-live.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/run.py golden --rust-bin $candidate --only body-limits body-view-open body-pair-budget body-text-window --out (Join-Path $env:RUNNER_TEMP 'daemon-body-golden.json')
          exit $LASTEXITCODE
      - name: Retain daemon body parity outcomes
        if: always() && matrix.suite == 'cli-live'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PARITY_ARTIFACT_PREFIX }}daemon-body-${{ runner.os }}
          path: ${{ runner.temp }}/daemon-body-*.json
          if-no-files-found: warn
      - name: Daemon security admission parity
        if: matrix.suite == 'cli-live'
        # About forty harness rows. Hosted windows-latest 2026-11-01..04:
        # 313-470 s. The self-hosted Windows workers: 444, 483 and 585 s
        # passing, and 602/603 s cut off by ten minutes with every finished
        # mutant caught (runs 41436144681, 41623700371), at 12-16 s a row
        # while both self-hosted lanes shared the host. Twenty is about twice
        # their slowest pass; hosted keeps ten.
        timeout-minutes: ${{ runner.environment == 'self-hosted' && runner.os == 'Windows' && 20 || 10 }}
        shell: pwsh
        env:
          PL_HARNESS_SLICE: http
        run: |
          $defaultName = if ($IsWindows) { 'pseudolife-daemon-static.exe' } else { 'pseudolife-daemon-static' }
          $mutantName = if ($IsWindows) { 'pseudolife-daemon.exe' } else { 'pseudolife-daemon' }
          $candidate = (Resolve-Path (Join-Path 'rust/target/release' $defaultName)).Path
          $mutants = (Resolve-Path (Join-Path 'rust/target/release' $mutantName)).Path
          $bindFixture = (Resolve-Path (Join-Path 'rust/target/debug' $mutantName)).Path
          if (-not $IsWindows) { chmod +x $bindFixture }
          $env:PL_SECURITY_DEFAULT_BIN = $candidate
          $env:PL_SECURITY_RELEASE_MUTANTS_BIN = $mutants
          python -m pytest -q rust/daemon/harness/test_security_cases.py rust/daemon/harness/test_principals_settle.py -ra --durations=30 --junitxml (Join-Path $env:RUNNER_TEMP 'junit/daemon-security-admission-parity.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/run.py live --rust-bin $candidate --only security-open security-closed security-encodings security-encoding-priority security-terminal-byte security-refusals --out (Join-Path $env:RUNNER_TEMP 'daemon-security-live.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/run.py golden --rust-bin $candidate --only security-open security-closed security-encodings security-encoding-priority security-terminal-byte --out (Join-Path $env:RUNNER_TEMP 'daemon-security-golden.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/run.py mutants --rust-bin $mutants --only security-open security-closed security-encodings security-encoding-priority security-terminal-byte --mutants security-origin-open security-host-open security-browser-last security-auth-first security-drop-latin1 security-unavailable-401 --out (Join-Path $env:RUNNER_TEMP 'daemon-security-mutants.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/run.py live --rust-bin $bindFixture --only security-remote-open security-remote-auth --out (Join-Path $env:RUNNER_TEMP 'daemon-security-remote.json')
          exit $LASTEXITCODE
      # Linux 2026-10-13: coercion baseline + four controls + disabled control 204.2s,
      # targeted tests 14.68s; Linux's seven minutes is about twice that gate.
      # The tool argument binding sweep and its 14 mutants add 9.4s (Windows
      # release build, 2026-10-16).
      - name: Daemon MCP live parity and controls
        if: matrix.suite == 'cli-live'
        # Windows master 2026-10-15: 6m28s and 6m49s (runs 38689105018,
        # 38794022446), so seven minutes had no headroom; fourteen is about
        # twice that gate.
        timeout-minutes: ${{ runner.os == 'Linux' && 7 || 14 }}
        shell: pwsh
        env:
          PL_HARNESS_SLICE: w2g
        run: |
          $defaultName = if ($IsWindows) { 'pseudolife-daemon-static.exe' } else { 'pseudolife-daemon-static' }
          $mutantName = if ($IsWindows) { 'pseudolife-daemon.exe' } else { 'pseudolife-daemon' }
          $candidate = (Resolve-Path (Join-Path 'rust/target/release' $defaultName)).Path
          $mutants = (Resolve-Path (Join-Path 'rust/target/release' $mutantName)).Path
          $env:PL_HARNESS_SCRATCH = Join-Path $env:RUNNER_TEMP 'daemon-mcp-homes'
          # Scalar coercions are not fully described by the SDK JSON schemas.
          python -m pip install "pydantic==2.14.0" "pydantic-core==2.50.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q tests/test_rust_mcp_catalogue.py rust/daemon/harness/test_mcp_mount.py rust/daemon/harness/test_mcp_mutant_verdict.py rust/daemon/harness/test_mcp_ci.py rust/daemon/harness/test_mcp_runner.py rust/daemon/harness/test_mcp_validation.py rust/daemon/harness/test_mcp_binding.py rust/daemon/harness/test_mcp_wire.py -ra --durations=30 --junitxml (Join-Path $env:RUNNER_TEMP 'junit/daemon-mcp-live-parity-and-controls.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Tool argument binding: the table is current, then every generated
          # case matches Python in process and every binder mutant is caught.
          python rust/daemon/harness/mcp_binding_table.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $mcpOut = New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'daemon-mcp')
          python rust/daemon/harness/mcp_binding_sweep.py --rust-bin $mutants --mutants --show 10 --out (Join-Path $mcpOut 'binding-sweep.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/mcp_ci.py --default-bin $candidate --mutant-bin $mutants --out (Join-Path $env:RUNNER_TEMP 'daemon-mcp')
          exit $LASTEXITCODE
      - name: Retain daemon MCP parity outcomes
        if: always() && matrix.suite == 'cli-live'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PARITY_ARTIFACT_PREFIX }}daemon-mcp-${{ runner.os }}
          path: |
            ${{ runner.temp }}/daemon-mcp/**/*.json
            ${{ runner.temp }}/daemon-mcp/*.log
          if-no-files-found: error
      - name: Retain daemon security parity outcomes
        if: always() && matrix.suite == 'cli-live'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PARITY_ARTIFACT_PREFIX }}daemon-security-${{ runner.os }}
          path: ${{ runner.temp }}/daemon-security-*.json
          if-no-files-found: warn
      - name: Retain additive executable node outcomes
        if: always() && matrix.suite == 'eval'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PARITY_ARTIFACT_PREFIX }}rust-eval-harness-${{ runner.os }}
          path: ${{ runner.temp }}/rust-eval-harness.junit.xml
          if-no-files-found: error
      - name: Principal store differential and golden harness
        if: matrix.suite == 'cli-store'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $binaryName = if ($IsWindows) { 'pseudolife-daemon.exe' } else { 'pseudolife-daemon' }
          $candidate = (Resolve-Path (Join-Path 'rust/target/release' $binaryName)).Path
          python rust/daemon/harness/principals.py live --rust-bin $candidate --out (Join-Path $env:RUNNER_TEMP 'principal-live.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/principals.py golden --rust-bin $candidate --out (Join-Path $env:RUNNER_TEMP 'principal-golden.json')
          exit $LASTEXITCODE
      - name: Retain principal store outcomes
        if: always() && matrix.suite == 'cli-store'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PARITY_ARTIFACT_PREFIX }}rust-principals-${{ runner.os }}
          path: ${{ runner.temp }}/principal-*.json
          if-no-files-found: error
      # In the single cli job these steps ran after the MCP step had pinned
      # pydantic for the Python oracle; keep the same pin now that they run
      # in their own shard.
      - name: Keep the oracle's pydantic pin for the startup steps
        id: startup_setup
        if: matrix.suite == 'cli-startup'
        run: python -m pip install "pydantic==2.14.0" "pydantic-core==2.50.0"
      - name: Daemon schema startup parity
        if: matrix.suite == 'cli-startup'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $testName = if ($IsWindows) { 'pseudolife-daemon-storage-test.exe' } else { 'pseudolife-daemon-storage-test' }
          $storageTest = (Resolve-Path (Join-Path 'rust/target/storage-test' $testName)).Path
          if (-not $IsWindows) { chmod +x $storageTest }
          python rust/daemon/harness/schema_ci.py --no-build --rust-test-bin $storageTest --out (Join-Path $env:RUNNER_TEMP 'daemon-schema-parity.json')
          exit $LASTEXITCODE
      - name: Retain daemon schema parity
        if: always() && matrix.suite == 'cli-startup'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PARITY_ARTIFACT_PREFIX }}daemon-schema-parity-${{ runner.os }}
          path: ${{ runner.temp }}/daemon-schema-parity.json
          if-no-files-found: error
      - name: Retain graph store outcomes
        if: always() && matrix.suite == 'cli-store'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PARITY_ARTIFACT_PREFIX }}rust-graph-store-${{ runner.os }}
          path: |
            ${{ runner.temp }}/graph-store-live.json
            ${{ runner.temp }}/graph-store-golden.json
            ${{ runner.temp }}/graph-read-live.json
            ${{ runner.temp }}/graph-read-golden.json
          if-no-files-found: error
      # The original two parts keep their selectors and separate receipts.
      # The shared-setup barrier keeps disk/lease/setup failures fatal before
      # either part; explicit status permits comparison-failure continuation.
      - name: Daemon resident startup parity
        if: ${{ !cancelled() && matrix.suite == 'cli-startup' && steps.startup_setup.outcome == 'success' }}
        # Windows CI 2026-10-10: about 28s/cell x 25 cells plus clock/guard,
        # about 13 minutes in total; allow twice that validation duration.
        timeout-minutes: 26
        shell: pwsh
        run: |
          python -m pip install "onnx==1.22.0" "onnxruntime==1.27.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testName = if ($IsWindows) { 'pseudolife-daemon-storage-test.exe' } else { 'pseudolife-daemon-storage-test' }
          $candidate = (Resolve-Path (Join-Path 'rust/target/storage-test' $testName)).Path
          if (-not $IsWindows) { chmod +x $candidate }
          python rust/daemon/harness/startup_ci.py --no-build --rust-test-bin $candidate --part ${{ matrix.startup_part }} --out (Join-Path $env:RUNNER_TEMP 'daemon-startup-parity-part1.json')
          exit $LASTEXITCODE
      - name: Daemon resident startup parity part 2
        if: ${{ !cancelled() && matrix.suite == 'cli-startup' && steps.startup_setup.outcome == 'success' }}
        timeout-minutes: 26
        shell: pwsh
        run: |
          python -m pip install "onnx==1.22.0" "onnxruntime==1.27.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testName = if ($IsWindows) { 'pseudolife-daemon-storage-test.exe' } else { 'pseudolife-daemon-storage-test' }
          $candidate = (Resolve-Path (Join-Path 'rust/target/storage-test' $testName)).Path
          if (-not $IsWindows) { chmod +x $candidate }
          python rust/daemon/harness/startup_ci.py --no-build --rust-test-bin $candidate --part 2 --out (Join-Path $env:RUNNER_TEMP 'daemon-startup-parity-part2.json')
          exit $LASTEXITCODE
      - name: Retain daemon resident startup parity
        if: always() && matrix.suite == 'cli-startup'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PARITY_ARTIFACT_PREFIX }}daemon-startup-parity-${{ runner.os }}-${{ matrix.suite }}
          path: |
            ${{ runner.temp }}/daemon-startup-parity*.json
          if-no-files-found: error
      - name: Prepare disposable PostgreSQL for W1-C rows
        if: startsWith(matrix.suite, 'w1c-')
        # Master run 38076979343, 2026-10-10: Windows setup 12s.
        # Five-minute floor because this step is network-bound.
        timeout-minutes: 5
        shell: pwsh
        # pg0's initdb inherits the locale on Linux; template1 then retains
        # both the recorded graph-read ordering and the test login's vector.
        env:
          LANG: ${{ runner.os == 'Linux' && 'en_US.UTF-8' || '' }}
          LC_ALL: ${{ runner.os == 'Linux' && 'en_US.UTF-8' || '' }}
        run: |
          python rust/cli_harness/lease_ci.py
          exit $LASTEXITCODE
      # The W1-C native leaves: every row runs live (this checkout's Python
      # oracle beside the candidate, on disposable homes), then against its
      # goldens. transfer, invite and maintainer use the disposable
      # PostgreSQL and test login their shard provisioned; test_login
      # starts its own throwaway clusters from the pg0 bundle and,
      # on Linux, disposable containers of the image built below. Declared
      # exceptions (each in its row's .md):
      # - test_login's Linux golden is recorded on this lane: recording needs
      #   pg0's initdb and a Linux Docker engine, which the recording host's
      #   WSL lacks. While goldens/test_login.linux.json is absent, the golden
      #   pass leaves test_login out and the step after it records the golden
      #   as an artifact to commit; once it is committed, it replays like
      #   every other row. Hosted Windows' Docker runs Windows containers
      #   only, so its container cases skip there.
      # - Cases marked live-only (Case.golden False) are left out of goldens
      #   and run in the live pass: transfer keeps help, the no-database
      #   refusals and the float-tie cases (the whole row is 14 MB of bank
      #   dumps); invite leaves out the 31 cases that show principals its
      #   seed stamps with the wall clock and random codes, and one 2.6 MB
      #   report.
      - name: Build the test_login container image
        if: runner.os == 'Linux' && matrix.suite == 'w1c-connection'
        # Master run 38076979343, 2026-10-10: Linux image build 13s.
        # Five-minute floor because this step is network-bound.
        timeout-minutes: 5
        run: docker build -t pseudolife-pg:18 -f ops/Dockerfile.pg ops
      - name: CLI W1-C differential harness
        if: startsWith(matrix.suite, 'w1c-')
        # Twice the per-shard Windows row sums above (38076979343,
        # 2026-10-10). #718's old combined 110m budget used PRs #709/#710:
        # 55m26s/53m37s, after PR #712 exhausted the old 60m limit.
        timeout-minutes: ${{ matrix.w1c_timeout }}
        shell: pwsh
        run: |
          $binaryName = if ($IsWindows) { 'pseudolife-stdio.exe' } else { 'pseudolife-stdio' }
          $candidate = (Resolve-Path (Join-Path 'rust/target/release' $binaryName)).Path
          $rows = @(${{ matrix.w1c_rows }})
          if (($IsLinux -or $IsWindows) -and $rows -contains 'pair') {
            $env:R1_PAIR_CANDIDATE = $candidate
            python -m pytest -q rust/cli_harness/test_pair_terminal.py -ra --durations=30 --junitxml (Join-Path $env:RUNNER_TEMP 'junit/cli-pair-terminal.xml')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if ($rows -contains 'maintainer_setup') {
            $env:R1_PAIR_CANDIDATE = $candidate
            python -m pytest -q rust/cli_harness/test_maintainer_setup_terminal.py rust/cli_harness/test_operator_transport.py rust/cli_harness/test_audit_stats.py rust/cli_harness/test_maintainer_setup_native.py -ra --durations=30 --junitxml (Join-Path $env:RUNNER_TEMP 'junit/cli-setup-terminal.xml')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $live = $rows | ForEach-Object { '--row'; $_ }
          python rust/cli_harness @live --candidate $candidate -v --out (Join-Path $env:RUNNER_TEMP 'cli-harness-w1c.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $platform = if ($IsWindows) { 'windows' } else { 'linux' }
          $replayed = $rows | Where-Object { $_ -ne 'test_login' -or (Test-Path "rust/cli_harness/goldens/test_login.$platform.json") }
          $golden = $replayed | ForEach-Object { '--row'; $_ }
          python rust/cli_harness @golden --golden --candidate $candidate -v --out (Join-Path $env:RUNNER_TEMP 'cli-harness-w1c-golden.json')
          exit $LASTEXITCODE
      - name: Record the Linux test_login golden while it is absent
        id: test_login_linux_golden
        if: "!cancelled() && runner.os == 'Linux' && matrix.suite == 'w1c-connection' && hashFiles('rust/cli_harness/goldens/test_login.linux.json') == ''"
        timeout-minutes: 20
        shell: pwsh
        run: |
          $summary = Join-Path $env:RUNNER_TEMP 'test-login-linux-record.json'
          python rust/cli_harness --row test_login --record -v --out $summary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $row = (Get-Content -Raw $summary | ConvertFrom-Json).rows.test_login
          "test_login Linux golden recorded at oracle $($row.oracle_commit) ($($row.oracle_commit_source)): $($row.recorded) cases executed, $(@($row.skipped).Count) skipped ($(@($row.skipped) -join ', '))" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - name: Retain the recorded Linux test_login golden
        if: "!cancelled() && steps.test_login_linux_golden.outcome == 'success'"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PARITY_ARTIFACT_PREFIX }}test_login-linux-golden
          path: |
            rust/cli_harness/goldens/test_login.linux.json
            ${{ runner.temp }}/test-login-linux-record.json
          if-no-files-found: error
      - name: Retain CLI harness summaries
        if: always() && (startsWith(matrix.suite, 'cli') || startsWith(matrix.suite, 'w1c-'))
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PARITY_ARTIFACT_PREFIX }}cli-harness-${{ runner.os }}-${{ matrix.suite }}
          path: ${{ runner.temp }}/cli-harness*.json
          if-no-files-found: warn
      - name: Prepare disposable PostgreSQL for H5
        if: startsWith(matrix.suite, 'h5-')
        # Linux 2026-10-11: fixture setup under 5s; network-bound floor.
        timeout-minutes: 5
        shell: pwsh
        env:
          LANG: ${{ runner.os == 'Linux' && 'en_US.UTF-8' || '' }}
          LC_ALL: ${{ runner.os == 'Linux' && 'en_US.UTF-8' || '' }}
        run: |
          python rust/cli_harness/lease_ci.py
          exit $LASTEXITCODE
      - name: Install offline W1-A fixture dependencies
        if: matrix.suite == 'h5-w1a' || matrix.suite == 'h5-background' || matrix.suite == 'h5-daemon-mutants' || matrix.suite == 'h5-light'
        # Network-bound setup gets the five-minute floor.
        timeout-minutes: 5
        run: python -m pip install --no-compile "onnx==1.22.0" "onnxruntime==1.27.0" "optimum==2.1.0" "optimum-onnx==0.1.0"
      - name: Restore H5 fixture executable permissions
        if: runner.os == 'Linux' && startsWith(matrix.suite, 'h5-')
        shell: pwsh
        run: |
          chmod +x rust/target/release/graph-contract
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path 'rust/target/debug/pseudolife-daemon') {
            chmod +x rust/target/debug/pseudolife-daemon
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Ported rows and daemon controls
        if: startsWith(matrix.suite, 'h5-')
        # Budgets come from the hosted step timings named beside the matrix
        # entries (rust/ci/parity_scope.py): Linux five times the ubuntu
        # p99; Windows as that comment says.
        timeout-minutes: ${{ runner.os == 'Linux' && matrix.h5_timeout || matrix.h5_windows_timeout }}
        shell: pwsh
        run: |
          python rust/ci/run_coverage.py --suite ${{ matrix.suite }} --out-dir (Join-Path $env:RUNNER_TEMP 'h5') --keep-going
          exit $LASTEXITCODE
      - name: Retain H5 row and control outcomes
        if: always() && startsWith(matrix.suite, 'h5-')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PARITY_ARTIFACT_PREFIX }}h5-${{ runner.os }}-${{ matrix.suite }}
          # Static-path witnesses leave deliberate symlink loops in scratch.
          # Upload only receipts and oracle captures, without walking scratch.
          path: |
            ${{ runner.temp }}/h5/*.json
            ${{ runner.temp }}/h5/goldens/*.json
          if-no-files-found: error
      - name: Run unchanged candidates and differential judges
        if: matrix.suite == 'judges'
        # #1211 (2026-11-03): Windows took 554s/519s on passing runs,
        # but a slower runner exhausted 900s after the judges passed.
        timeout-minutes: ${{ runner.os == 'Windows' && 20 || 15 }}
        shell: pwsh
        run: |
          # Native comparison failures are recorded explicitly; setup and
          # resource checks below still stop before any dependent work.
          $PSNativeCommandUseErrorActionPreference = $false
          $phaseManifest = Join-Path $env:RUNNER_TEMP 'judge-phases.json'
          $phaseResults = [System.Collections.Generic.List[object]]::new()
          function Save-JudgePhases {
            @{ schema = 1; phases = @($phaseResults.ToArray()) } | ConvertTo-Json -Depth 6 |
              Set-Content -LiteralPath $phaseManifest -Encoding utf8
          }
          function Start-JudgePhase([string]$Name) {
            $phaseResults.Add(@{ name = $Name; exit_code = $null; seconds = $null })
            Save-JudgePhases
            $script:judgePhase = [Diagnostics.Stopwatch]::StartNew()
          }
          function Complete-JudgePhase([int]$ExitCode) {
            $current = $phaseResults[$phaseResults.Count - 1]
            $current.exit_code = $ExitCode
            $current.seconds = [math]::Round($judgePhase.Elapsed.TotalSeconds, 3)
            Save-JudgePhases
          }
          Save-JudgePhases
          $checkoutRoot = (Get-Location).Path
          $oracleRoot = Join-Path $env:RUNNER_TEMP 'phase1-oracle'
          Start-JudgePhase 'oracle-setup'
          python -m evals.rust_port.phase1_oracle --destination $oracleRoot
          Write-Host ("judges phase=oracle-setup elapsed_seconds={0:F3}" -f $judgePhase.Elapsed.TotalSeconds)
          Complete-JudgePhase $LASTEXITCODE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Start-JudgePhase 'lease-check'
          python -m pseudolife_memory.cli lease check full-suite
          Write-Host ("judges phase=lease-check elapsed_seconds={0:F3}" -f $judgePhase.Elapsed.TotalSeconds)
          Complete-JudgePhase $LASTEXITCODE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $resourceCheckedAt = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
          $binaryName = if ($IsWindows) { 'pseudolife-stdio.exe' } else { 'pseudolife-stdio' }
          $candidatePath = (Resolve-Path (Join-Path 'rust/target/release' $binaryName)).Path
          $candidateCommand = ConvertTo-Json -InputObject @($candidatePath) -Compress
          $privateReceipt = Join-Path $env:RUNNER_TEMP 'rust-parity.json'
          $publicReceipt = Join-Path $checkoutRoot "evals/results/rust-phase1-ci-$env:RUNNER_OS.json"
          $oraclePython = if ($IsWindows) {
            Join-Path $oracleRoot 'runtime/Scripts/python.exe'
          } else {
            Join-Path $oracleRoot 'runtime/bin/python'
          }
          $env:PSEUDOLIFE_MCP_PYTHON = $oraclePython
          $env:PATH = (Split-Path $oraclePython) + [IO.Path]::PathSeparator + $env:PATH
          $oracleSource = Join-Path $oracleRoot 'source'
          $env:PSEUDOLIFE_RUST_BINARY = $candidatePath
          $env:PSEUDOLIFE_WAIT_MAIL_ORACLE_ROOT = $oracleSource
          $env:PSEUDOLIFE_WAIT_MAIL_NATIVE_REQUIRED = '1'
          Start-JudgePhase 'wait-mail-tests'
          & $oraclePython -m pytest -q evals/rust_port/test_cli_wait_mail.py evals/rust_port/test_wait_mail_phase2d_native.py evals/rust_port/test_wait_mail_reduction_native.py evals/rust_port/test_wait_mail_producer_native.py evals/rust_port/test_wait_mail_candidate_contract.py evals/rust_port/test_wait_mail_measurement.py evals/rust_port/test_wait_mail_listener_events.py -ra --durations=30 --junitxml (Join-Path $env:RUNNER_TEMP 'junit/run-unchanged-candidates-and-differential-judges.xml')
          Write-Host ("judges phase=wait-mail-tests elapsed_seconds={0:F3}" -f $judgePhase.Elapsed.TotalSeconds)
          Complete-JudgePhase $LASTEXITCODE
          $leaseHeaderReceipt = Join-Path $env:RUNNER_TEMP 'lease-header-policy.json'
          Start-JudgePhase 'lease-headers'
          & $oraclePython -m evals.rust_port.lease_headers --root $checkoutRoot --candidate $candidatePath --out $leaseHeaderReceipt
          Write-Host ("judges phase=lease-headers elapsed_seconds={0:F3}" -f $judgePhase.Elapsed.TotalSeconds)
          Complete-JudgePhase $LASTEXITCODE
          $privateArgvReceipt = Join-Path $env:RUNNER_TEMP 'rust-cli-argv.json'
          $publicArgvReceipt = Join-Path $checkoutRoot "evals/results/rust-cli-argv-$env:RUNNER_OS.json"
          Start-JudgePhase 'cli-argv'
          & $oraclePython -m evals.rust_port.cli_argv --oracle-root $oracleSource --candidate-json $candidateCommand --out $privateArgvReceipt --public-out $publicArgvReceipt
          Write-Host ("judges phase=cli-argv elapsed_seconds={0:F3}" -f $judgePhase.Elapsed.TotalSeconds)
          Complete-JudgePhase $LASTEXITCODE
          $judgeBootstrap = @'
          import pathlib, subprocess, sys
          from evals.rust_port.provenance import module_command
          root = pathlib.Path(sys.argv[1]).resolve()
          command = module_command("evals.rust_port.phase1_ci", root, sys.argv[2:])
          raise SystemExit(subprocess.run(command, cwd=root).returncode)
          '@
          Start-JudgePhase 'phase1-judges'
          & $oraclePython -c $judgeBootstrap $oracleSource --oracle-root $oracleSource --candidate-json $candidateCommand --candidate-root $checkoutRoot --out $privateReceipt --public-out $publicReceipt --offline-resource-checked-at $resourceCheckedAt
          Write-Host ("judges phase=phase1-judges elapsed_seconds={0:F3}" -f $judgePhase.Elapsed.TotalSeconds)
          Complete-JudgePhase $LASTEXITCODE
          $phase2Bootstrap = @'
          import pathlib, subprocess, sys
          from evals.rust_port.provenance import module_command
          root = pathlib.Path(sys.argv[1]).resolve()
          command = module_command("evals.rust_port.cli_dispatch", root, sys.argv[2:])
          raise SystemExit(subprocess.run(command, cwd=root).returncode)
          '@
          $phase2Evidence = Join-Path $env:RUNNER_TEMP 'phase2-cli-tests'
          $phase2Receipt = Join-Path $checkoutRoot "evals/results/rust-phase2-ci-$env:RUNNER_OS.json"
          Start-JudgePhase 'phase2-dispatch'
          & $oraclePython -c $phase2Bootstrap $oracleSource --oracle-root $oracleSource --candidate-json $candidateCommand --candidate-root $checkoutRoot --evidence-directory $phase2Evidence --out $phase2Receipt --offline-resource-checked-at $resourceCheckedAt
          Write-Host ("judges phase=phase2-dispatch elapsed_seconds={0:F3}" -f $judgePhase.Elapsed.TotalSeconds)
          Complete-JudgePhase $LASTEXITCODE
          $processBootstrap = @'
          import os, pathlib, subprocess, sys, tempfile
          from psycopg.conninfo import conninfo_to_dict, make_conninfo
          from pseudolife_memory.storage.embedded_pg import attach_or_start
          from evals.rust_port.provenance import module_command
          root = pathlib.Path(sys.argv[1]).resolve()
          with tempfile.TemporaryDirectory(prefix="cli-corpus-postgres-") as directory:
              dsn, owned = attach_or_start(pathlib.Path(directory))
              if owned is None:
                  raise RuntimeError("fresh corpus PostgreSQL unexpectedly attached")
              try:
                  options = conninfo_to_dict(dsn)
                  options["dbname"] = "postgres"
                  env = dict(os.environ, PSEUDOLIFE_BENCH_ADMIN_URL=make_conninfo(**options))
                  command = module_command("evals.rust_port.cli_process", root, sys.argv[2:])
                  result = subprocess.run(command, cwd=root, env=env)
              finally:
                  owned.stop()
          raise SystemExit(result.returncode)
          '@
          $processReceipt = Join-Path $env:RUNNER_TEMP 'phase2b-cli-process.json'
          $processPublicReceipt = Join-Path $env:RUNNER_TEMP 'phase2b-cli-process-public.json'
          Start-JudgePhase 'cli-process'
          & $oraclePython -c $processBootstrap $oracleSource --oracle-root $oracleSource --candidate-json $candidateCommand --candidate-root $checkoutRoot --out $processReceipt --public-out $processPublicReceipt --modes help version lease --offline-resource-checked-at $resourceCheckedAt
          Write-Host ("judges phase=cli-process elapsed_seconds={0:F3}" -f $judgePhase.Elapsed.TotalSeconds)
          Complete-JudgePhase $LASTEXITCODE
          foreach ($phase in $phaseResults) {
            if ($phase.exit_code -ne 0) { exit $phase.exit_code }
          }
          exit 0
      - name: Summarize every judge phase
        if: always() && matrix.suite == 'judges'
        timeout-minutes: 5
        shell: pwsh
        run: |
          python rust/ci/judge_summary.py --manifest (Join-Path $env:RUNNER_TEMP 'judge-phases.json') --checkout . --temporary $env:RUNNER_TEMP --platform $env:RUNNER_OS --out-dir (Join-Path $env:RUNNER_TEMP 'judge-summary') --summary $env:GITHUB_STEP_SUMMARY
          exit $LASTEXITCODE
      - name: Retain parity pytest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PARITY_ARTIFACT_PREFIX }}parity-junit-${{ runner.os }}-${{ matrix.suite }}
          path: ${{ runner.temp }}/junit/*.xml
          # W1-C and H5 shards drive their harnesses without pytest.
          if-no-files-found: ignore
      - name: Retain comparison summary
        if: always() && matrix.suite == 'judges'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PARITY_ARTIFACT_PREFIX }}rust-parity-${{ runner.os }}
          path: |
            evals/results/rust-phase1-ci-*.json
            evals/results/rust-phase2-ci-*.json
            evals/results/rust-cli-argv-*.json
            ${{ runner.temp }}/phase2b-cli-process-public.json
            ${{ runner.temp }}/lease-header-policy.json
            ${{ runner.temp }}/judge-summary/*.json
            ${{ runner.temp }}/oracle-selection.json
          if-no-files-found: warn

  parity-live:
    # Hosted Windows' live comparisons (the cli-live suite), outside the
    # required gate: continue-on-error and no place in any job's needs keep
    # its result out of every required check, so it reports and never
    # gates. The nightly and manual CI run it; a pull request, a merge group
    # and, since 2026-10-24 (maintainer decision), a master push never do:
    # it held no check open but took a Windows runner for about 26 minutes
    # on every push (run 40052100399) under the account's 20-job cap. A
    # failure here is a Windows-only live divergence to triage against the
    # Linux cli-live shard, which stays required.
    if: ${{ !cancelled() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'ci')) && needs.candidate.result == 'success' && needs.candidate-harness.result == 'success' && needs.fixtures.result == 'success' }}
    name: Parity live (non-gating) / ${{ matrix.os }} / ${{ matrix.suite }}
    needs: [scope, candidate, candidate-harness, fixtures]
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        suite: [cli-live]
    runs-on: ${{ matrix.os }}
    # The cli-live budget in parity-checks' include list.
    timeout-minutes: 55
    env:
      PARITY_ARTIFACT_PREFIX: ''
    steps: *parity_steps

  parity-selfhosted:
    # A comparison lane, not a gate (docs/specs/2026-10-19-self-hosted-parity-lane.md):
    # the same matrix and steps as parity-checks, on the maintainer's dev
    # machines. continue-on-error and no place in the Parity gate's needs
    # keep its outcome out of every required check. It runs only on the
    # nightly and manual CI: on a pull request its pending jobs would hold
    # the PR's checks open, and it was kept off master pushes when a newer
    # push could cancel a run whose self-hosted jobs still queued (since
    # 2026-10-29 every master push has a concurrency group of its own; the
    # nightly still covers master). It stays off until the repository variable
    # PARITY_SELFHOSTED_RUNNERS lists the registered runners (JSON, such as
    # ["linux", "windows"]); a job for an unregistered label would queue for
    # a day.
    if: ${{ !cancelled() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'ci')) && (inputs.selfhosted_runners != '' || vars.PARITY_SELFHOSTED_RUNNERS != '') && needs.candidate.result == 'success' && needs.candidate-harness.result == 'success' && needs.fixtures.result == 'success' }}
    name: Parity self-hosted / ${{ matrix.runner }} / ${{ matrix.suite }}
    needs: [scope, candidate, candidate-harness, fixtures]
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.selfhosted_runners || vars.PARITY_SELFHOSTED_RUNNERS || '["off"]') }}
        # Every suite the nightly and manual CI select, less the hosted-only
        # composites (h5-light), whose parts each runner runs on its own:
        # rust/ci/parity_scope.py's selfhosted output.
        suite: ${{ fromJSON(needs.scope.outputs.parity_selfhosted).suite }}
        include: ${{ fromJSON(needs.scope.outputs.parity_selfhosted).include }}
    runs-on: [self-hosted, "pseudolife-parity-${{ matrix.runner }}"]
    # The slowest hosted shard budget (210m) plus the hour a shard may wait
    # for this machine's full suite before it yields.
    timeout-minutes: 270
    env:
      PARITY_ARTIFACT_PREFIX: self-hosted-
      PARITY_YIELD_MINUTES: '60'
      PARITY_MIN_FREE_GB: '8'
      # The judges' pinned process tests (evals/rust_port/phase1.py, 240 s
      # by default): the Windows workers took 129-149 s against hosted's
      # 95-114 s and once ran past 240 s on a shared host (2026-11-03). 480
      # is twice the old limit, about three times their slowest pass; empty
      # keeps the default.
      PARITY_PROCESS_TEST_TIMEOUT: ${{ matrix.runner == 'windows' && '480' || '' }}
    steps: *parity_steps

  body-evidence:
    # D6/D11: published bodies on master, separate from the required gates.
    # A branch dispatch proves this job without spending the hosted matrix.
    if: (github.event_name == 'schedule' && contains(vars.PARITY_SELFHOSTED_RUNNERS, '"linux"')) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'body-evidence')
    name: Rust daemon / nightly body evidence (non-gating)
    runs-on: [self-hosted, pseudolife-parity-linux]
    continue-on-error: true
    timeout-minutes: 360
    env:
      PARITY_YIELD_MINUTES: '60'
      PARITY_MIN_FREE_GB: '8'
      PSEUDOLIFE_DAEMON_ORT_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - *selfhosted_disk
      - *selfhosted_lease
      - name: Select body evidence directories
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/body-target" >> "$GITHUB_ENV"
          echo "HF_HOME=$RUNNER_TEMP/body-huggingface" >> "$GITHUB_ENV"
          echo "PSEUDOLIFE_DAEMON_MODELS_DIR=$RUNNER_TEMP/body-models" >> "$GITHUB_ENV"
          echo "PSEUDOLIFE_DAEMON_PDFIUM_DIR=$RUNNER_TEMP/body-pdfium" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Body evidence / plan
        run: python3 rust/ci/body_evidence.py plan --out "$RUNNER_TEMP/body-evidence"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - *selfhosted_venv
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      - *selfhosted_disk
      - name: Build the compared Rust daemon
        working-directory: rust
        run: |
          cargo build --locked --release --bin pseudolife-daemon -j 3
          cp "$CARGO_TARGET_DIR/release/pseudolife-daemon" "$RUNNER_TEMP/body-daemon"
          # This job owns the whole target; no persistent runner cache grows.
          cargo clean
      - name: Install the Python oracle and harness dependencies
        run: |
          python -m pip install --no-compile --index-url https://download.pytorch.org/whl/cpu 'torch==2.13.0'
          python -m pip install --no-compile -e '.[dev,lite,onnx]' 'sentence-transformers==5.3.0' 'transformers==4.57.6' 'onnxruntime==1.27.0' 'mcp==2.2.0' 'pydantic==2.14.0' 'pydantic-core==2.50.0'
          python -m pip uninstall -y beautifulsoup4
      - *selfhosted_disk
      - name: Provision the compared models and native libraries
        run: |
          "$RUNNER_TEMP/body-daemon" provision models
          "$RUNNER_TEMP/body-daemon" provision pdfium
          python rust/ci/body_oracle.py --github-env "$GITHUB_ENV"
      - name: Prepare disposable PostgreSQL for body differentials
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: python rust/cli_harness/lease_ci.py
      - *selfhosted_disk
      - *selfhosted_lease
      - name: Run every body differential
        run: python rust/ci/body_evidence.py run --rust-bin "$RUNNER_TEMP/body-daemon" --out "$RUNNER_TEMP/body-evidence"
      - name: Summarize body evidence
        if: always()
        run: python3 rust/ci/body_evidence.py summary --out "$RUNNER_TEMP/body-evidence"
      - name: Publish body evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-body-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/body-evidence/evidence.json
          if-no-files-found: error
          # The cutover checklist links these (D6/D11): keep each for the
          # repository's maximum artifact retention, 90 days (2026-11-07).
          retention-days: 90
      # RUNNER_TEMP is cleared between jobs. The runner's tracking cleanup
      # stops its PostgreSQL process; its next job hook removes only its own
      # pl-cli-lease-postgres-* directories (self-hosted parity conventions).

  source-mutants:
    # Run 38145459384: 92m23s versus the 70m28s baseline; 68 source jobs
    # queued behind the 20-job concurrency cap, with a largest matrix queue
    # of 24m25s, so they left PRs. Since 2026-10-17 they also leave master
    # pushes and run nightly and on manual CI. On master they were 72 of 104
    # jobs and about 550 of 920 runner-minutes (runs 38412458284,
    # 38775578227, 38794022446; Windows shard median 11 min, Linux 5), and
    # all 1,170 shard jobs in the 16 readable master/nightly runs from
    # 2026-10-12 to 2026-10-16 passed. 18 of the 27 push runs in that window
    # were cancelled by a newer push before finishing. A survivor now
    # surfaces at the next nightly (its own concurrency group, so pushes no
    # longer cancel it) instead of after the merge that caused it.
    if: ${{ !cancelled() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'ci')) && needs.candidate.result == 'success' }}
    name: Source mutants / ${{ matrix.os }} / ${{ matrix.shard }}
    # These shards compile their own source copies and consume no rust-job
    # artifact; the final Parity gate still requires both Rust jobs.
    needs: [scope, candidate]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [audit-0, audit-1, audit-2, backup-0, backup-1, backup-2, connect-0, connect-1, connect-2, coordination_recovery-0, doctor-0, doctor-1, doctor-2, doctor-3, doctor-4, episode-0, hook-0, hook-1, invite-0, lease-0, lease_operator-0, mail-0, mail-1, maintainer-0, maintainer-1, maintainer_setup-0, migrate_flat-0, move-0, move-1, pair-0, pair-1, test_login-0, test_login-1, test_login-2, transfer-0, transfer-1, transfer-2, tunnel-0, tunnel-1, tunnel-2, update-0]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      - name: Keep only the pinned Rust toolchain
        if: runner.environment != 'self-hosted'
        shell: pwsh
        run: |
          $toolchainFile = Join-Path $env:GITHUB_WORKSPACE 'rust/rust-toolchain.toml'
          $match = Select-String -LiteralPath $toolchainFile -Pattern '^channel = "([^"]+)"$' | Select-Object -First 1
          if (-not $match) { throw "rust/rust-toolchain.toml names no channel; nothing is known to keep" }
          $pinned = $match.Matches[0].Groups[1].Value
          foreach ($line in @(rustup toolchain list)) {
            $name = ($line -split '\s+')[0]
            if ($name -and -not $name.StartsWith("$pinned-")) {
              rustup toolchain uninstall $name
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          rustup toolchain list
          exit $LASTEXITCODE
      # One shard per OS saves the shared mutant target's dependencies; all
      # 37 restore it. Every shard saved under this one key until 2026-10-24,
      # so each nightly that changed it raced 37 uploads for one entry.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> ${{ runner.temp }}/source-mutants-target/mutant
          key: cli-source-mutants
          cache-on-failure: true
          save-if: ${{ matrix.shard == 'audit-0' }}
      - name: Install source harness dependencies
        # Network-bound setup keeps the existing ten-minute dependency floor.
        timeout-minutes: 10
        shell: pwsh
        run: |
          python -m pip install --no-compile --index-url https://download.pytorch.org/whl/cpu "torch==2.13.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-compile -e ".[dev,lite]" "mcp==2.2.0"
          exit $LASTEXITCODE
      - name: Prepare disposable PostgreSQL for source controls
        # Linux 2026-10-11: fixture setup under 5s; network-bound floor.
        timeout-minutes: 5
        shell: pwsh
        env:
          LANG: ${{ runner.os == 'Linux' && 'en_US.UTF-8' || '' }}
          LC_ALL: ${{ runner.os == 'Linux' && 'en_US.UTF-8' || '' }}
        run: |
          python rust/cli_harness/lease_ci.py
          exit $LASTEXITCODE
      - name: Install offline episode fixture dependencies
        if: startsWith(matrix.shard, 'episode-')
        timeout-minutes: 5
        run: python -m pip install "onnx==1.22.0" "onnxruntime==1.27.0" "optimum==2.1.0" "optimum-onnx==0.1.0"
      - name: Bind the source-control Python oracle
        shell: pwsh
        env:
          GITHUB_REF: ${{ github.ref }}
          PSEUDOLIFE_PORT_DISPATCH_BASE: ${{ needs.scope.outputs.oracle_base }}
        run: |
          python -m evals.rust_port.oracle_selection --out (Join-Path $env:RUNNER_TEMP 'h5-source-oracle.json') --github-env $env:GITHUB_ENV
          exit $LASTEXITCODE
      - name: Build the test_login source-control image
        if: runner.os == 'Linux' && startsWith(matrix.shard, 'test_login-')
        # Master 38076979343: Linux image build 13s; network-bound floor.
        timeout-minutes: 5
        run: docker build -t pseudolife-pg:18 -f ops/Dockerfile.pg ops
      - name: CLI source mutants
        # Linux 2026-10-11: slowest eight-control selection 81s plus
        # 65s cold compile; six minutes is about twice that cold bound.
        # Windows is provisional, with startup headroom inside 56m.
        timeout-minutes: ${{ runner.os == 'Linux' && 6 || 30 }}
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/source-mutants-target
        run: |
          python rust/ci/run_coverage.py --source-shard ${{ matrix.shard }} --out-dir (Join-Path $env:RUNNER_TEMP 'h5-source')
          exit $LASTEXITCODE
      - name: Retain source-control witnesses and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-mutants-${{ runner.os }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/h5-source/*.json
            ${{ runner.temp }}/h5-source-oracle.json
          if-no-files-found: error

  daemon-image:
    name: Rust daemon / disposable image
    needs: scope
    # A master push skips it when its merged batch passed it on the same
    # tree: the batch's base-to-head image inputs are the push's.
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.mode != 'ci' || needs.scope.result == 'success') && needs.scope.outputs.push_passed != 'true' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'ci') && needs.scope.outputs.rust != 'false' && !contains(fromJSON(needs.scope.outputs.batch_passed || '[]'), 'Rust daemon / disposable image') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Select changed image inputs
        id: image-inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: python rust/daemon/container_inputs.py --base "$BASE_SHA" --head "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Check the opt-in container contract
        run: python rust/daemon/test_container.py
      - name: Build the CPU image without publishing
        if: steps.image-inputs.outputs.needed == 'true'
        run: docker build --progress=plain -f ops/Dockerfile.daemon-rust -t w3j-daemon-rust:prep --build-arg GIT_SHA="$GITHUB_SHA" --build-arg GIT_DIRTY=false --build-arg BUILD_SOURCE=ci .
      - name: Check the installed native CLI without network access
        if: steps.image-inputs.outputs.needed == 'true'
        run: docker run --rm --network none w3j-daemon-rust:prep pseudolife-mcp version
      - name: Restore the pinned model cache
        if: steps.image-inputs.outputs.needed == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/daemon-models
          key: daemon-models-fp32-${{ runner.os }}-${{ hashFiles('rust/daemon/src/model_provision.rs') }}
      - name: Prove offline health and authenticated CPU query inference
        if: steps.image-inputs.outputs.needed == 'true'
        env:
          W3J_RUST_TOKEN: w3j-disposable-ci-token
          W3J_MODELS_CACHE: ${{ runner.temp }}/daemon-models
        run: |
          project="w3j-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$W3J_MODELS_CACHE"
          cat > "$RUNNER_TEMP/model-cache.yml" <<'YAML'
          volumes:
            models:
              driver: local
              driver_opts:
                type: none
                o: bind
                device: ${W3J_MODELS_CACHE}
          YAML
          compose() {
            docker compose -p "$project" -f ops/docker-compose.rust.yml -f "$RUNNER_TEMP/model-cache.yml" "$@"
          }
          cleanup() {
            result=$?
            if [ "$result" -ne 0 ]; then compose logs || true; fi
            compose down --volumes || result=1
            sudo chown -R "$(id -u):$(id -g)" "$W3J_MODELS_CACHE" || result=1
            exit "$result"
          }
          trap cleanup EXIT
          compose run --rm --no-deps rust-daemon pseudolife-daemon provision models
          compose up --no-build --wait --wait-timeout 180
          python rust/daemon/container_probe.py --timeout 180
          compose logs --no-color rust-daemon > "$RUNNER_TEMP/rust-daemon-startup.log"
          python rust/daemon/container_probe.py --startup-log "$RUNNER_TEMP/rust-daemon-startup.log"
      - name: Prove network-disabled model reads after a cold restart
        if: steps.image-inputs.outputs.needed == 'true'
        run: |
          python -m pip install --no-compile 'psycopg[binary]>=3.2.4'
          python rust/daemon/harness/image_model_proof.py --image w3j-daemon-rust:prep --postgres-image pgvector/pgvector:pg18 --models "$RUNNER_TEMP/daemon-models" --out "$RUNNER_TEMP/image-model-proof.json"
      - name: Retain network-disabled model proof
        if: always() && steps.image-inputs.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rust-image-model-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-model-proof.json
          if-no-files-found: error
          retention-days: 30
  parity:
    # Only a PR, a merge group or a master push may skip the CLI source
    # matrix, except a nightly reusing a successful push on the exact SHA.
    # Nightly-only source mutants still must pass. Manual CI requires success, never
    # a skip or failure. A PR or merge group that scope classified as
    # documentation-only skips the Rust, candidate and parity jobs, and a PR
    # scope marked not full (any branch but integrate/*) skips the candidate
    # and parity jobs; any other skip still fails.
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.mode == 'ci')
    name: Parity / ${{ matrix.os }}
    needs: [scope, rust, candidate, parity-checks, source-mutants]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      # A cancelled needed job fails this step and skips the verdict, the
      # same result the verdict gives it, so the failed step names the cause:
      # ops/integrate.py admits such a head as cancelled, not failing.
      - name: A needed job was cancelled
        if: ${{ contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: Require every Rust and parity job to pass
        if: ${{ !contains(needs.*.result, 'cancelled') }}
        shell: pwsh
        env:
          GATE_RESULTS: ${{ toJSON(needs) }}
          GATE_EVENT: ${{ github.event_name }}
        run: |
          $results = ConvertFrom-Json $env:GATE_RESULTS -AsHashtable
          $docsOnly = ($env:GATE_EVENT -ceq 'pull_request' -or $env:GATE_EVENT -ceq 'merge_group') -and $results['scope'].result -ceq 'success' -and $results['scope'].outputs.rust -ceq 'false'
          $fastPr = $env:GATE_EVENT -ceq 'pull_request' -and $results['scope'].result -ceq 'success' -and $results['scope'].outputs.full -ceq 'false'
          $pushPassed = $env:GATE_EVENT -ceq 'schedule' -and $results['scope'].result -ceq 'success' -and $results['scope'].outputs.push_passed -ceq 'true'
          foreach ($job in @('rust', 'candidate', 'parity-checks')) {
            $skipChosen = $docsOnly -or ($fastPr -and $job -cne 'rust') -or ($pushPassed -and $job -cne 'candidate')
            if ($results[$job].result -cne 'success' -and -not ($skipChosen -and $results[$job].result -ceq 'skipped')) {
              Write-Error "$job did not succeed"
              exit 1
            }
          }
          $sourceResult = $results['source-mutants'].result
          if ($sourceResult -cne 'success' -and -not (($env:GATE_EVENT -ceq 'pull_request' -or $env:GATE_EVENT -ceq 'merge_group' -or $env:GATE_EVENT -ceq 'push') -and $sourceResult -ceq 'skipped')) {
            Write-Error "source-mutants did not succeed outside the PR, merge-group and push skip exception"
            exit 1
          }

  # A stress loop (mode=stress): run one selection on N fresh hosted runners
  # and report every iteration (rust/ci/stress.py). It compares against this
  # checkout's Python on any branch; branch dispatches also bind an event oracle
  # from the merge base with master, frozen once by the plan for every iteration.
  # Inputs reach the scripts only through env,
  # never inlined into a script.
  stress-plan:
    name: Stress / plan
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'stress'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      iterations: ${{ steps.plan.outputs.iterations }}
      kind: ${{ steps.plan.outputs.kind }}
      # true for a cargo selection whose tests need a disposable PostgreSQL
      # (stress.py CARGO_DATABASE_PROFILES); the other kinds always get one.
      postgres: ${{ steps.plan.outputs.postgres }}
      oracle_base: ${{ steps.oracle.outputs.oracle_base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Freeze the branch-stress oracle base
        id: oracle
        # Actions string comparisons ignore case; Git branch refs do not.
        shell: python
        run: |
          import os
          import subprocess
          if os.environ["GITHUB_REF"] != "refs/heads/master":
              base = subprocess.check_output(
                  ["git", "rev-parse", "--verify", "refs/remotes/origin/master^{commit}"], text=True).strip()
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write(f"oracle_base={base}\n")
      - name: Check the selection and list the iterations
        id: plan
        env:
          STRESS_SELECTION: ${{ inputs.selection }}
          STRESS_ITERATIONS: ${{ inputs.iterations }}
        run: python3 rust/ci/stress.py plan --selection "$STRESS_SELECTION" --iterations "$STRESS_ITERATIONS" --github-output "$GITHUB_OUTPUT"

  # A cargo selection's test binaries, compiled once with the Rust job's
  # toolchain, lockfile, profile and default features, into a nextest
  # archive every iteration runs. It runs on the iterations' OS: a hosted
  # runner's checkout path is the same in every job, so the paths the tests
  # compile in with env!() hold; each iteration checks that before running.
  stress-build:
    name: Stress / build ${{ inputs.os }}
    needs: stress-plan
    if: ${{ !cancelled() && needs.stress-plan.result == 'success' && needs.stress-plan.outputs.kind == 'cargo' }}
    runs-on: ${{ inputs.os }}
    # The Rust job's budget; this builds a subset of what it builds.
    timeout-minutes: 45
    env:
      STRESS_SELECTION: ${{ inputs.selection }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      - name: Keep only the pinned Rust toolchain
        if: runner.environment != 'self-hosted'
        shell: pwsh
        run: |
          $toolchainFile = Join-Path $env:GITHUB_WORKSPACE 'rust/rust-toolchain.toml'
          $match = Select-String -LiteralPath $toolchainFile -Pattern '^channel = "([^"]+)"$' | Select-Object -First 1
          if (-not $match) { throw "rust/rust-toolchain.toml names no channel; nothing is known to keep" }
          $pinned = $match.Matches[0].Groups[1].Value
          foreach ($line in @(rustup toolchain list)) {
            $name = ($line -split '\s+')[0]
            if ($name -and -not $name.StartsWith("$pinned-")) {
              rustup toolchain uninstall $name
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          rustup toolchain list
          exit $LASTEXITCODE
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: stress-tests
          cache-on-failure: true
      - name: Install pinned nextest in the runner temporary directory
        shell: pwsh
        run: |
          $nextestRoot = Join-Path $env:RUNNER_TEMP 'nextest-0.9.146'
          New-Item -ItemType Directory -Force -Path $nextestRoot | Out-Null
          if ($IsWindows) {
            $nextestArchive = Join-Path $env:RUNNER_TEMP 'nextest.zip'
            Invoke-WebRequest 'https://get.nexte.st/0.9.146/windows' -OutFile $nextestArchive
            Expand-Archive -LiteralPath $nextestArchive -DestinationPath $nextestRoot
          } else {
            $nextestArchive = Join-Path $env:RUNNER_TEMP 'nextest.tar.gz'
            Invoke-WebRequest 'https://get.nexte.st/0.9.146/linux' -OutFile $nextestArchive
            tar -xzf $nextestArchive -C $nextestRoot
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $nextestRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build the selected test binaries into a nextest archive
        shell: pwsh
        run: |
          python rust/ci/stress.py archive --selection $env:STRESS_SELECTION --archive-file (Join-Path $env:RUNNER_TEMP 'stress-tests.tar.zst')
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: stress-tests-${{ runner.os }}
          path: |
            ${{ runner.temp }}/stress-tests.tar.zst
            ${{ runner.temp }}/stress-tests.tar.zst.workspace
          if-no-files-found: error

  stress:
    name: Stress / ${{ inputs.os }} / ${{ matrix.iteration }}
    needs: [stress-plan, candidate, candidate-harness, stress-build]
    if: ${{ !cancelled() && needs.stress-plan.result == 'success' && needs.candidate.result == 'success' && needs.candidate-harness.result == 'success' && (needs.stress-plan.outputs.kind != 'cargo' || needs.stress-build.result == 'success') }}
    strategy:
      fail-fast: false
      # Half the account's 20-job cap, so a loop never starves other runs.
      max-parallel: 10
      matrix:
        iteration: ${{ fromJSON(needs.stress-plan.outputs.iterations) }}
    runs-on: ${{ inputs.os }}
    # The slowest parity shard's budget; one iteration is one selection.
    timeout-minutes: 45
    env:
      STRESS_SELECTION: ${{ inputs.selection }}
      STRESS_KIND: ${{ needs.stress-plan.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record the runner image and CPU count
        shell: pwsh
        run: |
          $memory = [math]::Round([GC]::GetGCMemoryInfo().TotalAvailableMemoryBytes / 1GB, 1)
          $image = if ($env:ImageOS) { "$env:ImageOS $env:ImageVersion" } else { 'not a hosted image' }
          $facts = "Runner: $env:RUNNER_OS $env:RUNNER_ARCH ($env:RUNNER_ENVIRONMENT), image $image, $([Environment]::ProcessorCount) logical CPUs, $memory GB memory"
          Write-Output $facts
          if ($env:GITHUB_STEP_SUMMARY) { $facts | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      # A cargo iteration gets what the Rust job's Nextest step has: the
      # Python SDK fixture dependency, no checkout install, no PostgreSQL
      # and no event oracle. A cargo selection with a database profile also
      # gets the checkout install (lease_ci.py and pgdisposable import it;
      # it brings the embedding fixture's numpy, onnx and tokenizers and the
      # onnxruntime wheel whose library ORT_DYLIB_PATH names) and PostgreSQL.
      - name: Install the Python SDK fixture dependency
        if: env.STRESS_KIND == 'cargo'
        run: python -m pip install "mcp==2.2.0"
      - name: Install checkout and test dependencies
        if: env.STRESS_KIND != 'cargo' || needs.stress-plan.outputs.postgres == 'true'
        timeout-minutes: 15
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install "setuptools>=68" wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-compile --index-url https://download.pytorch.org/whl/cpu "torch==2.13.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-compile -e ".[dev,lite]" "mcp==2.2.0" "onnx==1.22.0" "onnxruntime==1.27.0" "optimum==2.1.0" "optimum-onnx==0.1.0" "pydantic==2.14.0" "pydantic-core==2.50.0"
          exit $LASTEXITCODE
      - uses: actions/download-artifact@v4
        with:
          name: rust-shim-${{ runner.os }}
          path: rust/target/release
      - name: Download harness candidate
        uses: actions/download-artifact@v4
        with:
          name: rust-shim-harness-${{ runner.os }}
          path: rust/target/release
      - name: Restore executable permission
        if: runner.os == 'Linux'
        run: chmod +x rust/target/release/*
      - name: Install pinned nextest in the runner temporary directory
        if: env.STRESS_KIND == 'cargo'
        shell: pwsh
        run: |
          $nextestRoot = Join-Path $env:RUNNER_TEMP 'nextest-0.9.146'
          New-Item -ItemType Directory -Force -Path $nextestRoot | Out-Null
          if ($IsWindows) {
            $nextestArchive = Join-Path $env:RUNNER_TEMP 'nextest.zip'
            Invoke-WebRequest 'https://get.nexte.st/0.9.146/windows' -OutFile $nextestArchive
            Expand-Archive -LiteralPath $nextestArchive -DestinationPath $nextestRoot
          } else {
            $nextestArchive = Join-Path $env:RUNNER_TEMP 'nextest.tar.gz'
            Invoke-WebRequest 'https://get.nexte.st/0.9.146/linux' -OutFile $nextestArchive
            tar -xzf $nextestArchive -C $nextestRoot
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $nextestRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/download-artifact@v4
        if: env.STRESS_KIND == 'cargo'
        with:
          name: stress-tests-${{ runner.os }}
          path: ${{ runner.temp }}/stress-tests
      # Best effort for selections that do not consume the event oracle.
      # Branch stress freezes the merge base with master; master captures
      # retain frozen_head. Oracle-dependent selections still fail if binding
      # fails, including an unaccepted production source pin.
      - name: Bind the event-selected Python oracle when the dispatch has one
        continue-on-error: true
        shell: pwsh
        env:
          GITHUB_REF: ${{ github.ref }}
          PSEUDOLIFE_PORT_DISPATCH_BASE: ${{ needs.stress-plan.outputs.oracle_base }}
        run: |
          python -m evals.rust_port.oracle_selection --out (Join-Path $env:RUNNER_TEMP 'oracle-selection.json') --github-env $env:GITHUB_ENV
          exit $LASTEXITCODE
      # The Rust job's Nextest step has the selected package metadata, which
      # cli_version_contract reads; it needs the oracle above, and fails
      # rather than passing if the selected metadata could not be prepared.
      - name: Prepare selected package metadata for the Rust identity contract
        if: env.STRESS_KIND == 'cargo'
        continue-on-error: true
        shell: pwsh
        working-directory: .
        run: |
          $oracleMetadata = Join-Path $env:RUNNER_TEMP 'phase1-oracle-metadata'
          python -m evals.rust_port.phase1_oracle --metadata-only --destination $oracleMetadata
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PSEUDOLIFE_PORT_ORACLE_ROOT=$oracleMetadata" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare disposable PostgreSQL
        if: env.STRESS_KIND != 'cargo' || needs.stress-plan.outputs.postgres == 'true'
        timeout-minutes: 10
        shell: pwsh
        env:
          LANG: ${{ runner.os == 'Linux' && 'en_US.UTF-8' || '' }}
          LC_ALL: ${{ runner.os == 'Linux' && 'en_US.UTF-8' || '' }}
        run: |
          python rust/cli_harness/lease_ci.py
          exit $LASTEXITCODE
      # test_login's container cases need the image the W1-C connection
      # shard builds; hosted Windows runs Windows containers only, so the row
      # skips those cases there.
      - name: Build the test_login container image
        if: runner.os == 'Linux' && contains(env.STRESS_SELECTION, 'test_login')
        # Master run 38076979343, 2026-10-10: Linux image build 13s.
        # Five-minute floor because this step is network-bound.
        timeout-minutes: 5
        run: docker build -t pseudolife-pg:18 -f ops/Dockerfile.pg ops
      - name: Run the selection once
        shell: pwsh
        run: |
          python rust/ci/stress.py run --selection $env:STRESS_SELECTION --iteration ${{ matrix.iteration }} --candidates rust/target/release --archive-file (Join-Path $env:RUNNER_TEMP 'stress-tests/stress-tests.tar.zst') --out (Join-Path $env:RUNNER_TEMP 'stress/stress-row-${{ matrix.iteration }}.json')
          exit $LASTEXITCODE
      - name: Retain this iteration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-row-${{ matrix.iteration }}
          path: ${{ runner.temp }}/stress/
          if-no-files-found: warn

  stress-report:
    name: Stress report
    needs: [stress-plan, stress]
    if: ${{ always() && needs.stress-plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        # A loop where no iteration ran uploads nothing; the report then
        # names every iteration "no result".
        continue-on-error: true
        with:
          pattern: stress-row-*
          path: stress-rows
          # Select the whole workflow run through REST, so rows retained
          # from earlier attempts accompany the one replacement row.
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          repository: ${{ github.repository }}
      - name: Read every stress job attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 rust/ci/stress_history.py --out stress-job-history.json
      - name: Join the iterations
        env:
          STRESS_SELECTION: ${{ inputs.selection }}
          STRESS_ITERATIONS: ${{ inputs.iterations }}
          STRESS_OS: ${{ inputs.os }}
        run: python3 rust/ci/stress.py report --selection "$STRESS_SELECTION" --iterations "$STRESS_ITERATIONS" --os "$STRESS_OS" --rows stress-rows --out stress-report.json --summary "$GITHUB_STEP_SUMMARY" --job-history stress-job-history.json
      - name: Retain the stress report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-report-${{ github.run_attempt }}
          path: stress-report.json
          if-no-files-found: warn

  capture-windows:
    name: Capture / Windows / wait-mail
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'wait-mail'
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CAPTURE_MODE: ${{ inputs.mode }}
      CAPTURE_CASE_LIST: ${{ inputs.case_list }}
      CAPTURE_FROZEN_HEAD: ${{ inputs.frozen_head }}
    steps:
      - name: Validate the dispatch selector
        shell: pwsh
        run: |
          if ($env:CAPTURE_MODE -cne 'wait-mail') { throw 'Unsupported mode' }
          if ($env:CAPTURE_FROZEN_HEAD -cnotmatch '^[0-9a-f]{40}$') { throw 'Full commit ID required' }
          if ($env:CAPTURE_FROZEN_HEAD -cne $env:GITHUB_SHA) { throw 'Dispatch ref and frozen head must match' }
          $allowed = @('wait-mail-long-ring-watermark', 'wait-mail-bad-ring-reason', 'wait-mail-unicode-delivery', 'wait-mail-positive-long-ring-watermark')
          $selected = $env:CAPTURE_CASE_LIST.Split(',')
          if ($selected.Count -lt 1 -or $selected.Count -gt 3 -or (@($selected | Select-Object -Unique).Count -ne $selected.Count)) { throw 'Invalid case list' }
          foreach ($caseId in $selected) { if ($allowed -cnotcontains $caseId) { throw 'Unsupported case' } }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      - name: Install checkout and test dependencies
        timeout-minutes: 10
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install "setuptools>=68" wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-compile --index-url https://download.pytorch.org/whl/cpu "torch==2.13.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-compile -e ".[dev,lite]" "mcp==2.2.0"
          exit $LASTEXITCODE
      - name: Bind the frozen-head Python oracle
        shell: pwsh
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          python -m evals.rust_port.oracle_selection --out (Join-Path $env:RUNNER_TEMP 'oracle-selection.json') --github-env $env:GITHUB_ENV
          exit $LASTEXITCODE
      - name: Prepare the selected oracle
        timeout-minutes: 10
        shell: pwsh
        run: |
          $oracleRoot = Join-Path $env:RUNNER_TEMP 'phase1-oracle'
          python -m evals.rust_port.phase1_oracle --destination $oracleRoot
          exit $LASTEXITCODE
      - name: Build and bind the candidate
        timeout-minutes: 20
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/hosted-windows-cargo
        run: |
          $receiptRoot = Join-Path $env:RUNNER_TEMP 'hosted-windows-capture'
          New-Item -ItemType Directory -Path $receiptRoot -ErrorAction Stop | Out-Null
          $beforeHead = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $beforeHead -cne $env:CAPTURE_FROZEN_HEAD) { throw 'Source head mismatch' }
          cargo build --manifest-path rust/Cargo.toml --locked --release --bin pseudolife-stdio -j 4 *> (Join-Path $receiptRoot 'build.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $candidate = Join-Path $env:CARGO_TARGET_DIR 'release/pseudolife-stdio.exe'
          $manifest = [ordered]@{
            head = $beforeHead
            oracleHead = (ConvertFrom-Json $env:PSEUDOLIFE_PORT_ORACLE_SELECTION).oracle_head
            tree = (git rev-parse 'HEAD^{tree}')
            sourceEntries = @(git ls-files -s)
            candidateSha256 = (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant()
            buildArgv = @('cargo','build','--manifest-path','rust/Cargo.toml','--locked','--release','--bin','pseudolife-stdio','-j','4')
            rustc = (rustc --version)
            cargo = (cargo --version)
            runnerOS = $env:RUNNER_OS
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $receiptRoot 'build-binding.json') -Encoding utf8
      - name: Capture the named disposable cases
        timeout-minutes: 5
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/hosted-windows-cargo
        run: |
          $checkoutRoot = (Get-Location).Path
          $oracleSource = Join-Path $env:RUNNER_TEMP 'phase1-oracle/source'
          $oraclePython = Join-Path $env:RUNNER_TEMP 'phase1-oracle/runtime/Scripts/python.exe'
          $candidate = Join-Path $env:CARGO_TARGET_DIR 'release/pseudolife-stdio.exe'
          $receiptRoot = Join-Path $env:RUNNER_TEMP 'hosted-windows-capture'
          $env:PATH = (Split-Path $oraclePython) + [IO.Path]::PathSeparator + $env:PATH
          $bootstrap = @'
          import pathlib, subprocess, sys
          from evals.rust_port.provenance import module_command
          root = pathlib.Path(sys.argv[1]).resolve()
          command = module_command("evals.rust_port.hosted_wait_mail_capture", root, sys.argv[2:])
          raise SystemExit(subprocess.run(command, cwd=root).returncode)
          '@
          & $oraclePython -c $bootstrap $oracleSource --mode $env:CAPTURE_MODE --case-list $env:CAPTURE_CASE_LIST --frozen-head $env:CAPTURE_FROZEN_HEAD --oracle-root $oracleSource --candidate-root $checkoutRoot --candidate $candidate --out (Join-Path $receiptRoot 'raw-receipt.json') *> (Join-Path $receiptRoot 'capture.log')
          exit $LASTEXITCODE
      - name: Retain raw capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-windows-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hosted-windows-capture/
            ${{ runner.temp }}/oracle-selection.json
          if-no-files-found: warn
          retention-days: 7
