          exit $LASTEXITCODE
      # Linux 2026-10-13: offline W2-D checks measured below one second;
      # one minute is the smallest whole-minute timeout above twice that.
      # 2026-10-27: the config knob golden check adds about 5 s on Windows
      # (it imports the service module), still far inside the minute.
      - name: Offline W2-D search harness regressions
        if: matrix.suite == 'eval'
        timeout-minutes: 1
        shell: pwsh
        run: |
          python -m pytest -q rust/daemon/harness/test_w2d_controls.py rust/daemon/harness/test_w2d_namespace.py rust/daemon/harness/test_w2d_recent.py rust/daemon/harness/test_config_knobs_golden.py -ra --durations=30 --junitxml (Join-Path $env:RUNNER_TEMP 'junit/offline-w2-d-search-harness-regressions.xml')
          exit $LASTEXITCODE
      # This fixture creates a small graph locally; no model is downloaded.
      - name: Offline embedding golden and mutant row
        if: matrix.suite == 'eval'
        timeout-minutes: 10
        shell: pwsh
        run: |
          python -m pip install "onnx==1.22.0" "onnxruntime==1.27.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binaryName = if ($IsWindows) { 'pseudolife-daemon.exe' } else { 'pseudolife-daemon' }
          python -m pytest -q rust/daemon/harness/test_embedding.py -ra --durations=30 --junitxml (Join-Path $env:RUNNER_TEMP 'junit/offline-embedding-golden-and-mutant-row.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/run.py embedding --fixture --golden rust/daemon/harness/goldens/embedding-fixture.json --rust-bin (Join-Path 'rust/target/release' $binaryName) --out (Join-Path $env:RUNNER_TEMP 'embedding-fixture.json')
          exit $LASTEXITCODE
      - name: CLI differential harness
        if: matrix.suite == 'cli'
        # Updater transaction/wrapper acceptance adds about five minutes on
        # the Windows dev VM; keep that allowance beyond the existing step.
        # 22 since #1367 (the G2 default rows), measured on windows-latest:
        # 12:37 without them (batch run 42378632131); with them the step hit
        # 15:00 in batch runs 42388348056 and 42400397903, and pytest alone
        # took 14:42 in dispatch run 42404612150 with only their native arm
        # on Windows. About 16.5 minutes with the rows, plus a third.
        timeout-minutes: 22
        shell: pwsh
        run: |
          $binaryName = if ($IsWindows) { 'pseudolife-stdio.exe' } else { 'pseudolife-stdio' }
          $candidate = (Resolve-Path (Join-Path 'rust/target/release' $binaryName)).Path
          $env:PSEUDOLIFE_RUST_BINARY = $candidate
          $env:PSEUDOLIFE_BACKUP_NATIVE_REQUIRED = '1'
          python -m pytest -q -p no:cacheprovider rust/cli_harness/test_cli_harness.py rust/cli_harness/test_lease.py rust/cli_harness/test_bank.py rust/cli_harness/test_backup.py rust/cli_harness/test_update_transactions.py rust/cli_harness/test_update_wrappers_native.py -ra --durations=30 --junitxml (Join-Path $env:RUNNER_TEMP 'junit/cli-differential-harness.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/cli_harness --row mail --row hook --row episode --row update --golden --candidate $candidate -v --out (Join-Path $env:RUNNER_TEMP 'cli-harness-golden.json')
          exit $LASTEXITCODE
      # The same rows against this checkout's Python live: the hook row's
      # 250 ms health probe is part of what is compared, so a cold Windows
      # runner's first TLS handshake can decide it (2026-10-16 root cause).
      - name: CLI differential harness live arms
        if: matrix.suite == 'cli-live'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $binaryName = if ($IsWindows) { 'pseudolife-stdio.exe' } else { 'pseudolife-stdio' }
          $candidate = (Resolve-Path (Join-Path 'rust/target/release' $binaryName)).Path
          python rust/cli_harness --row mail --row hook --row episode --row update --skip-bank --candidate $candidate -v --out (Join-Path $env:RUNNER_TEMP 'cli-harness.json')
          exit $LASTEXITCODE
