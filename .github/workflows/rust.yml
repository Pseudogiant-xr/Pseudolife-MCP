name: Rust shim

on:
  pull_request:
  # The merge queue (docs/specs/2026-10-19-merge-queue.md): a queued group runs
  # the same jobs, so the required Parity checks report under the same names.
  merge_group:
  push:
    branches: [master]
  # Nightly Monday to Saturday; on Sunday the same hour is the weekly run,
  # the nightly plus the CLI source mutants (source-mutants says why).
  schedule:
    - cron: '23 3 * * 1-6'
    - cron: '23 3 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Ordinary CI or a stress loop'
        type: choice
        options: [ci, stress]
        default: ci
        required: true
      # evals/rust_port/oracle_selection.py binds a master stress dispatch's
      # oracle to this commit (an oracle-dependent selection fails without it).
      frozen_head:
        description: 'Stress on master only: full reviewed commit ID, equal to the dispatched checkout head'
        type: string
        required: false
      # A machine's trial (docs/specs/2026-10-19-self-hosted-parity-lane.md):
      # its runner is online but the watcher keeps it out of the variable, so
      # nightlies never route to it until one dispatched run has passed there.
      selfhosted_runners:
        description: 'ci only: the self-hosted machines this run uses, as JSON such as ["windows"], instead of PARITY_SELFHOSTED_RUNNERS'
        type: string
        required: false
      # Stress (rust/ci/stress.py): before a new live parity row or a
      # timing-sensitive test joins a required lane, it must pass 20 clean
      # hosted windows-latest runs (CLAUDE.md). Each iteration is its own
      # job on a fresh runner, reusing this run's candidate build; a cargo
      # selection's test binaries are built once, by stress-build.
      selection:
        description: 'Stress only: row:<row>[/<case>], scenario:<run.py scenario>, cargo:<package>/[bin/]<test binary>[::<test>] (space-separated), or pytest node ids'
        type: string
        required: false
      iterations:
        description: 'Stress only: how many fresh runners run the selection (1-50)'
        type: number
        default: 20
        required: false
      os:
        description: 'Stress only: the hosted runner'
        type: choice
        options: [windows-latest, ubuntu-latest]
        default: windows-latest
        required: false

permissions:
  contents: read

# Only an ordinary pull request (any head branch but integrate/*) is ever
# cancelled: a newer push to it supersedes its older run, keyed by its
# refs/pull/N/merge ref. Every other run gets a group of its own (its run
# id), so nothing cancels it, running or pending: master pushes, the nightly,
# manual CI, stress loops, merge groups and integrate/*
# batch runs (maintainer, 2026-10-29: never cancel those). A shared group
# would not do, even without cancel-in-progress: a newer run in a group
# cancels a pending one. History: the nightly once shared master's group and
# cancelled the push run a merge relied on (push 38870639548 ended 2 s after
# nightly 38872655184 started, 2026-10-16). Two batches merged minutes
# apart now both run their master push in full. Actions' startsWith ignores
# case, so an Integrate/... branch is never cancelled although scope treats
# it as ordinary; that costs only an uncancelled fast-lane run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.head_ref != '' && !startsWith(github.head_ref, 'integrate/') && format('rust-pr-{0}', github.ref) || format('rust-{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4
  CUDA_VISIBLE_DEVICES: '-1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  scope:
    # Decides whether this run needs the Rust, candidate, parity and image
    # jobs. Only a pull request or merge group whose every changed file is
    # documentation skips them (a pull request's merge commit vs its base
    # parent; a merge group's master tip, fetched here, to its head): Markdown, llms.txt /
    # llms-full.txt, and non-script files under docs/ (CLAUDE.md "Docs-only
    # changes"), none of them under rust/, evals/, pseudolife_memory/,
    # plugin/, ops/, tests/ or .github/, except the port's plan pages that no
    # job reads or evidence file hashes (rust/CUTOVER.md, rust/DEV.md, rust/SEMANTICS-CHECKLIST.md;
    # parity_scope.RUST_PLAN_DOCS, whose test fails once code reads one). A
    # recount in CUTOVER.md on 2026-11-02 (#1108) otherwise ran the whole
    # Rust and parity matrix. An empty or unreadable diff runs
    # everything. A failed scope job runs the Rust and candidate jobs, but
    # the parity matrix comes from scope's parity output, so parity-checks
    # and the Parity gate then fail (closed) and the run needs a rerun. On
    # 2026-10-16 a CLAUDE.md-only PR
    # (#782) queued the whole ~33-job matrix behind the account's 20-job cap.
    # No hosted step here reads docs outside rust/, and the W2-D docs seed
    # runs locally, not in CI. The producer census does scan docs, so
    # ops/integrate.py build commits a regenerated rust/producer-census.json
    # to a batch that changes them; beside docs that file still counts as
    # docs-only, and the master push that merges the batch (which runs the
    # Rust job) checks its currency.
    #
    # Master pushes (2026-10-24): a batch merges with a merge commit whose
    # tree is its head's (ops/integrate.py merge refuses otherwise), so
    # batch_passed lists the jobs that PASSED on the merged batch pull
    # request's latest run of this workflow on that head
    # (ops/ci_batch_passed.py; any failed check or API error lists none).
    # A push then skips the image check and each parity pair (os, suite) on
    # that list, and runs everything else: the Rust job, the candidate,
    # harness candidate and fixtures builds (which also keep master's Rust
    # caches current for every pull request) and every pair the batch did
    # not pass. Since the Python freeze (14 November 2026) no pair compares
    # against a live Python oracle, so none is bound to its event.
    if: github.event_name != 'workflow_dispatch' || (inputs.mode == 'ci' || inputs.mode == 'stress')
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      full: ${{ steps.scope.outputs.full }}
      parity: ${{ steps.parity.outputs.parity }}
      parity_selfhosted: ${{ steps.parity.outputs.selfhosted }}
      batch_passed: ${{ steps.batch.outputs.passed }}
      push_passed: ${{ steps.push.outputs.passed }}
      parity_any: ${{ steps.parity.outputs.parity_any }}
      integrate: ${{ steps.trusted.outputs.integrate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # `full` (2026-10-21): a pull request from any branch but integrate/*
      # skips the candidate build and so the parity matrix; its full CI is
      # its integration batch's (docs/dev/merge-batches.md), and the Rust
      # job (format, clippy, builds, nextest) still runs. Since 2026-10-29
      # that holds whatever the diff changes (maintainer: only batches spend
      # the heavy lanes). A workflow or dependency edit used to run full on
      # its own head, but that run used the edited workflow too, so it never
      # stopped an edit from switching off its own check; the batch runs the
      # same edited workflow on a head containing it, and a batch is the only
      # way to master. On 2026-10-28 PRs editing rust.yml, ci.yml or a lock
      # file ran 43 jobs per push and held batch #1031 queued over an hour.
      # The diff (the merge commit against its first parent, the base tip,
      # so the PR's own net change, never what a forward merge brought in)
      # still decides `rust`. Every other event, a pull request whose head
      # ref Actions did not supply, and an empty or unreadable diff run
      # everything.
      # A successful push on this exact SHA already covered the ordinary
      # lanes. Keep nightly-only evidence and its build prerequisites.
      # Empty output or an API failure runs every lane as before.
      - name: Check whether this workflow passed on the same master push
        id: push
        if: github.event_name == 'schedule' && github.ref == 'refs/heads/master'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m ops.ci_push_passed --workflow .github/workflows/rust.yml --github-output "$GITHUB_OUTPUT"

      - name: Classify the change
        id: scope
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          $ordinary = $env:EVENT_NAME -ceq 'pull_request' -and $env:HEAD_REF -and -not $env:HEAD_REF.StartsWith('integrate/', [System.StringComparison]::Ordinal)
          $full = 'true'
          $docs = '^(rust/(CUTOVER|DEV|SEMANTICS-CHECKLIST)\.md|(?!(?i:rust|evals|pseudolife_memory|plugin|ops|tests|\.github)/)([^/"].*\.md|llms(-full)?\.txt|docs/.*(?<!\.(py|ps1|psm1|sh|bash|bat|cmd|js|mjs|cjs|ts|rs|toml|yml|yaml))))$'
          $rust = 'true'
          $base = $null
          if ($env:EVENT_NAME -ceq 'pull_request') {
            $base = 'HEAD^1'
          } elseif ($env:EVENT_NAME -ceq 'merge_group' -and $env:MERGE_GROUP_BASE_REF -ceq 'refs/heads/master') {
            # Master's current tip, not merge_group.base_sha: that may be the
            # queue entry ahead, which need not pass on its own, so every
            # unmerged entry must count. Anything else runs everything.
            git fetch --no-tags --depth=1 origin refs/heads/master
            if ($LASTEXITCODE -eq 0) { $base = 'FETCH_HEAD' }
          }
          if ($base) {
            $files = @(git diff --no-renames --name-only $base HEAD)
            if ($LASTEXITCODE -eq 0 -and $files.Count -gt 0) {
              $files | Write-Output
              # The producer census ops/integrate.py build regenerates for
              # changed docs keeps a docs-only diff docs-only; alone, it runs.
              $code = @($files | Where-Object { $_ -cnotmatch $docs -and $_ -cne 'rust/producer-census.json' })
              if ($code.Count -eq 0 -and @($files | Where-Object { $_ -cmatch $docs }).Count -gt 0) { $rust = 'false' }
              if ($ordinary) { $full = 'false' }
            }
          }
          Write-Output "full=$full"
          "full=$full" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "rust=$rust"
          "rust=$rust" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          exit 0
      # The parity matrix (rust/ci/parity_scope.py). The nightly, manual CI
      # and merge groups run every suite; a master push runs every suite less
      # the pairs its merged batch passed (see below). A pull request
      # that scope marks full (one from integrate/*; the others skip the
      # matrix, see `full` above)
      # runs the floor (eval, cli, cli-store, cli-startup) plus the
      # suites its diff reaches: a row, its golden or its command's shim code
      # reaches the shard that runs the row, the daemon crate its daemon
      # suites, and anything the module cannot place (this workflow, Cargo
      # files) every suite. A divergence in a suite a
      # pull request skipped surfaces on the master push that merges it.
      # Before this, each pull request push queued 24 parity jobs behind the
      # account's 20-job cap.
      # A master push leaves out the (os, suite) pairs its merged batch
      # passed on the same tree (the batch step); when that is every pair,
      # parity_any is false and parity-checks is skipped.
      - name: List the jobs the merged batch passed on this tree
        id: batch
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        # A crash leaves the output empty, which runs everything; failing
        # here would fail the parity matrix closed instead.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ops/ci_batch_passed.py --workflow .github/workflows/rust.yml --github-output "$GITHUB_OUTPUT"
      # `integrate` admits the Linux pool planner's token step and the
      # self-hosted label. Expression startsWith and == ignore case, so a
      # same-repository `Integrate/x` pull request would pass them; this
      # ordinal comparison does not. An empty output keeps hosted.
      - name: Mark an exact integration batch ref
        id: trusted
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          $integrate = $env:EVENT_NAME -ceq 'pull_request' -and [bool]$env:HEAD_REF -and $env:HEAD_REF.StartsWith('integrate/', [System.StringComparison]::Ordinal)
          $line = "integrate=$($integrate.ToString().ToLowerInvariant())"
          Write-Output $line
          $line | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Choose the parity suites
        id: parity
        env:
          EVENT_NAME: ${{ github.event_name }}
          BATCH_PASSED: ${{ steps.batch.outputs.passed }}
        run: python3 rust/ci/parity_scope.py --event "$EVENT_NAME" --batch-passed "$BATCH_PASSED" --github-output "$GITHUB_OUTPUT"

  rust:
    # Fail-safe: run unless scope affirmatively says skip. Ordinary CI only:
    # a wait-mail capture or a stress loop needs no Rust or parity job, and
    # a stress loop takes only scope and candidate.
    needs: scope
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.mode != 'ci' || needs.scope.result == 'success') && needs.scope.outputs.push_passed != 'true' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'ci') && needs.scope.outputs.rust != 'false' }}
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Hosted windows, cold rust-cache: 21.7-23.9 min on 2026-10-10/13. On
    # 2026-10-15 three cold runs were cancelled at 25 min (jobs 116301727515,
    # 116323387861, 116326383784), 20 min in before the override builds,
    # after the daemon's warm release compile went from about 1 to 2 min.
    # No cold run has finished since: an estimated 26-34 min. Warm runs
    # peak at 17.5 min. A cold run used to have to finish, or the cache was
    # never saved and every later run was cold too, and the cache key hashed
    # the runner image's own Rust, so each image rollout started cold
    # (windows-latest 1.98.1 -> 1.99.0, 2026-10-15). The cache now saves on
    # failure and hashes only the pinned toolchain (see its steps).
    # Warm hosted Windows on 2026-11-04: batch run 41691166042 finished with
    # Nextest 9.6, no-default 7.4 and override builds 11.9 min, while master
    # run 41699732205 at the same code took 11.8, 8.7 and 15.9 min and was
    # cancelled at the 45-minute limit inside the override builds.
    # Ordinary PRs may also replay touched goldens before batching; batches
    # keep their existing separate parity jobs.
    # 2026-11-14: the override step's limit went from 20 to 35 (see it),
    # so each job limit is where that step starts plus 35, plus a margin.
    # Hosted Windows reached it 34.5 min in on batch run 43418298157 (job
    # 131866393314): 60 -> 75. Ordinary PRs reached it 62.3 and 67.8 min
    # in (jobs 131684824680, 131776517042), less the 9.5 and 9.2 min of
    # frozen probes that left the job (and since the freeze, CI): 52.8 and
    # 58.6, so 90 -> 100.
    timeout-minutes: ${{ github.event_name == 'pull_request' && needs.scope.outputs.full == 'false' && 100 || 75 }}
    defaults:
      run:
        working-directory: rust
    steps:
      # Hosted Linux only: the default and --no-default-features builds and
      # their test binaries outgrew the runner's disk on 2026-11-03 (batch
      # 18, job 125843927347: "No space left on device" compiling the second
      # nextest pass). Remove preinstalled SDKs this job never uses.
      - name: Free the hosted Linux runner's disk
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        working-directory: .
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bind the selected Python interpreter for Rust fixtures
        shell: pwsh
        run: |
          $selectedPython = python -c 'import sys; print(sys.executable)'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PSEUDOLIFE_MCP_PYTHON=$selectedPython" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install the Python SDK fixture dependency
        run: python -m pip install "mcp==2.2.0"
      - name: Select ordinary PR parity prechecks
        id: precheck
        if: github.event_name == 'pull_request' && needs.scope.outputs.full == 'false'
        working-directory: .
        shell: pwsh
        run: |
          python rust/ci/pr_precheck.py --github-output $env:GITHUB_OUTPUT
          exit $LASTEXITCODE
      - name: Check generated daemon schema
        working-directory: .
        shell: pwsh
        run: |
          python rust/daemon/harness/gen_schema_sql.py --check
          exit $LASTEXITCODE
      # rust/cli_harness/test_cli_harness.py is the harness's offline
      # self-test (no CLI runs; its source-mutant anchor check reads files
      # only), run here so a pull request's own checks see it rather than
      # only the batch's cli shard: 182 passed in 25 s on a Windows desktop,
      # 0.5 min hosted (2026-11-14). Two of its mail-row cases import
      # pseudolife_memory.coordination_adapter, which needs httpx.
      - name: Check port inventories and producer census
        working-directory: .
        shell: pwsh
        run: |
          python -m pip install pytest pyyaml "psycopg[binary]" psutil httpx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q rust/test_contract_inventory.py rust/test_producer_census.py rust/cli_harness/test_cli_harness.py rust/daemon/harness/test_w2e_lifecycle.py rust/daemon/harness/test_w2e_own_decisions.py rust/daemon/harness/test_w2e_recall_llm.py rust/daemon/harness/test_real_bank_timer_env.py rust/cli_harness/test_native_runtime_contract.py rust/daemon/harness/test_json_fidelity.py rust/daemon/harness/test_schema_clocks.py rust/daemon/harness/test_schema_generation.py rust/daemon/harness/test_schema_guards.py rust/daemon/harness/test_shadow_compare.py rust/daemon/harness/test_startup_ci.py rust/daemon/harness/test_startup_parts.py rust/daemon/harness/test_w2d_rerank_check.py rust/daemon/harness/test_w2d_trace_compare.py rust/cli_harness/test_update_row.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/producer_census.py --ci-check
          exit $LASTEXITCODE
      - name: ported-row-and-mutant-ci-inventory
        working-directory: .
        run: python rust/ci/inventory.py
      - name: Board harness lifecycle and normalization
        working-directory: .
        # Linux 2026-10-13: 21 tests in 0.21s. Allow a three-minute cold
        # Windows startup/import floor pending its first hosted measurement.
        # The slice-isolation probe imports every slice-binding harness in
        # subprocesses: 50 tests in 1.45s on a Windows desktop, 2026-10-29.
        # The mirror seed's database cases start a throwaway PostgreSQL on a
        # Linux engine and skip elsewhere. The real-base route cases need the
        # disposable-bank login (and torch for the search case) and skip
        # without them: 8 cases in 13s with both, Windows desktop, 2026-11-10.
        timeout-minutes: 3
        run: python -m pytest -q rust/daemon/harness/board/test_norm.py rust/daemon/harness/board/test_run.py rust/daemon/harness/board/test_lease_recovery.py rust/daemon/harness/board/test_maintainer_rollback.py rust/daemon/harness/board/test_base_delta.py rust/daemon/harness/test_pgdisposable_slices.py rust/daemon/harness/test_w2e_judge_settle.py rust/daemon/harness/test_w2e_real_bank_expects.py rust/daemon/harness/test_dbstate_real_bank.py rust/daemon/harness/mirror/test_seed.py rust/daemon/harness/mirror/test_forced.py rust/daemon/harness/mirror/test_base_delta.py rust/daemon/harness/mirror/test_seed_keys.py rust/daemon/harness/mirror/test_real_base_routes.py
      # cli_version_contract.rs checks the crate version against the
      # pyproject.toml under PSEUDOLIFE_PORT_ORACLE_ROOT. Since the Python
      # freeze no oracle is selected or exported: the checkout's own
      # pyproject.toml is the one a release cut moves with the crates.
      - name: Point the Rust identity contract at the checkout's package metadata
        shell: pwsh
        working-directory: .
        run: |
          "PSEUDOLIFE_PORT_ORACLE_ROOT=$env:GITHUB_WORKSPACE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      # rust-cache hashes every installed toolchain (`rustup toolchain list`)
      # into its key, so each rollout of the runner image's own stable Rust
      # started every cache cold (windows-latest 1.98.1 -> 1.99.0,
      # 2026-10-15). With only the pin left, the key changes when the pin or
      # Cargo.lock does. add-rust-environment-hash-key: false would drop the
      # Cargo.lock hash too, and a key that never changes is never saved
      # again (rust-cache skips the save on an exact hit). Hosted only: a
      # self-hosted runner's toolchains belong to its owner.
      - name: Keep only the pinned Rust toolchain
        if: runner.environment != 'self-hosted'
        shell: pwsh
        run: |
          $toolchainFile = Join-Path $env:GITHUB_WORKSPACE 'rust/rust-toolchain.toml'
          $match = Select-String -LiteralPath $toolchainFile -Pattern '^channel = "([^"]+)"$' | Select-Object -First 1
          if (-not $match) { throw "rust/rust-toolchain.toml names no channel; nothing is known to keep" }
          $pinned = $match.Matches[0].Groups[1].Value
          foreach ($line in @(rustup toolchain list)) {
            $name = ($line -split '\s+')[0]
            if ($name -and -not $name.StartsWith("$pinned-")) {
              rustup toolchain uninstall $name
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          rustup toolchain list
          exit $LASTEXITCODE
      # The Rust caches' key starts with this UTC ISO week (the Rust job's
      # rust-cache step says why), so its entries are never a week old.
      - name: Name this week's Rust cache
        id: cache_week
        shell: pwsh
        run: |
          $now = [DateTime]::UtcNow
          $week = '{0}-W{1:D2}' -f [System.Globalization.ISOWeek]::GetYear($now), [System.Globalization.ISOWeek]::GetWeekOfYear($now)
          "week=$week" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Rust cache week: $week"
      # A weekly key (2026-11-14, issue #1520): an exact hit never saves
      # again, so master's entry stayed as saved on 2026-11-03 while master
      # hit it for ten days; a pull request whose Cargo.lock or member
      # Cargo.toml differs restores such an entry as a partial match, and
      # rust-cache then deletes every target file older than a week
      # (restore.ts, cleanTargetDir(target, [], true)), so on 2026-11-13
      # those runs rebuilt everything (257 crates in the release override
      # build). The ISO week in the prefix makes each week's first run per
      # key cold and saves a fresh entry; every other run that week restores
      # files under a week old. Every rust-cache step here uses the prefix,
      # so shared keys still meet.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-${{ steps.cache_week.outputs.week }}
          workspaces: rust
          # A cold run whose later steps fail still saves what it compiled,
          # so the next run is not cold too. Three cold runs were cancelled
          # by their timeout on 2026-10-15; whether rust-cache's save also
          # runs after a timeout cancellation is not yet observed here.
          cache-on-failure: true
      - name: Install pinned nextest in the runner temporary directory
        shell: pwsh
        run: |
          $nextestRoot = Join-Path $env:RUNNER_TEMP 'nextest-0.9.146'
          New-Item -ItemType Directory -Force -Path $nextestRoot | Out-Null
          if ($IsWindows) {
            $nextestArchive = Join-Path $env:RUNNER_TEMP 'nextest.zip'
            Invoke-WebRequest 'https://get.nexte.st/0.9.146/windows' -OutFile $nextestArchive
            Expand-Archive -LiteralPath $nextestArchive -DestinationPath $nextestRoot
          } else {
            $nextestArchive = Join-Path $env:RUNNER_TEMP 'nextest.tar.gz'
            Invoke-WebRequest 'https://get.nexte.st/0.9.146/linux' -OutFile $nextestArchive
            tar -xzf $nextestArchive -C $nextestRoot
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $nextestRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check all targets
        run: cargo check --locked --all-targets -j 4
      - name: Clippy
        run: cargo clippy --locked --all-targets -j 4 -- -D warnings
      - name: Check write-path harness targets
        # 2026-10-13: cold Linux dev-profile check took 54 s; allow about 2x.
        timeout-minutes: 2
        run: cargo check --locked --all-targets -p pseudolife-daemon --features harness,mutants -j 4
      - name: Provision the pinned PDFium library for the PDF tests
        # The PDF text tests require it and fail without it: one
        # pin-checked download (about 4 MB) through the daemon's own
        # provisioner, into a root every later step sees. The dev binary
        # it builds is the one Nextest builds anyway. No --bin: this is the
        # command the PDF tests' hint gives, so it checks that it runs.
        shell: pwsh
        timeout-minutes: 10
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'pdfium'
          "PSEUDOLIFE_DAEMON_PDFIUM_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:PSEUDOLIFE_DAEMON_PDFIUM_DIR = $root
          cargo run --locked -p pseudolife-daemon -j 4 -- provision pdfium
          exit $LASTEXITCODE
      - name: Reuse the parity Python wheel cache for selected PR prechecks
        if: steps.precheck.outputs.enabled == 'true'
        continue-on-error: ${{ steps.precheck.outputs.golden != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the selected PR precheck dependencies
        id: precheck_runtime
        if: steps.precheck.outputs.enabled == 'true'
        continue-on-error: ${{ steps.precheck.outputs.golden != 'true' }}
        working-directory: .
        shell: pwsh
        env:
          PRECHECK_FULL_RUNTIME: ${{ steps.precheck.outputs.full_runtime }}
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'pr-precheck-runtime'
          python -m venv --system-site-packages $runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $runtime $(if ($IsWindows) { 'Scripts/python.exe' } else { 'bin/python' })
          & $python -m pip install --no-compile "setuptools>=68" wheel httpx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:PRECHECK_FULL_RUNTIME -ceq 'true') {
            # Database-backed rows use the existing parity seeders and their dependencies.
            & $python -m pip install --no-compile --index-url https://download.pytorch.org/whl/cpu "torch==2.13.0"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $python -m pip install --no-compile -e ".[dev,lite]" "mcp==2.2.0"
          } else {
            & $python -m pip install --no-deps --no-compile -e .
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "python=$python" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Build the selected PR precheck candidate
        id: precheck_candidate
        if: steps.precheck.outputs.enabled == 'true'
        continue-on-error: ${{ steps.precheck.outputs.golden != 'true' }}
        run: cargo build --locked -p pseudolife-stdio -j 4
      - name: Build the selected Linux test_login fixture image
        if: runner.os == 'Linux' && steps.precheck.outputs.test_login == 'true'
        working-directory: .
        timeout-minutes: 5
        run: docker build -t pseudolife-pg:18 -f ops/Dockerfile.pg ops
      - name: Replay touched PR goldens
        if: steps.precheck.outputs.golden == 'true'
        working-directory: .
        timeout-minutes: 35
        shell: pwsh
        env:
          PRECHECK_PLAN: ${{ steps.precheck.outputs.precheck }}
          PRECHECK_PYTHON: ${{ steps.precheck_runtime.outputs.python }}
        run: |
          if ($IsLinux) {
            $env:LANG = 'en_US.UTF-8'
            $env:LC_ALL = 'en_US.UTF-8'
          }
          $binary = if ($IsWindows) { 'pseudolife-stdio.exe' } else { 'pseudolife-stdio' }
          & $env:PRECHECK_PYTHON rust/ci/pr_precheck_run.py --only goldens --plan-json $env:PRECHECK_PLAN --candidate (Join-Path 'rust/target/debug' $binary) --private (Join-Path $env:RUNNER_TEMP 'pr-precheck-goldens-private') --public (Join-Path $env:RUNNER_TEMP 'pr-precheck-public/goldens')
          exit $LASTEXITCODE
      - name: Summarize PR golden replay
        if: always() && steps.precheck.outputs.enabled == 'true'
        continue-on-error: ${{ steps.precheck.outputs.golden != 'true' }}
        working-directory: .
        shell: pwsh
        env:
          PRECHECK_PLAN: ${{ steps.precheck.outputs.precheck }}
        run: |
          python rust/ci/pr_precheck_run.py --publish --only goldens --plan-json $env:PRECHECK_PLAN --public (Join-Path $env:RUNNER_TEMP 'pr-precheck-public') --job-summary $env:GITHUB_STEP_SUMMARY
          exit $LASTEXITCODE
      - name: Retain ordinary PR parity precheck case IDs
        if: always() && steps.precheck.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pr-parity-precheck-${{ runner.os }}
          path: ${{ runner.temp }}/pr-precheck-public/**/*.json
          if-no-files-found: warn
      - name: Nextest
        run: cargo nextest run --locked --all-targets -j 4
      # The Codex setup planning comparison with the frozen Python
      # (shim/tests/setup_codex_parity.py) left with the Python freeze; the
      # bearer, token-file and authority rules it covered are asserted by
      # shim/tests/setup_codex.rs, which Nextest runs.
      - name: Check all targets without default features
        run: cargo check --locked --all-targets --no-default-features -j 4
      - name: Clippy without default features
        run: cargo clippy --locked --all-targets --no-default-features -j 4 -- -D warnings
      - name: Nextest without default features
        run: cargo nextest run --locked --all-targets --no-default-features -j 4

      - name: Daemon override build configurations
        working-directory: ${{ github.workspace }}
        # Hosted windows: about 7 min cold on 2026-10-10/13 (release build
        # 5-6 min), 3.2 min warm since 2026-10-14. The cold release build
        # was still running 6m20s in when job 116323387861 was cancelled.
        # 2026-11-13, hosted Windows, 20 was no longer enough: run
        # 43392760359 job 131776517042 took 2m47s for the debug test and
        # 17m10s for the release test on a cold cache, then timed out as
        # the mutants dev build started; run 43418298157 job 131866393314
        # was still compiling the release test at 20 min; run 43364043883
        # job 131684824680 timed out in the mutants dev build. Even a
        # full cache hit (master run 43389967460 job 131853299319) took
        # 2m20s, 9m38s and 1m11s (13.2 min): the release build compiles
        # the daemon itself from scratch. Cold, about 21 min: 35 leaves a
        # margin and the job limits above make room for it.
        timeout-minutes: 35
        shell: pwsh
        run: |
          # Each build's output is printed only once it finishes; these lines
          # show which one was running if the step times out.
          $env:PSEUDOLIFE_DAEMON_TEST_LOOPBACK_BIND = '1'
          $daemonDefaultLog = Join-Path $env:RUNNER_TEMP 'daemon-default-override.log'
          Write-Host "$(Get-Date -Format o) debug override test: start"
          cargo +1.94.0 test --manifest-path rust/Cargo.toml --locked -p pseudolife-daemon -j 3 mutants::tests::loopback_bind_override_is_absent_from_production_build -- --exact *> $daemonDefaultLog
          $result = $LASTEXITCODE
          Get-Content $daemonDefaultLog
          if ($result -ne 0 -or -not (Select-String -LiteralPath $daemonDefaultLog -Pattern 'test result: ok\. 1 passed;')) { exit 1 }
          $daemonReleaseLog = Join-Path $env:RUNNER_TEMP 'daemon-release-override.log'
          Write-Host "$(Get-Date -Format o) release override test: start"
          cargo +1.94.0 test --manifest-path rust/Cargo.toml --locked --release --features mutants -p pseudolife-daemon -j 3 mutants::tests::loopback_bind_override_is_absent_from_production_build -- --exact *> $daemonReleaseLog
          $result = $LASTEXITCODE
          Remove-Item env:PSEUDOLIFE_DAEMON_TEST_LOOPBACK_BIND
          Get-Content $daemonReleaseLog
          if ($result -ne 0 -or -not (Select-String -LiteralPath $daemonReleaseLog -Pattern 'test result: ok\. 1 passed;')) { exit 1 }
          Write-Host "$(Get-Date -Format o) mutants dev build: start"
          cargo +1.94.0 build --manifest-path rust/Cargo.toml --locked -p pseudolife-daemon --features mutants -j 3
          exit $LASTEXITCODE

  fixtures:
    # The daemon storage test executable the cli-startup shard runs schema
    # and startup goldens on, built by schema_ci.py's own command beside the
    # candidate, so the parity matrix waits for the candidate and this job
    # only. It used to wait for the whole Rust job, which still gates
    # through the Parity gate: on batch run 40047950017 (2026-10-24) every
    # shard started at minute 18, when Rust / windows-latest finished,
    # though Candidate / windows-latest was done at minute 9. It also builds
    # the loopback bind fixture, the Rust job's override step's mutants dev
    # build and the only build carrying the debug-only loopback override,
    # which cli-store's kept live security checks bind on 0.0.0.0 with.
    needs: scope
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.mode != 'ci' || needs.scope.result == 'success') && (github.event_name != 'workflow_dispatch' || inputs.mode == 'ci') && needs.scope.outputs.rust != 'false' && needs.scope.outputs.full != 'false' }}
    name: Fixtures / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Warm, the two builds took 35 s and 78 s on hosted Windows (master run
    # 40052100399 and batch run 40047950017); a cold dev build of the
    # daemon's dependencies is a few minutes more.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      # The same toolchain set as the Rust job, so the cache key below is
      # the Rust job's own.
      - name: Keep only the pinned Rust toolchain
        if: runner.environment != 'self-hosted'
        shell: pwsh
        run: |
          $toolchainFile = Join-Path $env:GITHUB_WORKSPACE 'rust/rust-toolchain.toml'
          $match = Select-String -LiteralPath $toolchainFile -Pattern '^channel = "([^"]+)"$' | Select-Object -First 1
          if (-not $match) { throw "rust/rust-toolchain.toml names no channel; nothing is known to keep" }
          $pinned = $match.Matches[0].Groups[1].Value
          foreach ($line in @(rustup toolchain list)) {
            $name = ($line -split '\s+')[0]
            if ($name -and -not $name.StartsWith("$pinned-")) {
              rustup toolchain uninstall $name
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          rustup toolchain list
          exit $LASTEXITCODE
      # The Rust caches' key starts with this UTC ISO week (the Rust job's
      # rust-cache step says why), so its entries are never a week old.
      - name: Name this week's Rust cache
        id: cache_week
        shell: pwsh
        run: |
          $now = [DateTime]::UtcNow
          $week = '{0}-W{1:D2}' -f [System.Globalization.ISOWeek]::GetYear($now), [System.Globalization.ISOWeek]::GetWeekOfYear($now)
          "week=$week" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Rust cache week: $week"
      # Read-only reuse of the Rust job's cache, which already holds every
      # dev-profile dependency these builds compile: shared-key "rust" is
      # the key rust-cache derives for the job id rust (v0-rust-<week>-rust-
      # <os>-<arch>-<environment>-<lockfile>, src/config.ts), with the same
      # week prefix. Saving nothing keeps
      # the repository's cache, at its 10 GB limit on 2026-10-24, from
      # holding another copy; a miss only makes this job compile cold.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-${{ steps.cache_week.outputs.week }}
          workspaces: rust
          shared-key: rust
          save-if: false
      - name: Build the debug bind fixture
        working-directory: rust
        run: cargo +1.94.0 build --locked -p pseudolife-daemon --features mutants -j 4
      - name: Build the daemon storage test executable
        shell: pwsh
        run: |
          $handoff = Join-Path $env:RUNNER_TEMP 'daemon-storage-test-path.txt'
          python rust/daemon/harness/schema_ci.py --build-only --test-bin-out $handoff
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $name = if ($IsWindows) { 'pseudolife-daemon-storage-test.exe' } else { 'pseudolife-daemon-storage-test' }
          New-Item -ItemType Directory -Force -Path 'rust/target/storage-test' | Out-Null
          Copy-Item -LiteralPath (Get-Content -LiteralPath $handoff -Raw).Trim() -Destination (Join-Path 'rust/target/storage-test' $name)
      - name: Retain debug bind fixture
        uses: actions/upload-artifact@v4
        with:
          name: daemon-bind-fixture-${{ runner.os }}
          path: |
            rust/target/debug/pseudolife-daemon
            rust/target/debug/pseudolife-daemon.exe
          if-no-files-found: error
      - name: Retain daemon storage test executable
        uses: actions/upload-artifact@v4
        with:
          name: daemon-storage-test-${{ runner.os }}
          path: |
            rust/target/storage-test/pseudolife-daemon-storage-test
            rust/target/storage-test/pseudolife-daemon-storage-test.exe
          if-no-files-found: error

  candidate:
    needs: scope
    # The parity jobs need its release builds, so skipping it on an ordinary
    # pull request (scope's `full`) skips the parity matrix as well.
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.mode != 'ci' || needs.scope.result == 'success') && (github.event_name != 'workflow_dispatch' || (inputs.mode == 'ci' || inputs.mode == 'stress')) && needs.scope.outputs.rust != 'false' && needs.scope.outputs.full != 'false' }}
    name: Candidate / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      - name: Keep only the pinned Rust toolchain
        if: runner.environment != 'self-hosted'
        shell: pwsh
        run: |
          $toolchainFile = Join-Path $env:GITHUB_WORKSPACE 'rust/rust-toolchain.toml'
          $match = Select-String -LiteralPath $toolchainFile -Pattern '^channel = "([^"]+)"$' | Select-Object -First 1
          if (-not $match) { throw "rust/rust-toolchain.toml names no channel; nothing is known to keep" }
          $pinned = $match.Matches[0].Groups[1].Value
          foreach ($line in @(rustup toolchain list)) {
            $name = ($line -split '\s+')[0]
            if ($name -and -not $name.StartsWith("$pinned-")) {
              rustup toolchain uninstall $name
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          rustup toolchain list
          exit $LASTEXITCODE
      # The Rust caches' key starts with this UTC ISO week (the Rust job's
      # rust-cache step says why), so its entries are never a week old.
      - name: Name this week's Rust cache
        id: cache_week
        shell: pwsh
        run: |
          $now = [DateTime]::UtcNow
          $week = '{0}-W{1:D2}' -f [System.Globalization.ISOWeek]::GetYear($now), [System.Globalization.ISOWeek]::GetWeekOfYear($now)
          "week=$week" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Rust cache week: $week"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-${{ steps.cache_week.outputs.week }}
          workspaces: rust
          shared-key: shim-release
          cache-on-failure: true
      - name: Build candidate
        run: cargo build --locked --release --bin pseudolife-stdio --bin pseudolife-daemon -j 3
      - name: Retain default static candidate
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $daemonName = if ($IsWindows) { 'pseudolife-daemon.exe' } else { 'pseudolife-daemon' }
          $staticName = if ($IsWindows) { 'pseudolife-daemon-static.exe' } else { 'pseudolife-daemon-static' }
          Copy-Item -LiteralPath (Join-Path 'rust/target/release' $daemonName) -Destination (Join-Path 'rust/target/release' $staticName)
      # The default daemon ships as pseudolife-daemon-static; the artifact's
      # pseudolife-daemon is candidate-harness's mutants build, and both
      # artifacts download into one directory.
      - uses: actions/upload-artifact@v4
        with:
          name: rust-shim-${{ runner.os }}
          path: |
            rust/target/release/pseudolife-stdio
            rust/target/release/pseudolife-stdio.exe
            rust/target/release/pseudolife-daemon-static
            rust/target/release/pseudolife-daemon-static.exe
          if-no-files-found: error

  candidate-harness:
    # The candidate job's second build, run beside it: the daemon with its
    # mutant and harness features, and the graph and dream contract
    # binaries. In the candidate job it ran after the default build, 2.7 of
    # hosted Windows' 8.1 minutes (run 40058307040), so every parity shard
    # waited for both. Built alone, -p pseudolife-daemon resolves other
    # dependency features than the two-binary candidate build (serde,
    # serde_json, syn, chrono, indexmap, windows-sys), so it keeps a cache of
    # its own; the cli-daemon parity cache this workflow stopped using frees
    # about as much.
    needs: scope
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.mode != 'ci' || needs.scope.result == 'success') && (github.event_name != 'workflow_dispatch' || (inputs.mode == 'ci' || inputs.mode == 'stress')) && needs.scope.outputs.rust != 'false' && needs.scope.outputs.full != 'false' }}
    name: Candidate harness / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
