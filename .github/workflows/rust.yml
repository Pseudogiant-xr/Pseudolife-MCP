        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      - name: Keep only the pinned Rust toolchain
        if: runner.environment != 'self-hosted'
        shell: pwsh
        run: |
          $toolchainFile = Join-Path $env:GITHUB_WORKSPACE 'rust/rust-toolchain.toml'
          $match = Select-String -LiteralPath $toolchainFile -Pattern '^channel = "([^"]+)"$' | Select-Object -First 1
          if (-not $match) { throw "rust/rust-toolchain.toml names no channel; nothing is known to keep" }
          $pinned = $match.Matches[0].Groups[1].Value
          foreach ($line in @(rustup toolchain list)) {
            $name = ($line -split '\s+')[0]
            if ($name -and -not $name.StartsWith("$pinned-")) {
              rustup toolchain uninstall $name
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          rustup toolchain list
          exit $LASTEXITCODE
      # The Rust caches' key starts with this UTC ISO week (the Rust job's
      # rust-cache step says why), so its entries are never a week old.
      - name: Name this week's Rust cache
        id: cache_week
        shell: pwsh
        run: |
          $now = [DateTime]::UtcNow
          $week = '{0}-W{1:D2}' -f [System.Globalization.ISOWeek]::GetYear($now), [System.Globalization.ISOWeek]::GetWeekOfYear($now)
          "week=$week" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Rust cache week: $week"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-${{ steps.cache_week.outputs.week }}
          workspaces: rust
          shared-key: shim-harness
          cache-on-failure: true
      - name: Build embedding candidate
        run: cargo build --locked --release -p pseudolife-daemon --bins --features mutants,graph-harness,contract-harness,principal-harness -j 3
      - uses: actions/upload-artifact@v4
        with:
          name: rust-shim-harness-${{ runner.os }}
          path: |
            rust/target/release/pseudolife-daemon
            rust/target/release/pseudolife-daemon.exe
            rust/target/release/graph-contract
            rust/target/release/graph-contract.exe
            rust/target/release/dream-contract
            rust/target/release/dream-contract.exe
          if-no-files-found: error

  parity-pool:
    # Read availability after the artifact builds, so a queued early scope
    # job cannot spend an old heartbeat. A planner failure keeps hosted.
    name: Parity / Linux pool plan
    needs: [scope, candidate, candidate-harness, fixtures]
    if: ${{ !cancelled() && needs.candidate.result == 'success' && needs.candidate-harness.result == 'success' && needs.fixtures.result == 'success' && (github.repository == 'Pseudogiant-xr/Pseudolife-MCP' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.scope.outputs.integrate == 'true' && needs.scope.outputs.full == 'true'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      linux_pool: ${{ steps.pool.outputs.linux_pool }}
      # The Windows shards rust/ci/windows_pool.py found a free, startable
      # self-hosted worker for (JSON list; empty or unset keeps hosted).
      windows_suites: ${{ steps.pool.outputs.windows_suites }}
    steps:
      # The reader runs from reviewed code, never the batch merge ref: a
      # member's change to it (a fork-origin member's included) must not
      # read the token or print a self-hosted choice. The workflow file
      # itself still comes from the merge ref, so batch review covers it.
      # Before this script reaches master the base lacks it, the step fails
      # under continue-on-error, and the run keeps hosted.
      - uses: actions/checkout@v4
        id: checkout
        continue-on-error: true
        timeout-minutes: 1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Choose the Linux runner pool
        id: pool
        continue-on-error: true
        timeout-minutes: 2
        if: steps.checkout.outcome == 'success' && github.repository == 'Pseudogiant-xr/Pseudolife-MCP' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.scope.outputs.integrate == 'true' && needs.scope.outputs.full == 'true'))
        env:
          PARITY_VARS_READ_TOKEN: ${{ secrets.PARITY_VARS_READ_TOKEN }}
        run: python3 rust/ci/linux_pool.py --github-output "$GITHUB_OUTPUT"

  parity-checks:
    # Explicit: the implicit success() would also check scope. Scope is a
    # direct need for the matrix; if it failed, the matrix cannot expand, so
    # this job and the Parity gate fail rather than skip. The shards read
    # nothing from the Rust job (see fixtures), so they start beside it; the
    # Parity gate still needs it, and a Rust failure still fails the gate.
    if: ${{ !cancelled() && needs.scope.outputs.push_passed != 'true' && needs.scope.outputs.parity_any != 'false' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'ci') && needs.candidate.result == 'success' && needs.candidate-harness.result == 'success' && needs.fixtures.result == 'success' }}
    name: Parity checks / ${{ matrix.os }} / ${{ matrix.suite }}
    needs: [scope, candidate, candidate-harness, fixtures, parity-pool]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Every suite and its include values live in rust/ci/parity_scope.py,
        # which the scope job turns into this run's selection: all of them on
        # the nightly, manual CI and merge groups; on a master push all but
        # the pairs its merged batch passed on the same tree; on a pull
        # request the floor plus what its diff reaches. Only the selected
        # suites' include entries come back: an entry matching no
        # combination would add a job of its own. parity-selfhosted takes
        # the same matrix and reuses the steps below through the YAML
        # anchor.
        suite: ${{ fromJSON(needs.scope.outputs.parity).suite }}
        # parity_scope.STATIC_EXCLUDE (empty since the freeze) plus, on a
        # master push, the pairs its merged batch passed on the same tree.
        exclude: ${{ fromJSON(needs.scope.outputs.parity).exclude }}
        include: ${{ fromJSON(needs.scope.outputs.parity).include }}
    # Repeat event selection in case the planner returns an incorrect choice.
    # Workflow approval and repository write access remain the trust boundary.
    # The Windows branch repeats it too, and moves only the suites the planner
    # listed, of an allowlist of one: w1c-connection (rust/ci/windows_pool.py).
    runs-on: ${{ github.repository == 'Pseudogiant-xr/Pseudolife-MCP' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.scope.outputs.integrate == 'true' && needs.scope.outputs.full == 'true')) && matrix.os == 'ubuntu-latest' && matrix.suite == 'cli-startup' && needs.parity-pool.outputs.linux_pool == 'self-hosted' && fromJSON('["self-hosted","pseudolife-parity-linux"]') || github.repository == 'Pseudogiant-xr/Pseudolife-MCP' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.scope.outputs.integrate == 'true' && needs.scope.outputs.full == 'true')) && matrix.os == 'windows-latest' && matrix.suite == 'w1c-connection' && contains(fromJSON(needs.parity-pool.outputs.windows_suites || '[]'), matrix.suite) && fromJSON('["self-hosted","pseudolife-parity-windows"]') || matrix.os }}
    # Every cli and W1-C shard names its own budget beside its measurement
    # in the include list; eval keeps the 210-minute fallback.
    timeout-minutes: ${{ matrix.job_timeout || 210 }}
    env:
      # Artifact names must be unique within a run; parity-selfhosted sets
      # its own prefix so both lanes can upload the same outcomes.
      PARITY_ARTIFACT_PREFIX: ''
      PARITY_YIELD_MINUTES: '0'
      PARITY_MIN_FREE_GB: '8'
    steps: &parity_steps
      # Self-hosted only: CLAUDE.md "Disk space" keeps heavy work off a drive
      # with under 8 GB free. A step of its own, so a full disk is named as
      # one: every failure the 2026-10-27 nightly blamed on the yield step
      # was this check (6 GB free).
      - &selfhosted_disk
        name: Check the runner's free disk
        if: runner.environment == 'self-hosted'
        shell: pwsh
        run: |
          # 2026-11-06: all three Linux workers had 65.9 GiB free on the
          # work disk, but /tmp was an empty 4.9 GiB tmpfs. Use the job's
          # disk-backed directory, which the runner empties between jobs.
          if ($env:RUNNER_OS -eq 'Linux') {
            $temporary = Join-Path $env:RUNNER_TEMP 'parity-tmp'
            New-Item -ItemType Directory -Path $temporary -Force | Out-Null
            "TMPDIR=$temporary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          $freeGb = [math]::Floor([IO.DriveInfo]::new($env:GITHUB_WORKSPACE).AvailableFreeSpace / 1GB)
          $facts = "$freeGb GB free on the runner's work drive (floor $env:PARITY_MIN_FREE_GB GB)"
          Write-Output $facts
          if ($env:GITHUB_STEP_SUMMARY) { $facts | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append }
          if ($freeGb -lt [int]$env:PARITY_MIN_FREE_GB) {
            throw "Only $freeGb GB free on the runner's work drive, under the $env:PARITY_MIN_FREE_GB GB floor, so the shard did not run. The machine's cleanup log says what it freed (docs/specs/2026-10-19-self-hosted-parity-lane.md, `"Disk use`"); free space on that drive, then rerun."
          }
      # Self-hosted only (docs/specs/2026-10-19-self-hosted-parity-lane.md):
      # the runner's own configuration names this machine's full-suite lease
      # and lock directory; the tree never names a machine. Runs before
      # checkout so a yielding shard loads nothing.
      - &selfhosted_lease
        name: Yield to this machine's full suite
        if: runner.environment == 'self-hosted'
        shell: pwsh
        run: |
          $lease = $env:PSEUDOLIFE_PARITY_LEASE
          $lockDir = $env:PSEUDOLIFE_PARITY_LOCK_DIR
          if ($lease -cnotmatch '^full-suite@[A-Za-z0-9._-]{1,40}$' -or -not $lockDir) {
            throw "The runner's .env must set PSEUDOLIFE_PARITY_LEASE (full-suite@<machine>) and PSEUDOLIFE_PARITY_LOCK_DIR (the suite user's lock directory); see docs/specs/2026-10-19-self-hosted-parity-lane.md"
          }
          if (-not (Get-Command pseudolife-mcp -ErrorAction SilentlyContinue)) {
            throw 'pseudolife-mcp is not on the runner PATH; install it for the runner user with: uv tool install pseudolife-mcp'
          }
          # The lease check reads these two for this process only, never the shard's tests.
          $env:PSEUDOLIFE_SUITE_LEASE = $lease
          $env:PSEUDOLIFE_SUITE_LOCK_DIR = $lockDir
          $deadline = (Get-Date).AddMinutes([int]$env:PARITY_YIELD_MINUTES)
          while ($true) {
            $report = pseudolife-mcp lease check --json $lease
            $code = $LASTEXITCODE
            if ($code -ne 0 -and $code -ne 1) { throw "lease check $lease failed (exit $code); neither held nor free is known" }
            $state = ($report | Out-String | ConvertFrom-Json).local.state
            # A missing or unreadable lock file means the directory or its grant is wrong,
            # and every probe would read free.
            if ($null -eq $state) { throw "No readable full-suite lock file in PSEUDOLIFE_PARITY_LOCK_DIR (wrong directory, or the runner account lacks read access); the check cannot see this machine's suites" }
            if ($code -eq 0) { Write-Output "$lease is free; running the shard."; break }
            if ((Get-Date) -ge $deadline) {
              "Yielded: $lease stayed held for $env:PARITY_YIELD_MINUTES minutes, so this shard did not run." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
              throw "Yielded to the full suite holding $lease"
            }
            Write-Output "$lease is held by a full suite; checking again in 60 seconds."
            Start-Sleep -Seconds 60
          }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Hosted Windows' vCPU count and image version were never recorded,
      # so a slow or flaky shard could not be tied to its machine.
      - name: Record the runner image and CPU count
        shell: pwsh
        run: |
          $memory = [math]::Round([GC]::GetGCMemoryInfo().TotalAvailableMemoryBytes / 1GB, 1)
          $image = if ($env:ImageOS) { "$env:ImageOS $env:ImageVersion" } else { 'not a hosted image' }
          $facts = "Runner: $env:RUNNER_OS $env:RUNNER_ARCH ($env:RUNNER_ENVIRONMENT), image $image, $([Environment]::ProcessorCount) logical CPUs, $memory GB memory"
          Write-Output $facts
          if ($env:GITHUB_STEP_SUMMARY) { $facts | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # A self-hosted runner keeps its own pip cache; saving one to the
          # repository cache could evict the hosted Rust caches.
          cache: ${{ runner.environment != 'self-hosted' && 'pip' || '' }}
          cache-dependency-path: pyproject.toml
      # A persistent runner shares one tool-cache Python between jobs; a venv
      # in the job's temporary directory starts each shard as clean as hosted.
      - &selfhosted_venv
        name: Give the shard its own Python environment
        if: runner.environment == 'self-hosted'
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP 'parity-venv'
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = if ($IsWindows) { Join-Path $venv 'Scripts' } else { Join-Path $venv 'bin' }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "VIRTUAL_ENV=$venv" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      # Only these suites run cargo or rustc (which_comparison in eval, the
      # sent-YAML mutants in cli); the rest run the downloaded binaries.
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.suite == 'eval' || matrix.suite == 'cli'
        with:
          toolchain: 1.94.0
      - name: Keep only the pinned Rust toolchain
        if: runner.environment != 'self-hosted' && (matrix.suite == 'eval' || matrix.suite == 'cli')
        shell: pwsh
        run: |
          $toolchainFile = Join-Path $env:GITHUB_WORKSPACE 'rust/rust-toolchain.toml'
          $match = Select-String -LiteralPath $toolchainFile -Pattern '^channel = "([^"]+)"$' | Select-Object -First 1
          if (-not $match) { throw "rust/rust-toolchain.toml names no channel; nothing is known to keep" }
          $pinned = $match.Matches[0].Groups[1].Value
          foreach ($line in @(rustup toolchain list)) {
            $name = ($line -split '\s+')[0]
            if ($name -and -not $name.StartsWith("$pinned-")) {
              rustup toolchain uninstall $name
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          rustup toolchain list
          exit $LASTEXITCODE
      # The Rust caches' key starts with this UTC ISO week (the Rust job's
      # rust-cache step says why), so its entries are never a week old.
      - name: Name this week's Rust cache
        id: cache_week
        shell: pwsh
        run: |
          $now = [DateTime]::UtcNow
          $week = '{0}-W{1:D2}' -f [System.Globalization.ISOWeek]::GetYear($now), [System.Globalization.ISOWeek]::GetWeekOfYear($now)
          "week=$week" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Rust cache week: $week"
      # One key per suite. All suites shared one key: the first to save fixed
      # it, and on an exact hit no later suite's compile was ever saved.
      # Only the suites that compile cache (sent-YAML mutants in cli,
      # which_comparison in eval; cli-startup takes its storage
      # test binary from the fixtures job); the rest restored a 71 MB
      # registry they never read (master run 39236836263, 2026-10-19).
      - uses: Swatinem/rust-cache@v2
        if: matrix.suite == 'eval' || matrix.suite == 'cli'
        with:
          prefix-key: v0-rust-${{ steps.cache_week.outputs.week }}
          workspaces: rust
          key: ${{ matrix.suite }}
          cache-on-failure: true
          save-if: ${{ runner.environment != 'self-hosted' }}
      # --no-compile: the same packages, without byte-compiling every file
      # at install time (Python compiles what a shard imports, on first
      # import). Locally, torch installed in 11 s instead of 39 s
      # (2026-10-24); the step took 2.3 minutes per hosted Windows shard.
      - name: Install checkout and test dependencies
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-compile "setuptools>=68" wheel
          python -m pip install --no-compile --index-url https://download.pytorch.org/whl/cpu "torch==2.13.0"
          python -m pip install --no-compile -e ".[dev,lite]" "mcp==2.2.0"
      - uses: actions/download-artifact@v4
        with:
          name: rust-shim-${{ runner.os }}
          path: rust/target/release
      - name: Download harness candidate
        uses: actions/download-artifact@v4
        with:
          name: rust-shim-harness-${{ runner.os }}
          path: rust/target/release
      - name: Download debug bind fixture
        if: matrix.suite == 'cli-store'
        uses: actions/download-artifact@v4
        with:
          name: daemon-bind-fixture-${{ runner.os }}
          path: rust/target/debug
      - name: Download daemon storage test executable
        if: matrix.suite == 'cli-startup'
        uses: actions/download-artifact@v4
        with:
          name: daemon-storage-test-${{ runner.os }}
          path: rust/target/storage-test
      - name: Restore executable permission
        if: runner.os == 'Linux'
        run: chmod +x rust/target/release/pseudolife-stdio rust/target/release/pseudolife-daemon rust/target/release/pseudolife-daemon-static
      - name: Compare sent YAML startup with PyYAML
        if: matrix.suite == 'cli'
        shell: pwsh
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $env:PSEUDOLIFE_SENT_YAML_BIN = Join-Path (Get-Location) "rust/target/release/pseudolife-stdio$suffix"
          python -m pytest rust/daemon/harness/test_sent_yaml.py rust/daemon/harness/test_sent_yaml_mutants.py -q -ra --durations=30 --junitxml (Join-Path $env:RUNNER_TEMP 'junit/compare-sent-yaml-startup-with-pyyaml.xml')
          exit $LASTEXITCODE
      # Since the Python freeze (14 November 2026) no shard compares the
      # candidate against a live Python oracle: each replays committed
      # goldens (Rust regression snapshots now) and runs the harnesses' own
      # tests. The checkout's frozen package is still installed, because the
      # harnesses seed their banks and fixtures through its writers.
      - name: Check CI coverage contract
        if: matrix.suite == 'eval'
        run: python -m pytest -q rust/ci -ra --durations=30 --junitxml ${{ runner.temp }}/junit/check-ci-coverage-contract.xml
      # Linux 2026-10-13: offline W2-D checks measured below one second;
      # one minute is the smallest whole-minute timeout above twice that.
      # 2026-10-27: the config knob golden check adds about 5 s on Windows
      # (it imports the service module), still far inside the minute.
      - name: Offline W2-D search harness regressions
        if: matrix.suite == 'eval'
        timeout-minutes: 1
        shell: pwsh
        run: |
          python -m pytest -q rust/daemon/harness/test_w2d_controls.py rust/daemon/harness/test_w2d_namespace.py rust/daemon/harness/test_w2d_recent.py rust/daemon/harness/test_w2d_seed_base.py rust/daemon/harness/test_config_knobs_golden.py -ra --durations=30 --junitxml (Join-Path $env:RUNNER_TEMP 'junit/offline-w2-d-search-harness-regressions.xml')
          exit $LASTEXITCODE
      # This fixture creates a small graph locally; no model is downloaded.
      - name: Offline embedding golden and mutant row
        if: matrix.suite == 'eval'
        timeout-minutes: 10
        shell: pwsh
        run: |
          python -m pip install "onnx==1.22.0" "onnxruntime==1.27.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binaryName = if ($IsWindows) { 'pseudolife-daemon.exe' } else { 'pseudolife-daemon' }
          python -m pytest -q rust/daemon/harness/test_embedding.py -ra --durations=30 --junitxml (Join-Path $env:RUNNER_TEMP 'junit/offline-embedding-golden-and-mutant-row.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/run.py embedding --fixture --golden rust/daemon/harness/goldens/embedding-fixture.json --rust-bin (Join-Path 'rust/target/release' $binaryName) --out (Join-Path $env:RUNNER_TEMP 'embedding-fixture.json')
          exit $LASTEXITCODE
      - name: CLI differential harness
        if: matrix.suite == 'cli'
        # Updater transaction/wrapper acceptance adds about five minutes on
        # the Windows dev VM; keep that allowance beyond the existing step.
        # 22 since #1367 (the G2 default rows), measured on windows-latest:
        # 12:37 without them (batch run 42378632131); with them the step hit
        # 15:00 in batch runs 42388348056 and 42400397903, and pytest alone
        # took 14:42 in dispatch run 42404612150 with only their native arm
        # on Windows. About 16.5 minutes with the rows, plus a third.
        # Self-hosted Windows: 35. Its last pass took 12.7 min (nightly run
        # 42207145241, 2026-11-06); it has hit 22 every night since
        # 2026-11-07. On 2026-11-13 (job 131853441705) pytest had 507 of
        # 660 cases done at 22:00, about 5.4 s per update-transaction case
        # against hosted's 2.5 s; the rest, the wrapper tests and the four
        # golden rows (1.9 min hosted) put it near 32 min. Hosted Windows
        # took 15.8 min that night, so it keeps 22 inside its 35-minute job.
        # test_update_transactions.py is 12.9 of pytest's 13.9 hosted
        # minutes (306 of 660 cases): next, split this step rather than
        # raise it again.
        timeout-minutes: ${{ runner.environment == 'self-hosted' && runner.os == 'Windows' && 35 || 22 }}
        shell: pwsh
        run: |
          $binaryName = if ($IsWindows) { 'pseudolife-stdio.exe' } else { 'pseudolife-stdio' }
          $candidate = (Resolve-Path (Join-Path 'rust/target/release' $binaryName)).Path
          $env:PSEUDOLIFE_RUST_BINARY = $candidate
          $env:PSEUDOLIFE_BACKUP_NATIVE_REQUIRED = '1'
          python -m pytest -q -p no:cacheprovider rust/cli_harness/test_cli_harness.py rust/cli_harness/test_lease.py rust/cli_harness/test_bank.py rust/cli_harness/test_backup.py rust/cli_harness/test_update_transactions.py rust/cli_harness/test_update_wrappers_native.py -ra --durations=30 --junitxml (Join-Path $env:RUNNER_TEMP 'junit/cli-differential-harness.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/cli_harness --row mail --row hook --row episode --row update --golden --candidate $candidate -v --out (Join-Path $env:RUNNER_TEMP 'cli-harness-golden.json')
          exit $LASTEXITCODE
      - name: Prepare disposable PostgreSQL for CLI lease row
        # Every cli shard's daemon harnesses take their banks from it.
        if: startsWith(matrix.suite, 'cli')
        timeout-minutes: 10
        shell: pwsh
        # pg0's initdb inherits the locale on Linux; template1 then retains
        # both the recorded graph-read ordering and the test login's vector.
        env:
          LANG: ${{ runner.os == 'Linux' && 'en_US.UTF-8' || '' }}
          LC_ALL: ${{ runner.os == 'Linux' && 'en_US.UTF-8' || '' }}
        run: |
          python rust/cli_harness/lease_ci.py
          exit $LASTEXITCODE
      - name: CLI lease golden harness
        if: matrix.suite == 'cli'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $binaryName = if ($IsWindows) { 'pseudolife-stdio.exe' } else { 'pseudolife-stdio' }
          $candidate = (Resolve-Path (Join-Path 'rust/target/release' $binaryName)).Path
          python rust/cli_harness --row lease --golden --candidate $candidate -v --out (Join-Path $env:RUNNER_TEMP 'cli-harness-lease.json')
          exit $LASTEXITCODE
      # Local 2026-10-17, 36/35 cases: Windows live 101s + golden 43s,
      # WSL live 67s + golden 39s, controls under 1s; ten minutes is about
      # four times the slower platform (the live pass left with the freeze).
      - name: CLI lease operator golden harness
        if: matrix.suite == 'cli'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $binaryName = if ($IsWindows) { 'pseudolife-stdio.exe' } else { 'pseudolife-stdio' }
          $candidate = (Resolve-Path (Join-Path 'rust/target/release' $binaryName)).Path
          python -m pytest -q -p no:cacheprovider rust/cli_harness/test_lease_operator.py rust/cli_harness/test_lease_transport.py -ra --durations=30 --junitxml (Join-Path $env:RUNNER_TEMP 'junit/cli-lease-operator-differential-harness.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/cli_harness --row lease_operator --golden --candidate $candidate -v --out (Join-Path $env:RUNNER_TEMP 'cli-harness-lease-operator.json')
          exit $LASTEXITCODE
      # Windows local 2026-10-10: 89-action golden 49s + eight live controls 209s
      # + recovery/control tests 38s; allow about twice the measured 296s gate.
      # The eight controls (dream_cursors.py mutants) compared each mutant
      # with the Python oracle live and left with the freeze.
      - name: Dream cursor golden harness
        if: matrix.suite == 'cli-store'
        timeout-minutes: 10
        shell: pwsh
        env:
          PL_HARNESS_SLICE: w3d
        run: |
          $binaryName = if ($IsWindows) { 'dream-contract.exe' } else { 'dream-contract' }
          $candidate = (Resolve-Path (Join-Path 'rust/target/release' $binaryName)).Path
          if (-not $IsWindows) { chmod +x $candidate }
          $env:PL_DREAM_CONTRACT_BINARY = $candidate
          python -m pytest -q rust/daemon/harness/test_dream_cursors.py rust/daemon/harness/test_dream_cursor_cancel.py -ra --durations=30 --junitxml (Join-Path $env:RUNNER_TEMP 'junit/dream-cursor-differential-harness.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/dream_cursors.py golden --ci-fixture --rust-bin $candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PSEUDOLIFE_DAEMON_MUTANT = 'dream-cancel-drop-task'
          $cancelLog = Join-Path $env:RUNNER_TEMP 'dream-cancel-mutant.log'
          python -m pytest -q rust/daemon/harness/test_dream_cursor_cancel.py -k admitted_commit_survives_cancel_and_next_pull > $cancelLog 2>&1
          $cancelExit = $LASTEXITCODE
          Remove-Item Env:PSEUDOLIFE_DAEMON_MUTANT
          Write-Output 'Mutant control dream-cancel-drop-task: the test below MUST fail (expected); this step fails only if the control passes.'
          Get-Content -Tail 20 $cancelLog
          if ($cancelExit -ne 1 -or -not (Select-String -LiteralPath $cancelLog -Pattern 'AssertionError|_queue.Empty' -Quiet)) {
            throw 'Cancelled-waiter ownership control was not rejected by the next-operation check'
          }
          exit 0
      - name: Daemon static HTTP golden
        if: matrix.suite == 'cli-store'
        timeout-minutes: 10
        shell: pwsh
        env:
          PL_HARNESS_SLICE: http
        run: |
          $binaryName = if ($IsWindows) { 'pseudolife-daemon-static.exe' } else { 'pseudolife-daemon-static' }
          $candidate = (Resolve-Path (Join-Path 'rust/target/release' $binaryName)).Path
          $env:PL_STATIC_DEFAULT_BIN = $candidate
          python -m pytest -q rust/daemon/harness/test_static.py -ra --durations=30 --junitxml (Join-Path $env:RUNNER_TEMP 'junit/daemon-static-http-parity.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/run.py golden --rust-bin $candidate --only static-build static-paths static-missing static-root-link --out (Join-Path $env:RUNNER_TEMP 'daemon-static-golden.json')
          exit $LASTEXITCODE
      - name: Retain daemon static parity outcomes
        if: always() && matrix.suite == 'cli-store'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PARITY_ARTIFACT_PREFIX }}daemon-static-${{ runner.os }}
          path: ${{ runner.temp }}/daemon-static-*.json
          if-no-files-found: warn
      - name: Restore graph store executable permission
        if: matrix.suite == 'cli-store' && runner.os == 'Linux'
        run: chmod +x rust/target/release/graph-contract
      - name: Graph store golden harness
        if: matrix.suite == 'cli-store'
        timeout-minutes: 10
        shell: pwsh
        env:
          PL_GRAPH_REQUIRE_RECORDED_LOCALE: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: |
          $binaryName = if ($IsWindows) { 'graph-contract.exe' } else { 'graph-contract' }
          $candidate = (Resolve-Path (Join-Path 'rust/target/release' $binaryName)).Path
          python rust/daemon/harness/gen_graph_unicode.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/test_graph_store_harness.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/graph_store.py golden --candidate $candidate --out (Join-Path $env:RUNNER_TEMP 'graph-store-golden.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/test_graph_read_compare.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/graph_store.py golden --row read --candidate $candidate --out (Join-Path $env:RUNNER_TEMP 'graph-read-golden.json')
          exit $LASTEXITCODE
      - name: Daemon background pruning golden
        if: matrix.suite == 'cli-store'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $binaryName = if ($IsWindows) { 'pseudolife-daemon.exe' } else { 'pseudolife-daemon' }
          $candidate = (Resolve-Path (Join-Path 'rust/target/release' $binaryName)).Path
          $env:PL_HARNESS_SLICE = 'w3i'
          $env:PL_HARNESS_SCRATCH = Join-Path $env:RUNNER_TEMP 'daemon-background-harness'
          python -m pytest -q -p no:cacheprovider rust/daemon/harness/test_background_harness.py -ra --durations=30 --junitxml (Join-Path $env:RUNNER_TEMP 'junit/daemon-background-pruning-golden.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/run.py golden --rust-bin $candidate --only sweep-pruning --no-refusals
          exit $LASTEXITCODE

      - name: Daemon body admission golden
        if: matrix.suite == 'cli-store'
        timeout-minutes: 10
        shell: pwsh
        env:
          PL_HARNESS_SLICE: http
        run: |
          $binaryName = if ($IsWindows) { 'pseudolife-daemon-static.exe' } else { 'pseudolife-daemon-static' }
          $candidate = (Resolve-Path (Join-Path 'rust/target/release' $binaryName)).Path
          python -m pytest -q rust/daemon/harness/test_body_cases.py -ra --durations=30 --junitxml (Join-Path $env:RUNNER_TEMP 'junit/daemon-body-admission-parity.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/run.py golden --rust-bin $candidate --only body-limits body-view-open body-pair-budget body-text-window --out (Join-Path $env:RUNNER_TEMP 'daemon-body-golden.json')
          exit $LASTEXITCODE
      - name: Retain daemon body parity outcomes
        if: always() && matrix.suite == 'cli-store'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PARITY_ARTIFACT_PREFIX }}daemon-body-${{ runner.os }}
          path: ${{ runner.temp }}/daemon-body-*.json
          if-no-files-found: warn
      # The live pass and the six release mutants compared with the Python
      # oracle live and left with the freeze: each mutant's witness case is
      # pinned by these goldens at the status it changes (the PR lists them).
      # The startup refusals and the remote-bind cases have no golden and no
      # Rust test yet, so they still run live in the next step.
      - name: Daemon security admission golden
        if: matrix.suite == 'cli-store'
        timeout-minutes: 10
        shell: pwsh
        env:
          PL_HARNESS_SLICE: http
        run: |
          $defaultName = if ($IsWindows) { 'pseudolife-daemon-static.exe' } else { 'pseudolife-daemon-static' }
          $mutantName = if ($IsWindows) { 'pseudolife-daemon.exe' } else { 'pseudolife-daemon' }
          $candidate = (Resolve-Path (Join-Path 'rust/target/release' $defaultName)).Path
          $mutants = (Resolve-Path (Join-Path 'rust/target/release' $mutantName)).Path
          $env:PL_SECURITY_DEFAULT_BIN = $candidate
          $env:PL_SECURITY_RELEASE_MUTANTS_BIN = $mutants
          python -m pytest -q rust/daemon/harness/test_security_cases.py rust/daemon/harness/test_principals_settle.py -ra --durations=30 --junitxml (Join-Path $env:RUNNER_TEMP 'junit/daemon-security-admission-parity.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/run.py golden --rust-bin $candidate --only security-open security-closed security-encodings security-encoding-priority security-terminal-byte --out (Join-Path $env:RUNNER_TEMP 'daemon-security-golden.json')
          exit $LASTEXITCODE
      # The one live comparison kept after the Python freeze, because no
      # Rust test asserts these security properties yet (rust/ci/inventory.py
      # LIVE_SECURITY_EXCEPTIONS; replace each with a Rust test, then drop
      # it): the daemon refuses to start bound off loopback without a token
      # unless PSEUDOLIFE_MCP_TRUST_BIND is exactly true, and refuses a
      # reserved or unparsable token map (security-refusals); bound on
      # 0.0.0.0, tokenless /api still serves loopback browsers only and a
      # configured bearer still gates it (security-remote-open/-auth).
      - name: Daemon security live checks without a Rust test
        if: matrix.suite == 'cli-store'
        timeout-minutes: 10
        shell: pwsh
        env:
          PL_HARNESS_SLICE: http
        run: |
          $defaultName = if ($IsWindows) { 'pseudolife-daemon-static.exe' } else { 'pseudolife-daemon-static' }
          $mutantName = if ($IsWindows) { 'pseudolife-daemon.exe' } else { 'pseudolife-daemon' }
          $candidate = (Resolve-Path (Join-Path 'rust/target/release' $defaultName)).Path
          $bindFixture = (Resolve-Path (Join-Path 'rust/target/debug' $mutantName)).Path
          if (-not $IsWindows) { chmod +x $bindFixture }
          python rust/daemon/harness/run.py live --rust-bin $candidate --only security-refusals --out (Join-Path $env:RUNNER_TEMP 'daemon-security-refusals.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust/daemon/harness/run.py live --rust-bin $bindFixture --only security-remote-open security-remote-auth --out (Join-Path $env:RUNNER_TEMP 'daemon-security-remote.json')
          exit $LASTEXITCODE
      - name: Retain daemon security parity outcomes
        if: always() && matrix.suite == 'cli-store'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PARITY_ARTIFACT_PREFIX }}daemon-security-${{ runner.os }}
          path: ${{ runner.temp }}/daemon-security-*.json
          if-no-files-found: warn
      - name: Principal store golden harness
        if: matrix.suite == 'cli-store'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $binaryName = if ($IsWindows) { 'pseudolife-daemon.exe' } else { 'pseudolife-daemon' }
          $candidate = (Resolve-Path (Join-Path 'rust/target/release' $binaryName)).Path
          python rust/daemon/harness/principals.py golden --rust-bin $candidate --out (Join-Path $env:RUNNER_TEMP 'principal-golden.json')
          exit $LASTEXITCODE
      - name: Retain principal store outcomes
        if: always() && matrix.suite == 'cli-store'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PARITY_ARTIFACT_PREFIX }}rust-principals-${{ runner.os }}
          path: ${{ runner.temp }}/principal-*.json
          if-no-files-found: error
      # In the single cli job these steps ran after the MCP step had pinned
      # pydantic for the Python oracle; the seeders still import the frozen
      # package, so keep the same pin.
      - name: Keep the oracle's pydantic pin for the startup steps
        id: startup_setup
        if: matrix.suite == 'cli-startup'
        run: python -m pip install "pydantic==2.14.0" "pydantic-core==2.50.0"
      - name: Daemon schema startup parity
        if: matrix.suite == 'cli-startup'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $testName = if ($IsWindows) { 'pseudolife-daemon-storage-test.exe' } else { 'pseudolife-daemon-storage-test' }
          $storageTest = (Resolve-Path (Join-Path 'rust/target/storage-test' $testName)).Path
          if (-not $IsWindows) { chmod +x $storageTest }
          python rust/daemon/harness/schema_ci.py --no-build --rust-test-bin $storageTest --out (Join-Path $env:RUNNER_TEMP 'daemon-schema-parity.json')
          exit $LASTEXITCODE
      - name: Retain daemon schema parity
        if: always() && matrix.suite == 'cli-startup'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PARITY_ARTIFACT_PREFIX }}daemon-schema-parity-${{ runner.os }}
          path: ${{ runner.temp }}/daemon-schema-parity.json
          if-no-files-found: error
      - name: Retain graph store outcomes
        if: always() && matrix.suite == 'cli-store'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PARITY_ARTIFACT_PREFIX }}rust-graph-store-${{ runner.os }}
          path: |
            ${{ runner.temp }}/graph-store-golden.json
            ${{ runner.temp }}/graph-read-golden.json
          if-no-files-found: error
      # The original two parts keep their selectors and separate receipts.
      # The shared-setup barrier keeps disk/lease/setup failures fatal before
      # either part; explicit status permits comparison-failure continuation.
      - name: Daemon resident startup parity
        if: ${{ !cancelled() && matrix.suite == 'cli-startup' && steps.startup_setup.outcome == 'success' }}
        # Windows CI 2026-10-10: about 28s/cell x 25 cells plus clock/guard,
        # about 13 minutes in total; allow twice that validation duration.
        timeout-minutes: 26
        shell: pwsh
        run: |
          python -m pip install "onnx==1.22.0" "onnxruntime==1.27.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testName = if ($IsWindows) { 'pseudolife-daemon-storage-test.exe' } else { 'pseudolife-daemon-storage-test' }
          $candidate = (Resolve-Path (Join-Path 'rust/target/storage-test' $testName)).Path
          if (-not $IsWindows) { chmod +x $candidate }
          python rust/daemon/harness/startup_ci.py --no-build --rust-test-bin $candidate --part ${{ matrix.startup_part }} --out (Join-Path $env:RUNNER_TEMP 'daemon-startup-parity-part1.json')
          exit $LASTEXITCODE
      - name: Daemon resident startup parity part 2
        if: ${{ !cancelled() && matrix.suite == 'cli-startup' && steps.startup_setup.outcome == 'success' }}
        timeout-minutes: 26
        shell: pwsh
        run: |
          python -m pip install "onnx==1.22.0" "onnxruntime==1.27.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testName = if ($IsWindows) { 'pseudolife-daemon-storage-test.exe' } else { 'pseudolife-daemon-storage-test' }
          $candidate = (Resolve-Path (Join-Path 'rust/target/storage-test' $testName)).Path
          if (-not $IsWindows) { chmod +x $candidate }
          python rust/daemon/harness/startup_ci.py --no-build --rust-test-bin $candidate --part 2 --out (Join-Path $env:RUNNER_TEMP 'daemon-startup-parity-part2.json')
          exit $LASTEXITCODE
      - name: Retain daemon resident startup parity
        if: always() && matrix.suite == 'cli-startup'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PARITY_ARTIFACT_PREFIX }}daemon-startup-parity-${{ runner.os }}-${{ matrix.suite }}
          path: |
            ${{ runner.temp }}/daemon-startup-parity*.json
          if-no-files-found: error
      - name: Prepare disposable PostgreSQL for W1-C rows
        if: startsWith(matrix.suite, 'w1c-')
        # Master run 38076979343, 2026-10-10: Windows setup 12s.
        # Five-minute floor because this step is network-bound.
        timeout-minutes: 5
        shell: pwsh
        # pg0's initdb inherits the locale on Linux; template1 then retains
        # both the recorded graph-read ordering and the test login's vector.
        env:
          LANG: ${{ runner.os == 'Linux' && 'en_US.UTF-8' || '' }}
          LC_ALL: ${{ runner.os == 'Linux' && 'en_US.UTF-8' || '' }}
        run: |
          python rust/cli_harness/lease_ci.py
          exit $LASTEXITCODE
      # The W1-C native leaves: each row's terminal and native tests, then the
      # candidate against its committed goldens on disposable homes. Until
      # the Python freeze (14 November 2026) every row also ran live beside
      # this checkout's Python oracle; that pass left CI, and with it the
      # cases marked live-only (Case.golden False, each in its row's .md):
      # transfer's help, no-database refusals and float-tie cases, invite's
      # 31 cases that show wall-clock principals and random codes. transfer,
      # invite and maintainer use the disposable PostgreSQL and test login
      # their shard provisioned; test_login starts its own throwaway
      # clusters from the pg0 bundle and, on Linux, disposable containers of
      # the image built below. Hosted Windows' Docker runs Windows containers
      # only, so its container cases skip there.
      - name: Build the test_login container image
        if: runner.os == 'Linux' && matrix.suite == 'w1c-connection'
        # Master run 38076979343, 2026-10-10: Linux image build 13s.
        # Five-minute floor because this step is network-bound.
        timeout-minutes: 5
        run: docker build -t pseudolife-pg:18 -f ops/Dockerfile.pg ops
      - name: CLI W1-C golden harness
        if: startsWith(matrix.suite, 'w1c-')
        # Twice the per-shard Windows row sums above (38076979343,
        # 2026-10-10). #718's old combined 110m budget used PRs #709/#710:
        # 55m26s/53m37s, after PR #712 exhausted the old 60m limit.
        timeout-minutes: ${{ matrix.w1c_timeout }}
        shell: pwsh
        run: |
          $binaryName = if ($IsWindows) { 'pseudolife-stdio.exe' } else { 'pseudolife-stdio' }
          $candidate = (Resolve-Path (Join-Path 'rust/target/release' $binaryName)).Path
          $rows = @(${{ matrix.w1c_rows }})
          if (($IsLinux -or $IsWindows) -and $rows -contains 'pair') {
            $env:R1_PAIR_CANDIDATE = $candidate
            python -m pytest -q rust/cli_harness/test_pair_terminal.py -ra --durations=30 --junitxml (Join-Path $env:RUNNER_TEMP 'junit/cli-pair-terminal.xml')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if ($rows -contains 'maintainer_setup') {
            $env:R1_PAIR_CANDIDATE = $candidate
            python -m pytest -q rust/cli_harness/test_maintainer_setup_terminal.py rust/cli_harness/test_operator_transport.py rust/cli_harness/test_audit_stats.py rust/cli_harness/test_maintainer_setup_native.py -ra --durations=30 --junitxml (Join-Path $env:RUNNER_TEMP 'junit/cli-setup-terminal.xml')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $golden = $rows | ForEach-Object { '--row'; $_ }
          python rust/cli_harness @golden --golden --candidate $candidate -v --out (Join-Path $env:RUNNER_TEMP 'cli-harness-w1c-golden.json')
          exit $LASTEXITCODE
      - name: Retain CLI harness summaries
        if: always() && (startsWith(matrix.suite, 'cli') || startsWith(matrix.suite, 'w1c-'))
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PARITY_ARTIFACT_PREFIX }}cli-harness-${{ runner.os }}-${{ matrix.suite }}
          path: ${{ runner.temp }}/cli-harness*.json
          if-no-files-found: warn
      - name: Retain parity pytest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PARITY_ARTIFACT_PREFIX }}parity-junit-${{ runner.os }}-${{ matrix.suite }}
          path: ${{ runner.temp }}/junit/*.xml
          # The W1-C shards drive their goldens without pytest.
          if-no-files-found: ignore

  parity-selfhosted:
    # A comparison lane, not a gate (docs/specs/2026-10-19-self-hosted-parity-lane.md):
    # the same matrix and steps as parity-checks, on the maintainer's dev
    # machines. continue-on-error and no place in the Parity gate's needs
    # keep its outcome out of every required check. It runs only on the
    # nightly and manual CI: on a pull request its pending jobs would hold
    # the PR's checks open, and it was kept off master pushes when a newer
    # push could cancel a run whose self-hosted jobs still queued (since
    # 2026-10-29 every master push has a concurrency group of its own; the
    # nightly still covers master). It stays off until the repository variable
    # PARITY_SELFHOSTED_RUNNERS lists the registered runners (JSON, such as
    # ["linux", "windows"]); a job for an unregistered label would queue for
    # a day.
    if: ${{ !cancelled() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'ci')) && (inputs.selfhosted_runners != '' || vars.PARITY_SELFHOSTED_RUNNERS != '') && needs.candidate.result == 'success' && needs.candidate-harness.result == 'success' && needs.fixtures.result == 'success' }}
    name: Parity self-hosted / ${{ matrix.runner }} / ${{ matrix.suite }}
    needs: [scope, candidate, candidate-harness, fixtures]
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.selfhosted_runners || vars.PARITY_SELFHOSTED_RUNNERS || '["off"]') }}
        # Every suite the nightly and manual CI select, less any hosted-only
        # composite: rust/ci/parity_scope.py's selfhosted output.
        suite: ${{ fromJSON(needs.scope.outputs.parity_selfhosted).suite }}
        include: ${{ fromJSON(needs.scope.outputs.parity_selfhosted).include }}
    runs-on: [self-hosted, "pseudolife-parity-${{ matrix.runner }}"]
    # The slowest hosted shard budget (210m) plus the hour a shard may wait
    # for this machine's full suite before it yields.
    timeout-minutes: 270
    env:
      PARITY_ARTIFACT_PREFIX: self-hosted-
      PARITY_YIELD_MINUTES: '60'
      PARITY_MIN_FREE_GB: '8'
    steps: *parity_steps

  source-mutants:
    # Run 38145459384: 92m23s versus the 70m28s baseline; 68 source jobs
    # queued behind the 20-job concurrency cap, with a largest matrix queue
    # of 24m25s, so they left PRs. Since 2026-10-17 they also leave master
    # pushes and run nightly and on manual CI. On master they were 72 of 104
    # jobs and about 550 of 920 runner-minutes (runs 38412458284,
    # 38775578227, 38794022446; Windows shard median 11 min, Linux 5), and
    # all 1,170 shard jobs in the 16 readable master/nightly runs from
    # 2026-10-12 to 2026-10-16 passed. 18 of the 27 push runs in that window
    # were cancelled by a newer push before finishing. A survivor now
    # surfaces at the next nightly (its own concurrency group, so pushes no
    # longer cancel it) instead of after the merge that caused it.
    # Weekly since the Python freeze (14 November 2026, maintainer ruling):
    # the Sunday schedule and manual CI only. They were about 774 of a
    # nightly's 1,762 runner-minutes (nightly run 43414735492, 104 jobs).
    # Each control still compares a mutated candidate with this checkout's
    # frozen Python live (rust/cli_harness/mutants.py); no oracle is
    # selected or exported for it.
    if: ${{ !cancelled() && ((github.event_name == 'schedule' && github.event.schedule == '23 3 * * 0') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'ci')) && needs.candidate.result == 'success' }}
    name: Source mutants / ${{ matrix.os }} / ${{ matrix.shard }}
    # These shards compile their own source copies and consume no rust-job
    # artifact; the final Parity gate still requires both Rust jobs. They
    # read nothing from scope since the freeze (its oracle base left).
    needs: [candidate]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # One shard per line, in sorted order, so that two branches each
        # adding a shard do not conflict on one long line.
        shard:
          - audit-0
          - audit-1
          - audit-2
          - backup-0
          - backup-1
          - backup-2
          - conductor_watch-0
          - conductor_watch-1
          - connect-0
          - connect-1
          - connect-2
          - console-0
          - console-1
          - coordination_recovery-0
          - doctor-0
          - doctor-1
          - doctor-2
          - doctor-3
          - doctor-4
          - episode-0
          - expose-0
          - hook-0
          - hook-1
          - invite-0
          - lease-0
          - lease_operator-0
          - mail-0
          - mail-1
          - maintainer-0
          - maintainer-1
          - maintainer_setup-0
          - migrate_flat-0
          - move-0
          - move-1
          - pair-0
          - pair-1
          - restore-0
          - restore-1
          - restore-2
          - restore-3
          - restore-4
          - restore-5
          - restore-6
          - restore-7
          - restore-8
          - test_login-0
          - test_login-1
          - test_login-2
          - transfer-0
          - transfer-1
          - transfer-2
          - tunnel-0
          - tunnel-1
          - tunnel-2
          - update-0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      - name: Keep only the pinned Rust toolchain
        if: runner.environment != 'self-hosted'
        shell: pwsh
        run: |
          $toolchainFile = Join-Path $env:GITHUB_WORKSPACE 'rust/rust-toolchain.toml'
          $match = Select-String -LiteralPath $toolchainFile -Pattern '^channel = "([^"]+)"$' | Select-Object -First 1
          if (-not $match) { throw "rust/rust-toolchain.toml names no channel; nothing is known to keep" }
          $pinned = $match.Matches[0].Groups[1].Value
          foreach ($line in @(rustup toolchain list)) {
            $name = ($line -split '\s+')[0]
            if ($name -and -not $name.StartsWith("$pinned-")) {
              rustup toolchain uninstall $name
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          rustup toolchain list
          exit $LASTEXITCODE
      # The Rust caches' key starts with this UTC ISO week (the Rust job's
      # rust-cache step says why), so its entries are never a week old.
      - name: Name this week's Rust cache
        id: cache_week
        shell: pwsh
        run: |
          $now = [DateTime]::UtcNow
          $week = '{0}-W{1:D2}' -f [System.Globalization.ISOWeek]::GetYear($now), [System.Globalization.ISOWeek]::GetWeekOfYear($now)
          "week=$week" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Rust cache week: $week"
      # One shard per OS saves the shared mutant target's dependencies; all
      # 37 restore it. Every shard saved under this one key until 2026-10-24,
      # so each nightly that changed it raced 37 uploads for one entry.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-${{ steps.cache_week.outputs.week }}
          workspaces: rust -> ${{ runner.temp }}/source-mutants-target/mutant
          key: cli-source-mutants
          cache-on-failure: true
          save-if: ${{ matrix.shard == 'audit-0' }}
      - name: Install source harness dependencies
        # Network-bound setup keeps the existing ten-minute dependency floor.
        timeout-minutes: 10
        shell: pwsh
        run: |
          python -m pip install --no-compile --index-url https://download.pytorch.org/whl/cpu "torch==2.13.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-compile -e ".[dev,lite]" "mcp==2.2.0"
          exit $LASTEXITCODE
      - name: Prepare disposable PostgreSQL for source controls
        # Linux 2026-10-11: fixture setup under 5s; network-bound floor.
        timeout-minutes: 5
        shell: pwsh
        env:
          LANG: ${{ runner.os == 'Linux' && 'en_US.UTF-8' || '' }}
          LC_ALL: ${{ runner.os == 'Linux' && 'en_US.UTF-8' || '' }}
        run: |
          python rust/cli_harness/lease_ci.py
          exit $LASTEXITCODE
      - name: Install offline episode fixture dependencies
        if: startsWith(matrix.shard, 'episode-')
        timeout-minutes: 5
        run: python -m pip install "onnx==1.22.0" "onnxruntime==1.27.0" "optimum==2.1.0" "optimum-onnx==0.1.0"
      - name: Build the test_login source-control image
        if: runner.os == 'Linux' && startsWith(matrix.shard, 'test_login-')
        # Master 38076979343: Linux image build 13s; network-bound floor.
        timeout-minutes: 5
        run: docker build -t pseudolife-pg:18 -f ops/Dockerfile.pg ops
      - name: CLI source mutants
        # Linux 2026-10-11: slowest eight-control selection 81s plus
        # 65s cold compile; six minutes is about twice that cold bound.
        # Linux 2026-11-13 (nightly run 43414735492): move-0 caught all 8
        # mutants at 6m05s and was killed at 6m06s (job 131853444061;
        # 2m04s to the first verdict, then about 34s per mutant); audit-0,
        # transfer-0/1, maintainer-1 and test_login-0 took 5m38s-5m43s,
        # and the night before (run 43209050039) audit-1 and maintainer-0
        # took 5m42s-5m46s. One limit covers every Linux shard: ten minutes.
        # Windows is provisional, with startup headroom inside 56m; its
        # slowest shards took 11m21s-11m52s on those two nights.
        timeout-minutes: ${{ runner.os == 'Linux' && 10 || 30 }}
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/source-mutants-target
        run: |
          python rust/ci/run_coverage.py --source-shard ${{ matrix.shard }} --out-dir (Join-Path $env:RUNNER_TEMP 'h5-source')
          exit $LASTEXITCODE
      - name: Retain source-control witnesses and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-mutants-${{ runner.os }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/h5-source/*.json
          if-no-files-found: error

  daemon-image:
    name: Rust daemon / disposable image
    needs: scope
    # A master push skips it when its merged batch passed it on the same
    # tree: the batch's base-to-head image inputs are the push's.
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.mode != 'ci' || needs.scope.result == 'success') && needs.scope.outputs.push_passed != 'true' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'ci') && needs.scope.outputs.rust != 'false' && !contains(fromJSON(needs.scope.outputs.batch_passed || '[]'), 'Rust daemon / disposable image') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Select changed image inputs
        id: image-inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: python rust/daemon/container_inputs.py --base "$BASE_SHA" --head "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Check the opt-in container contract
        run: python rust/daemon/test_container.py
      - name: Build the CPU image without publishing
        if: steps.image-inputs.outputs.needed == 'true'
        run: docker build --progress=plain -f ops/Dockerfile.daemon-rust -t w3j-daemon-rust:prep --build-arg GIT_SHA="$GITHUB_SHA" --build-arg GIT_DIRTY=false --build-arg BUILD_SOURCE=ci .
      - name: Check the installed native CLI without network access
        if: steps.image-inputs.outputs.needed == 'true'
        run: docker run --rm --network none w3j-daemon-rust:prep pseudolife-mcp version
      - name: Restore the pinned model cache
        if: steps.image-inputs.outputs.needed == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/daemon-models
          key: daemon-models-fp32-${{ runner.os }}-${{ hashFiles('rust/daemon/src/model_provision.rs') }}
      - name: Prove offline health and authenticated CPU query inference
        if: steps.image-inputs.outputs.needed == 'true'
        env:
          W3J_RUST_TOKEN: w3j-disposable-ci-token
          W3J_MODELS_CACHE: ${{ runner.temp }}/daemon-models
        run: |
          project="w3j-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$W3J_MODELS_CACHE"
          # The image's daemon runs as 10001:10001 and the model tree is
          # owner-only; cleanup hands the cache back for actions/cache.
          sudo chown -R 10001:10001 "$W3J_MODELS_CACHE"
          cat > "$RUNNER_TEMP/model-cache.yml" <<'YAML'
          volumes:
            models:
              driver: local
              driver_opts:
                type: none
                o: bind
                device: ${W3J_MODELS_CACHE}
          YAML
          compose() {
            docker compose -p "$project" -f ops/docker-compose.rust.yml -f "$RUNNER_TEMP/model-cache.yml" "$@"
          }
          cleanup() {
            result=$?
            if [ "$result" -ne 0 ]; then compose logs || true; fi
            compose down --volumes || result=1
            sudo chown -R "$(id -u):$(id -g)" "$W3J_MODELS_CACHE" || result=1
            exit "$result"
          }
          trap cleanup EXIT
          compose run --rm --no-deps rust-daemon pseudolife-daemon provision models
          compose up --no-build --wait --wait-timeout 180
          python rust/daemon/container_probe.py --timeout 180
          compose logs --no-color rust-daemon > "$RUNNER_TEMP/rust-daemon-startup.log"
          python rust/daemon/container_probe.py --startup-log "$RUNNER_TEMP/rust-daemon-startup.log"
      - name: Prove network-disabled model reads after a cold restart
        if: steps.image-inputs.outputs.needed == 'true'
        run: |
          python -m pip install --no-compile 'psycopg[binary]>=3.2.4'
          # The daemon account reads the owner-only model tree; hand it back after.
          sudo chown -R 10001:10001 "$RUNNER_TEMP/daemon-models"
          trap 'sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/daemon-models"' EXIT
          python rust/daemon/harness/image_model_proof.py --image w3j-daemon-rust:prep --postgres-image pgvector/pgvector:pg18 --models "$RUNNER_TEMP/daemon-models" --out "$RUNNER_TEMP/image-model-proof.json"
      - name: Retain network-disabled model proof
        if: always() && steps.image-inputs.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rust-image-model-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-model-proof.json
          if-no-files-found: error
          retention-days: 30
  parity:
    # Only a PR, a merge group, a master push or a weekday nightly may skip
    # the CLI source matrix; the Sunday weekly run and manual CI require it to
    # pass, never a skip or failure. A nightly reusing a successful push on
    # the exact SHA skips the Rust and parity jobs. A PR or merge group that
    # scope classified as documentation-only skips the Rust, candidate and
    # parity jobs, a PR scope marked not full (any branch but integrate/*)
    # skips the candidate and parity jobs, and a master push whose merged
    # batch passed every parity pair (parity_any false) skips parity-checks;
    # any other skip still fails.
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.mode == 'ci')
    name: Parity / ${{ matrix.os }}
    needs: [scope, rust, candidate, parity-checks, source-mutants]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      # A cancelled needed job fails this step and skips the verdict, the
      # same result the verdict gives it, so the failed step names the cause:
      # ops/integrate.py admits such a head as cancelled, not failing.
      - name: A needed job was cancelled
        if: ${{ contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: Require every Rust and parity job to pass
        if: ${{ !contains(needs.*.result, 'cancelled') }}
        shell: pwsh
        env:
          GATE_RESULTS: ${{ toJSON(needs) }}
          GATE_EVENT: ${{ github.event_name }}
          GATE_SCHEDULE: ${{ github.event.schedule }}
        run: |
          $results = ConvertFrom-Json $env:GATE_RESULTS -AsHashtable
          $docsOnly = ($env:GATE_EVENT -ceq 'pull_request' -or $env:GATE_EVENT -ceq 'merge_group') -and $results['scope'].result -ceq 'success' -and $results['scope'].outputs.rust -ceq 'false'
          $fastPr = $env:GATE_EVENT -ceq 'pull_request' -and $results['scope'].result -ceq 'success' -and $results['scope'].outputs.full -ceq 'false'
          $pushPassed = $env:GATE_EVENT -ceq 'schedule' -and $results['scope'].result -ceq 'success' -and $results['scope'].outputs.push_passed -ceq 'true'
          $noPairs = $env:GATE_EVENT -ceq 'push' -and $results['scope'].result -ceq 'success' -and $results['scope'].outputs.parity_any -ceq 'false'
          foreach ($job in @('rust', 'candidate', 'parity-checks')) {
            $skipChosen = $docsOnly -or ($fastPr -and $job -cne 'rust') -or ($pushPassed -and $job -cne 'candidate') -or ($noPairs -and $job -ceq 'parity-checks')
            if ($results[$job].result -cne 'success' -and -not ($skipChosen -and $results[$job].result -ceq 'skipped')) {
              Write-Error "$job did not succeed"
              exit 1
            }
          }
          $sourceResult = $results['source-mutants'].result
          $weekday = $env:GATE_EVENT -ceq 'schedule' -and $env:GATE_SCHEDULE -cne '23 3 * * 0'
          if ($sourceResult -cne 'success' -and -not (($env:GATE_EVENT -ceq 'pull_request' -or $env:GATE_EVENT -ceq 'merge_group' -or $env:GATE_EVENT -ceq 'push' -or $weekday) -and $sourceResult -ceq 'skipped')) {
            Write-Error "source-mutants did not succeed outside the PR, merge-group, push and weekday-nightly skip exception"
            exit 1
          }

  # A stress loop (mode=stress): run one selection on N fresh hosted runners
  # and report every iteration (rust/ci/stress.py). It compares against this
  # checkout's Python on any branch; branch dispatches also bind an event oracle
  # from the merge base with master, frozen once by the plan for every iteration.
  # Inputs reach the scripts only through env,
  # never inlined into a script.
  stress-plan:
    name: Stress / plan
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'stress'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      iterations: ${{ steps.plan.outputs.iterations }}
      kind: ${{ steps.plan.outputs.kind }}
      # true for a cargo selection whose tests need a disposable PostgreSQL
      # (stress.py CARGO_DATABASE_PROFILES); the other kinds always get one.
      postgres: ${{ steps.plan.outputs.postgres }}
      oracle_base: ${{ steps.oracle.outputs.oracle_base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Freeze the branch-stress oracle base
        id: oracle
        # Actions string comparisons ignore case; Git branch refs do not.
        shell: python
        run: |
          import os
          import subprocess
          if os.environ["GITHUB_REF"] != "refs/heads/master":
              base = subprocess.check_output(
                  ["git", "rev-parse", "--verify", "refs/remotes/origin/master^{commit}"], text=True).strip()
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write(f"oracle_base={base}\n")
      - name: Check the selection and list the iterations
        id: plan
        env:
          STRESS_SELECTION: ${{ inputs.selection }}
          STRESS_ITERATIONS: ${{ inputs.iterations }}
        run: python3 rust/ci/stress.py plan --selection "$STRESS_SELECTION" --iterations "$STRESS_ITERATIONS" --github-output "$GITHUB_OUTPUT"

  # A cargo selection's test binaries, compiled once with the Rust job's
  # toolchain, lockfile, profile and default features, into a nextest
  # archive every iteration runs. It runs on the iterations' OS: a hosted
  # runner's checkout path is the same in every job, so the paths the tests
  # compile in with env!() hold; each iteration checks that before running.
  stress-build:
    name: Stress / build ${{ inputs.os }}
    needs: stress-plan
    if: ${{ !cancelled() && needs.stress-plan.result == 'success' && needs.stress-plan.outputs.kind == 'cargo' }}
    runs-on: ${{ inputs.os }}
    # The Rust job's budget; this builds a subset of what it builds.
    timeout-minutes: 45
    env:
      STRESS_SELECTION: ${{ inputs.selection }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      - name: Keep only the pinned Rust toolchain
        if: runner.environment != 'self-hosted'
        shell: pwsh
        run: |
          $toolchainFile = Join-Path $env:GITHUB_WORKSPACE 'rust/rust-toolchain.toml'
          $match = Select-String -LiteralPath $toolchainFile -Pattern '^channel = "([^"]+)"$' | Select-Object -First 1
          if (-not $match) { throw "rust/rust-toolchain.toml names no channel; nothing is known to keep" }
          $pinned = $match.Matches[0].Groups[1].Value
          foreach ($line in @(rustup toolchain list)) {
            $name = ($line -split '\s+')[0]
            if ($name -and -not $name.StartsWith("$pinned-")) {
              rustup toolchain uninstall $name
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          rustup toolchain list
          exit $LASTEXITCODE
      # The Rust caches' key starts with this UTC ISO week (the Rust job's
      # rust-cache step says why), so its entries are never a week old.
      - name: Name this week's Rust cache
        id: cache_week
        shell: pwsh
        run: |
          $now = [DateTime]::UtcNow
          $week = '{0}-W{1:D2}' -f [System.Globalization.ISOWeek]::GetYear($now), [System.Globalization.ISOWeek]::GetWeekOfYear($now)
          "week=$week" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Rust cache week: $week"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-${{ steps.cache_week.outputs.week }}
          workspaces: rust
          shared-key: stress-tests
          cache-on-failure: true
      - name: Install pinned nextest in the runner temporary directory
        shell: pwsh
        run: |
          $nextestRoot = Join-Path $env:RUNNER_TEMP 'nextest-0.9.146'
          New-Item -ItemType Directory -Force -Path $nextestRoot | Out-Null
          if ($IsWindows) {
            $nextestArchive = Join-Path $env:RUNNER_TEMP 'nextest.zip'
            Invoke-WebRequest 'https://get.nexte.st/0.9.146/windows' -OutFile $nextestArchive
            Expand-Archive -LiteralPath $nextestArchive -DestinationPath $nextestRoot
          } else {
            $nextestArchive = Join-Path $env:RUNNER_TEMP 'nextest.tar.gz'
            Invoke-WebRequest 'https://get.nexte.st/0.9.146/linux' -OutFile $nextestArchive
            tar -xzf $nextestArchive -C $nextestRoot
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $nextestRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build the selected test binaries into a nextest archive
        shell: pwsh
        run: |
          python rust/ci/stress.py archive --selection $env:STRESS_SELECTION --archive-file (Join-Path $env:RUNNER_TEMP 'stress-tests.tar.zst')
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: stress-tests-${{ runner.os }}
          path: |
            ${{ runner.temp }}/stress-tests.tar.zst
            ${{ runner.temp }}/stress-tests.tar.zst.workspace
          if-no-files-found: error

  stress:
    name: Stress / ${{ inputs.os }} / ${{ matrix.iteration }}
    needs: [stress-plan, candidate, candidate-harness, stress-build]
    if: ${{ !cancelled() && needs.stress-plan.result == 'success' && needs.candidate.result == 'success' && needs.candidate-harness.result == 'success' && (needs.stress-plan.outputs.kind != 'cargo' || needs.stress-build.result == 'success') }}
    strategy:
      fail-fast: false
      # Half the account's 20-job cap, so a loop never starves other runs.
      max-parallel: 10
      matrix:
        iteration: ${{ fromJSON(needs.stress-plan.outputs.iterations) }}
    runs-on: ${{ inputs.os }}
    # The slowest parity shard's budget; one iteration is one selection.
    timeout-minutes: 45
    env:
      STRESS_SELECTION: ${{ inputs.selection }}
      STRESS_KIND: ${{ needs.stress-plan.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record the runner image and CPU count
        shell: pwsh
        run: |
          $memory = [math]::Round([GC]::GetGCMemoryInfo().TotalAvailableMemoryBytes / 1GB, 1)
          $image = if ($env:ImageOS) { "$env:ImageOS $env:ImageVersion" } else { 'not a hosted image' }
          $facts = "Runner: $env:RUNNER_OS $env:RUNNER_ARCH ($env:RUNNER_ENVIRONMENT), image $image, $([Environment]::ProcessorCount) logical CPUs, $memory GB memory"
          Write-Output $facts
          if ($env:GITHUB_STEP_SUMMARY) { $facts | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      # A cargo iteration gets what the Rust job's Nextest step has: the
      # Python SDK fixture dependency, no checkout install, no PostgreSQL
      # and no event oracle. A cargo selection with a database profile also
      # gets the checkout install (lease_ci.py and pgdisposable import it;
      # it brings the embedding fixture's numpy, onnx and tokenizers and the
      # onnxruntime wheel whose library ORT_DYLIB_PATH names) and PostgreSQL.
      - name: Install the Python SDK fixture dependency
        if: env.STRESS_KIND == 'cargo'
        run: python -m pip install "mcp==2.2.0"
      - name: Install checkout and test dependencies
        if: env.STRESS_KIND != 'cargo' || needs.stress-plan.outputs.postgres == 'true'
        timeout-minutes: 15
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install "setuptools>=68" wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-compile --index-url https://download.pytorch.org/whl/cpu "torch==2.13.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-compile -e ".[dev,lite]" "mcp==2.2.0" "onnx==1.22.0" "onnxruntime==1.27.0" "optimum==2.1.0" "optimum-onnx==0.1.0" "pydantic==2.14.0" "pydantic-core==2.50.0"
          exit $LASTEXITCODE
      - uses: actions/download-artifact@v4
        with:
          name: rust-shim-${{ runner.os }}
          path: rust/target/release
      - name: Download harness candidate
        uses: actions/download-artifact@v4
        with:
          name: rust-shim-harness-${{ runner.os }}
          path: rust/target/release
      - name: Restore executable permission
        if: runner.os == 'Linux'
        run: chmod +x rust/target/release/*
      - name: Install pinned nextest in the runner temporary directory
        if: env.STRESS_KIND == 'cargo'
        shell: pwsh
        run: |
          $nextestRoot = Join-Path $env:RUNNER_TEMP 'nextest-0.9.146'
          New-Item -ItemType Directory -Force -Path $nextestRoot | Out-Null
          if ($IsWindows) {
            $nextestArchive = Join-Path $env:RUNNER_TEMP 'nextest.zip'
            Invoke-WebRequest 'https://get.nexte.st/0.9.146/windows' -OutFile $nextestArchive
            Expand-Archive -LiteralPath $nextestArchive -DestinationPath $nextestRoot
          } else {
            $nextestArchive = Join-Path $env:RUNNER_TEMP 'nextest.tar.gz'
            Invoke-WebRequest 'https://get.nexte.st/0.9.146/linux' -OutFile $nextestArchive
            tar -xzf $nextestArchive -C $nextestRoot
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $nextestRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/download-artifact@v4
        if: env.STRESS_KIND == 'cargo'
        with:
          name: stress-tests-${{ runner.os }}
          path: ${{ runner.temp }}/stress-tests
      # Best effort for selections that do not consume the event oracle.
      # Branch stress freezes the merge base with master. Oracle-dependent
      # selections still fail if binding fails, including an unaccepted
      # production source pin. Stress is a manual dispatch; no pull request,
      # batch, push or scheduled run starts it.
      - name: Bind the event-selected Python oracle when the dispatch has one
        continue-on-error: true
        shell: pwsh
        env:
          GITHUB_REF: ${{ github.ref }}
          PSEUDOLIFE_PORT_DISPATCH_BASE: ${{ needs.stress-plan.outputs.oracle_base }}
        run: |
          python -m evals.rust_port.oracle_selection --out (Join-Path $env:RUNNER_TEMP 'oracle-selection.json') --github-env $env:GITHUB_ENV
          exit $LASTEXITCODE
      # The Rust job's Nextest step points cli_version_contract at the
      # checkout's pyproject.toml; a cargo iteration does the same.
      - name: Point the Rust identity contract at the checkout's package metadata
        if: env.STRESS_KIND == 'cargo'
        shell: pwsh
        working-directory: .
        run: |
          "PSEUDOLIFE_PORT_ORACLE_ROOT=$env:GITHUB_WORKSPACE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare disposable PostgreSQL
        if: env.STRESS_KIND != 'cargo' || needs.stress-plan.outputs.postgres == 'true'
        timeout-minutes: 10
        shell: pwsh
        env:
          LANG: ${{ runner.os == 'Linux' && 'en_US.UTF-8' || '' }}
          LC_ALL: ${{ runner.os == 'Linux' && 'en_US.UTF-8' || '' }}
        run: |
          python rust/cli_harness/lease_ci.py
          exit $LASTEXITCODE
      # test_login's container cases need the image the W1-C connection
      # shard builds; hosted Windows runs Windows containers only, so the row
      # skips those cases there.
      - name: Build the test_login container image
        if: runner.os == 'Linux' && contains(env.STRESS_SELECTION, 'test_login')
        # Master run 38076979343, 2026-10-10: Linux image build 13s.
        # Five-minute floor because this step is network-bound.
        timeout-minutes: 5
        run: docker build -t pseudolife-pg:18 -f ops/Dockerfile.pg ops
      - name: Run the selection once
        shell: pwsh
        run: |
          python rust/ci/stress.py run --selection $env:STRESS_SELECTION --iteration ${{ matrix.iteration }} --candidates rust/target/release --archive-file (Join-Path $env:RUNNER_TEMP 'stress-tests/stress-tests.tar.zst') --out (Join-Path $env:RUNNER_TEMP 'stress/stress-row-${{ matrix.iteration }}.json')
          exit $LASTEXITCODE
      - name: Retain this iteration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-row-${{ matrix.iteration }}
          path: ${{ runner.temp }}/stress/
          if-no-files-found: warn

  stress-report:
    name: Stress report
    needs: [stress-plan, stress]
    if: ${{ always() && needs.stress-plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        # A loop where no iteration ran uploads nothing; the report then
        # names every iteration "no result".
        continue-on-error: true
        with:
          pattern: stress-row-*
          path: stress-rows
          # Select the whole workflow run through REST, so rows retained
          # from earlier attempts accompany the one replacement row.
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          repository: ${{ github.repository }}
      - name: Read every stress job attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 rust/ci/stress_history.py --out stress-job-history.json
      - name: Join the iterations
        env:
          STRESS_SELECTION: ${{ inputs.selection }}
          STRESS_ITERATIONS: ${{ inputs.iterations }}
          STRESS_OS: ${{ inputs.os }}
        run: python3 rust/ci/stress.py report --selection "$STRESS_SELECTION" --iterations "$STRESS_ITERATIONS" --os "$STRESS_OS" --rows stress-rows --out stress-report.json --summary "$GITHUB_STEP_SUMMARY" --job-history stress-job-history.json
      - name: Retain the stress report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-report-${{ github.run_attempt }}
          path: stress-report.json
          if-no-files-found: warn
