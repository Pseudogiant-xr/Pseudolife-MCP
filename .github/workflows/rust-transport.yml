name: Optional Rust transport parity

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-transport-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the workflow trigger unconditional so docs-only PRs still receive a
  # completed check; only the expensive matrix depends on changed paths.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      transport: ${{ steps.filter.outputs.transport }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            transport:
              - 'rust/**/*.rs'
              - 'rust/**/Cargo.toml'
              - 'rust/**/Cargo.lock'
              - 'rust/**/.cargo/**'
              - 'rust/**/rust-toolchain*'
              - '.cargo/**'
              - 'rust-toolchain*'
              - 'pseudolife_memory/**/*.py'
              - 'ops/shim*.py'
              - 'ops/client_credentials.py'
              - 'ops/update_clients.py'
              - 'pyproject.toml'
              - 'setup.py'
              - 'setup.cfg'
              - 'uv.lock'
              - 'requirements*.txt'
              - 'ops/requirements*.txt'
              - 'tests/test_*transport*.py'
              - 'tests/test_shim*.py'
              - 'tests/test_credentials.py'
              - 'tests/test_coordination*.py'
              - 'tests/test_repository_claims.py'
              - 'tests/test_mcp*.py'
              - 'tests/test_codex*.py'
              - 'evals/bench_rust_transport.py'
              - '.github/workflows/rust-transport.yml'
  transport:
    needs: changes
    if: needs.changes.outputs.transport == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: "-1"
      HF_HUB_OFFLINE: "1"
      RUSTUP_TOOLCHAIN: "1.94.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install client-only fixture dependencies
        run: python -m pip install "mcp>=2.1,<2.2" "httpx>=0.27" "httpx2>=2.5.0" "anyio>=4" "pyyaml>=6" "psutil>=5.9" pytest cryptography
      - name: Install the validated Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/http-transport -> target
          cache-targets: "true"
          cache-bin: "false"
          key: ${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('rust/http-transport/Cargo.lock') }}
      - name: Build the optional helper
        run: cargo +1.94.0 build --locked -j1 --manifest-path rust/http-transport/Cargo.toml
      - name: Rust contract tests
        run: cargo +1.94.0 test --locked -j1 --manifest-path rust/http-transport/Cargo.toml
      - name: Real HTTP and stdio parity, including recovery through Rust
        # These files need only disposable listeners and client dependencies;
        # bypass the daemon/model/PG fixtures rather than installing that stack.
        run: >-
          python -c "import os,pathlib,subprocess,sys,tempfile;
          binary=pathlib.Path('rust/http-transport/target/debug') / ('pseudolife-http.exe' if os.name=='nt' else 'pseudolife-http');
          temporary=tempfile.TemporaryDirectory(prefix='pseudolife-http-ci-');
          env={k:v for k,v in os.environ.items() if not k.startswith('PSEUDOLIFE_')};
          env.update(CODEX_HOME=temporary.name,PSEUDOLIFE_MCP_DAEMON_URL='http://127.0.0.1:1',PSEUDOLIFE_MCP_RUST_HTTP=str(binary.resolve()),PSEUDOLIFE_RUST_TEST_BINARY=str(binary.resolve()));
          result=subprocess.run([sys.executable,'-m','pytest','--noconftest','tests/test_rust_transport.py','tests/test_shim_transport_recovery.py','-q','-rs'],env=env);
          temporary.cleanup(); sys.exit(result.returncode)"
