# Python is frozen since 14 November 2026 (maintainer ruling): an ordinary
# pull request whose own net change touches pseudolife_memory/ (outside the
# Console build output under pseudolife_memory/web/static/) fails this check,
# and the fix is to make the change in Rust. rust/ci/python_freeze.py decides
# on the diff's paths and the exact label `freeze-exception`, which only
# someone with triage access can apply, for a change the maintainer ruled an
# exception. Its own workflow, so that labelling a pull request (labeled,
# unlabeled) reruns only this check, not every ci.yml lane; removing the
# label brings the refusal back, and a retargeted pull request (edited) is
# judged again. This check is early feedback: the gate is
# `ops/integrate.py build`, which applies master's guard to what each
# member's merge changes on the batch, and `open` and `merge`, which judge
# the whole batch again with fresh labels. That is why an integration batch
# is exempt here, not because its members passed this check (a member's own
# run can be absent, queued or cancelled).
name: Python freeze

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read
  # To read the pull request's labels as they are when the job runs.
  pull-requests: read

# The newest event on a pull request decides: a label change supersedes an
# in-flight check of the same pull request.
concurrency:
  group: python-freeze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-freeze:
    name: Python freeze
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The merge commit and its base parent: the pull request's own change.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Refuse changes to the frozen Python package
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        # The base commit's copy of the script decides, so an edit to
        # python_freeze.py cannot change its own verdict (the pull request
        # that adds it, with no copy on its base, runs its own). This
        # workflow file itself comes from the pull request, so an edit to it
        # can pass this check: review catches that, and batch admission,
        # which uses master's guard, does not depend on it.
        #
        # The labels are read from the API when the job runs, not from the
        # event: a rerun replays its event's payload, so a run made before
        # `freeze-exception` was added would fail again on every rerun, and
        # one made before the label was removed would pass. A failed read
        # judges with no labels, which refuses only a change that needs the
        # exception: rerun once the API answers.
        run: |
          if ! labels=$(gh api "repos/$BASE_REPO/pulls/$PR_NUMBER" --jq '[.labels[].name]'); then
            echo "::warning::could not read the pull request's labels; judging without them (rerun this job once the API answers)"
            labels='[]'
          fi
          script="$RUNNER_TEMP/python_freeze.py"
          if ! git show HEAD^1:rust/ci/python_freeze.py > "$script" 2>/dev/null; then
            cp rust/ci/python_freeze.py "$script"
          fi
          python3 "$script" --head-ref "$HEAD_REF" --head-repo "$HEAD_REPO" --base-repo "$BASE_REPO" --labels "$labels"
