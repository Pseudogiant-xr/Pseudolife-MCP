[package]
name = "pl-spike-daemon"
version = "0.0.0"
edition = "2021"
publish = false
description = "Contract-first spike: Pseudolife daemon read path (health, bearer gate, hydration, search) in Rust"

# Standalone crate: deliberately not a member of the rust/ workspace.
[workspace]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
form_urlencoded = "1"
regex = "1"
percent-encoding = "2"
anyhow = "1"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic", "ndarray", "std"] }
ndarray = "0.16"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }

[profile.release]
debug = false
