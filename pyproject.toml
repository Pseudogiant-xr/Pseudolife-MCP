[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pseudolife-mcp"
version = "0.15.0"
description = "Pseudolife persistent long-term memory for MCP-compatible coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

# Core deps — same memory stack as Pseudolife (torch + MIRAS + ChromaDB),
# minus the LLM backends, FastAPI, and Electron-side machinery. MCP SDK on
# top so MCP-compatible clients can attach over stdio or Streamable HTTP.
dependencies = [
    "torch>=2.1.0",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "chromadb>=0.5.0",
    # Migrated to SDK v2 (2026-08-25, spec 2026-08-25-mcp-v2-session-identity):
    # serves protocol 2026-07-28 plus every earlier revision. Floor 2.1 —
    # 2.0.x shipped with the ping regression (#3273) fixed only in 2.1.0.
    "mcp>=2.1,<3",
    # Declared 2026-08-25: `mcp_server.py` imports `pydantic.Field` directly
    # to attach per-argument descriptions to the tool inputSchemas, so it is
    # a first-party import now, not merely mcp's transitive dependency. The
    # floor matches what the mcp SDK already requires.
    "pydantic>=2.12,<3",
    "pypdf>=4.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "uvicorn>=0.30",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-xdist>=3.5",
]
# NLI contradiction scorer — heavy (~278 MB DeBERTa-xsmall checkpoint).
# Off by default; the four-path contradiction detector still runs without it.
nli = [
    "transformers>=4.40",
]
# Cross-encoder reranker — small (~80 MB MS MARCO MiniLM-L-6-v2).
# Off by default; flip ``memory.reranker.enabled = True`` in config or
# pass ``rerank=True`` per call to enable. Bumps the floor on
# sentence-transformers so the CrossEncoder API is stable; the rest of
# the codebase already pulls sentence-transformers in for the embedder.
rerank = [
    "sentence-transformers>=2.5",
]
# Optional higher-quality PDF text extraction (Chromium PDFium bindings,
# Apache-2.0/BSD-3). The core pypdf path works without it.
pdf = [
    "pypdfium2>=4",
]
# Zero-config lite tier — embedded PostgreSQL (PG 18 + pgvector 0.8.5)
# via pg0-embedded; the daemon starts/attaches it when no
# PSEUDOLIFE_MCP_DATABASE_URL is set. Upper-bounded deliberately: the
# bundled PG major must match storage/embedded_pg.py::EXPECTED_PG_MAJOR
# (18) — a silent major bump in a new pg0 wheel would strand existing
# embedded banks (cross-major pgdata cannot start). 0.15.1 verified on
# Windows 2026-08-14: crash recovery preserves data, attach-if-running
# works, vector(1024)+HNSW pass.
lite = [
    "pg0-embedded>=0.15.1,<0.16",
]
# ONNX embedding backend — ~3x faster single-text encode on CPU with
# bit-identical embeddings. Off by default; set ``embedding.backend =
# "onnx"`` in config to enable (falls back to torch when unavailable).
# sentence-transformers' native ONNX backend delegates to optimum;
# onnxruntime itself is already a transitive dep (ChromaDB).
onnx = [
    "sentence-transformers>=3.2",
    "optimum[onnxruntime]>=1.23",
]

[project.urls]
Homepage = "https://github.com/Pseudogiant-xr/Pseudolife-MCP"
Repository = "https://github.com/Pseudogiant-xr/Pseudolife-MCP"
Changelog = "https://github.com/Pseudogiant-xr/Pseudolife-MCP/blob/master/CHANGELOG.md"
Issues = "https://github.com/Pseudogiant-xr/Pseudolife-MCP/issues"

[project.scripts]
pseudolife-mcp = "pseudolife_memory.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pseudolife_memory*"]

[tool.setuptools.package-data]
# The Cortex Console is served from inside the package — the wheel must
# carry its static assets (css/fonts/js/index.html) or a pip install gets
# a 404 console.
"pseudolife_memory.web" = ["static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: needs external infrastructure (a built docker image); skips itself when absent",
]
